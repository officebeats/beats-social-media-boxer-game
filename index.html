<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CRASH OUT: RING RUSH (v1.0-alpha) — PICO-8 Native Transparent Boxing</title>
  <style>
    :root {
      --pico-black: #000000;
      --pico-dark-blue: #1D2B53;
      --pico-dark-purple: #7E2553;
      --pico-dark-green: #008751;
      --pico-brown: #AB5236;
      --pico-dark-gray: #5F574F;
      --pico-light-gray: #C2C3C7;
      --pico-white: #FFF1E8;
      --pico-red: #FF004D;
      --pico-orange: #FFA300;
      --pico-yellow: #FFEC27;
      --pico-green: #00E436;
      --pico-blue: #29ADFF;
      --pico-lavender: #83769C;
      --pico-pink: #FF77A8;
      --pico-peach: #FFCCAA;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--pico-black);
      color: var(--pico-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* 100% NATIVE EDGE-TO-EDGE PICO-8 GAME CONTAINER */
    .pico8-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--pico-black);
      overflow: hidden;
    }

    /* EDGE-TO-EDGE PICO-8 CANVAS (FILLS VIEWPORT DIRECTLY) */
    canvas#picoCanvas {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background-color: var(--pico-dark-blue);
    }

    /* PICO-8 NATIVE OVERLAY CONTROLS (SEAMLESS EDGE-TO-EDGE) */
    .pico8-touch-controls {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }

    /* AUTHENTIC PICO-8 PIXEL D-PAD OVERLAY */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, min(48px, 13vw));
      grid-template-rows: repeat(3, min(48px, 13vw));
      gap: 4px;
      pointer-events: auto;
    }

    .btn-ctrl {
      background-color: rgba(126, 37, 83, 0.85);
      border: 3px solid var(--pico-lavender);
      color: var(--pico-white);
      border-radius: 0px;
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset -2px -2px 0px var(--pico-black), inset 2px 2px 0px var(--pico-pink), 3px 3px 0px var(--pico-black);
      text-shadow: 1px 1px 0px var(--pico-black);
      backdrop-filter: blur(2px);
    }

    .btn-ctrl:active, .btn-ctrl.active {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0px var(--pico-black), 1px 1px 0px var(--pico-black);
      background-color: var(--pico-blue);
      color: var(--pico-black);
      border-color: var(--pico-white);
      text-shadow: none;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    /* AUTHENTIC PICO-8 PIXEL ACTION BUTTONS OVERLAY */
    .action-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .btn-action {
      width: min(62px, 16vw);
      height: min(62px, 16vw);
      border-radius: 0px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px var(--pico-black);
      border: 3px solid var(--pico-white);
      cursor: pointer;
      text-shadow: 1px 1px 0px var(--pico-black);
    }

    .btn-action:active, .btn-action.active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--pico-black);
    }

    .btn-o {
      background-color: rgba(255, 163, 0, 0.9);
      border-color: var(--pico-yellow);
      color: var(--pico-black);
      box-shadow: inset -3px -3px 0px var(--pico-brown), inset 3px 3px 0px var(--pico-yellow), 3px 3px 0px var(--pico-black);
      text-shadow: none;
    }

    .btn-x {
      background-color: rgba(255, 119, 168, 0.9);
      border-color: var(--pico-white);
      color: var(--pico-black);
      box-shadow: inset -3px -3px 0px var(--pico-dark-purple), inset 3px 3px 0px var(--pico-white), 3px 3px 0px var(--pico-black);
      text-shadow: none;
    }

    .btn-x.super-ready {
      animation: pixelPulseSuper 0.4s steps(2, end) infinite;
      border-color: var(--pico-yellow);
    }

    @keyframes pixelPulseSuper {
      0% { background-color: var(--pico-pink); }
      50% { background-color: var(--pico-yellow); }
      100% { background-color: var(--pico-pink); }
    }

    .btn-action span {
      font-size: 8px;
      font-weight: 900;
      margin-top: 1px;
      letter-spacing: 0.5px;
    }

    /* TOP OPTIONS BAR OVERLAY */
    .pico8-top-bar {
      position: absolute;
      top: max(6px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .btn-opt {
      pointer-events: auto;
      background-color: rgba(29, 43, 83, 0.85);
      border: 2px solid var(--pico-blue);
      color: var(--pico-white);
      padding: 4px 8px;
      border-radius: 0px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      box-shadow: inset -2px -2px 0px var(--pico-black), inset 2px 2px 0px var(--pico-lavender), 2px 2px 0px var(--pico-black);
    }

    .btn-opt:active {
      transform: translate(1px, 1px);
      box-shadow: inset 2px 2px 0px var(--pico-black), 1px 1px 0px var(--pico-black);
      background-color: var(--pico-blue);
      color: var(--pico-black);
    }
  </style>
</head>
<body>

  <div class="pico8-viewport">
    <!-- TOP OPTIONS OVERLAY -->
    <div class="pico8-top-bar">
      <button class="btn-opt" id="btnMode">MODE: AI VS AI</button>
      <button class="btn-opt" id="btnReset">RESET</button>
      <button class="btn-opt" id="btnAudio">AUDIO: CHIPTUNE ON</button>
    </div>

    <!-- 100% EDGE-TO-EDGE PICO-8 ENGINE CANVAS -->
    <canvas id="picoCanvas" width="128" height="128"></canvas>

    <!-- NATIVE PICO-8 TOUCH CONTROLS OVERLAY -->
    <div class="pico8-touch-controls">
      <!-- LEFT THUMB D-PAD -->
      <div class="dpad-container">
        <button class="btn-ctrl dpad-up" id="btnUp" aria-label="Drop Hard">▲</button>
        <button class="btn-ctrl dpad-left" id="btnLeft" aria-label="Move Left">◄</button>
        <button class="btn-ctrl dpad-down" id="btnDown" aria-label="Move Down">▼</button>
        <button class="btn-ctrl dpad-right" id="btnRight" aria-label="Move Right">►</button>
      </div>

      <!-- RIGHT THUMB ACTION BUTTONS -->
      <div class="action-buttons">
        <button class="btn-action btn-o" id="btnO">🅾️<span>ROTATE</span></button>
        <button class="btn-action btn-x" id="btnX">❎<span>SUPER</span></button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // PICO-8 TRANSPARENT SPRITE ENGINE v9.0.0
    // - 100% Transparent Background Keying for Fighter Sprites (ZERO WHITE BOXES!)
    // - Spritesheet Keyframe Animation Slicing (`sspr()`) for JAB, STRAIGHT, HOOK, UPPERCUT, FLINCH!
    // - Anatomical Shoulder Joint Punch Anchor at Y = -24!
    // - 100% Viewport Edge-to-Edge PICO-8 Engine Canvas & Native Touch Controls!
    // =========================================================================

    const PICO_PALETTE = [
      '#000000', '#1D2B53', '#7E2553', '#008751',
      '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8',
      '#FF004D', '#FFA300', '#FFEC27', '#00E436',
      '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'
    ];

    let activePalMap = Array.from({length: 16}, (_, i) => i);
    function pal(c0, c1) {
      if (c0 === undefined) {
        activePalMap = Array.from({length: 16}, (_, i) => i);
      } else {
        activePalMap[c0] = c1;
      }
    }
    function getPalColor(c) {
      return PICO_PALETTE[activePalMap[c] || c];
    }

    function dget(index) {
      const val = localStorage.getItem('pico8_cart_' + index);
      return val ? parseInt(val, 10) : 0;
    }
    function dset(index, val) {
      localStorage.setItem('pico8_cart_' + index, val);
    }
    let highScore = dget(0);
    let maxComboTrack = dget(1);


    // WebAudio PICO-8 Chiptune Synth
    let audioEnabled = true;
    let audioCtx = null;
    let musicInterval = null;
    let musicStep = 0;

    const BASS_NOTES = [110, 110, 130, 110, 146, 130, 110, 164];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startChiptuneMusic();
      }
    }

    function startChiptuneMusic() {
      if (musicInterval) clearInterval(musicInterval);
      musicInterval = setInterval(() => {
        if (!audioEnabled || !audioCtx) return;
        try {
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(BASS_NOTES[musicStep % BASS_NOTES.length], t);
          gain.gain.setValueAtTime(0.04, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
          musicStep++;
        } catch (e) {}
      }, 150);
    }

    function play808Sfx(type) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;

        if (type === 'step') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.03);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.03);
        } else if (type === 'rotate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.05);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.05);
        } else if (type === 'land') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(38, t + 0.09);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (type === 'fuse') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(110, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.18);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'detonate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.35);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } else if (type === 'super') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, t);
          osc.frequency.exponentialRampToValueAtTime(950, t + 0.45);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        } else if (type === 'garbage') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'jab') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(90, t + 0.08);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === 'straight') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.14);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.14);
        } else if (type === 'hook') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
          gain.gain.setValueAtTime(0.45, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'uppercut') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(750, t + 0.25);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'ko') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987, t);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.8);
        }
      } catch (e) {}
    }

    const COLS = 6;
    const ROWS = 12;
    const CELL_W = 6;
    const CELL_H = 8;
    const GEM_COLORS = [8, 12, 11, 10];

    let gameMode = 'AI_VS_AI';
    let cameraShake = 0;
    let flashFrames = 0;
    let roundTimer = 99;
    let timerFrameCounter = 0;
    let globalFrameCount = 0;
    let gameState = 'PLAYING';
    let koMessage = 'K.O.!';

    class Particle {
      constructor(x, y, vx, vy, color, life, size = 1) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.12;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = getPalColor(this.color);
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
    }

    class FloatingText {
      constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 50;
      }
      update() {
        this.y -= 0.3;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = getPalColor(0);
        ctx.font = 'bold 9px monospace';
        ctx.fillText(this.text, Math.floor(this.x) + 1, Math.floor(this.y) + 1);
        ctx.fillStyle = getPalColor(this.color);
        ctx.fillText(this.text, Math.floor(this.x), Math.floor(this.y));
      }
    }

    let globalParticles = [];
    let globalFloatingTexts = [];
    var p1 = null;
    var p2 = null;

    class BoxerIdleController {
      constructor(isP1) {
        this.isP1 = isP1;
        this.actionState = 'SHOULDER_ROLL';
        this.frameIndex = 1;
        this.timer = 0;
        this.duration = 80;
      }

      update() {
        this.timer++;
        if (this.timer >= this.duration) {
          this.timer = 0;
          const actions = ['SHOULDER_ROLL', 'DUCK', 'HIGH_BLOCK', 'SLIP', 'SHUFFLE'];
          this.actionState = actions[Math.floor(Math.random() * actions.length)];
          this.duration = 80 + Math.floor(Math.random() * 90);
        }
      }

      getOffsets() {
        let dx = 0;
        const shuffleX = Math.sin(globalFrameCount * 0.04 + (this.isP1 ? 0 : 2.5)) * 1.2;
        dx += shuffleX;
        const progress = Math.sin((this.timer / Math.max(1, this.duration)) * Math.PI);

        if (this.actionState === 'SHOULDER_ROLL') {
          dx += (this.isP1 ? 2.5 : -2.5) * progress;
        } else if (this.actionState === 'SLIP') {
          const slipWave = Math.sin((this.timer / Math.max(1, this.duration)) * Math.PI * 2);
          dx += (this.isP1 ? 3.0 : -3.0) * slipWave;
        }

        return { dx, dy: 0 };
      }
    }

    const idleP1 = new BoxerIdleController(true);
    const idleP2 = new BoxerIdleController(false);

    class Board {
      constructor(id, offsetX, isAi = true) {
        this.id = id;
        this.offsetX = offsetX;
        this.offsetY = 16;
        this.isAi = isAi;

        this.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        this.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
        this.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
        this.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

        this.hp = 100;
        this.superMeter = 0;
        this.score = 0;
        this.comboCount = 0;
        this.dropCount = 0;
        this.pulseAngle = 0;

        this.pair = null;
        this.dropTimer = 0;
        this.dropInterval = 45;
        this.lockDelay = 0;

        this.anim = 'IDLE';
        this.animTimer = 0;

        this.aiTargetCol = 2;
        this.aiTimer = 0;

        this.state = 'SPAWN';
        this.clearTimer = 0;
        this.pendingClear = null;
      }

      spawnPair() {
        this.dropCount++;
        this.dropTimer = 0;
        this.lockDelay = 0;

        // AI target column logic
        const colHeights = Array(COLS).fill(0);
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            if (this.grid[r][c] !== 0) {
              colHeights[c] = ROWS - r;
              break;
            }
          }
        }
        let minH = 99;
        let bestC = 2;
        for (let c = 0; c < COLS; c++) {
          if (colHeights[c] < minH) {
            minH = colHeights[c];
            bestC = c;
          }
        }
        this.aiTargetCol = Math.random() < 0.2 ? Math.floor(Math.random() * COLS) : bestC;

        // === PUZZLE FIGHTER GEM GENERATION ===
        // Diamond every 25 drops (original PF spec)
        if (this.dropCount % 25 === 0) {
          this.pair = { x: 2, y: 0, rot: 0, g1: 9, g2: Math.floor(Math.random() * 4) + 1, vy: 0 };
        } else {
          // Each gem has independent chance of being a crash gem (~18%)
          const makeGem = () => {
            const color = Math.floor(Math.random() * 4) + 1;
            return Math.random() < 0.18 ? (color + 4) : color; // crash = color+4
          };
          this.pair = { x: 2, y: 0, rot: 0, g1: makeGem(), g2: makeGem(), vy: 0 };
        }

        if (this.grid[0][2] !== 0 || this.grid[1][2] !== 0) {
          this.hp = 0;
          gameState = 'KO';
          play808Sfx('ko');
        } else {
          this.state = 'FALLING';
        }
      }

      triggerSuper() {
        if (this.superMeter >= 100) {
          this.superMeter = 0;
          const opponent = (this.id === 1) ? p2 : p1;

          for (let r = ROWS - 3; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (this.grid[r][c] !== 0) {
                this.grid[r][c] = 0;
                this.powerGems[r][c] = false;
              }
            }
          }
          // Settle floating gems after clearing bottom rows
          this.applyGravity();

          opponent.hp = Math.max(0, opponent.hp - 35);
          opponent.receiveGarbage(10);

          cameraShake = 16;
          flashFrames = 6;
          play808Sfx('super');
          triggerHaptic(50);

          this.anim = 'UPPERCUT';
          opponent.anim = 'FLINCH';
          this.animTimer = 72;
          opponent.animTimer = 72;

          globalFloatingTexts.push(new FloatingText('-35 HP!', 58, 30, 8));
          globalFloatingTexts.push(new FloatingText('SUPER FINISHER!', 50, 40, 10));
        } else {
          this.rotate(1);
        }
      }

      getSubX() {
        if (!this.pair) return 2;
        if (this.pair.rot === 1) return this.pair.x + 1;
        if (this.pair.rot === 3) return this.pair.x - 1;
        return this.pair.x;
      }

      getSubY() {
        if (!this.pair) return 0;
        if (this.pair.rot === 0) return this.pair.y - 1;
        if (this.pair.rot === 2) return this.pair.y + 1;
        return this.pair.y;
      }

      isValid(x, y, rot) {
        let subX = x;
        let subY = y;
        if (rot === 0) subY = y - 1;
        if (rot === 1) subX = x + 1;
        if (rot === 2) subY = y + 1;
        if (rot === 3) subX = x - 1;

        if (x < 0 || x >= COLS || y >= ROWS) return false;
        if (subX < 0 || subX >= COLS || subY >= ROWS) return false;

        if (y >= 0 && this.grid[y][x] !== 0) return false;
        if (subY >= 0 && this.grid[subY][subX] !== 0) return false;

        return true;
      }

      move(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x + dir, this.pair.y, this.pair.rot)) {
          this.pair.x += dir;
          play808Sfx('step');
          triggerHaptic(10);
        }
      }

      rotate(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        let newRot = (this.pair.rot + dir + 4) % 4;
        let newX = this.pair.x;
        let newY = this.pair.y;

        if (!this.isValid(newX, newY, newRot)) {
          if (this.isValid(newX - 1, newY, newRot)) newX -= 1;
          else if (this.isValid(newX + 1, newY, newRot)) newX += 1;
          else if (this.isValid(newX, newY - 1, newRot)) newY -= 1;
        }

        if (this.isValid(newX, newY, newRot)) {
          this.pair.x = newX;
          this.pair.y = newY;
          this.pair.rot = newRot;
          play808Sfx('rotate');
          triggerHaptic(15);
        }
      }

      dropSoft() {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.pair.vy += 1;
          this.score += 1;
          triggerHaptic(8);
        } else {
          this.lockPair();
        }
      }

      dropHard() {
        if (!this.pair || this.state !== 'FALLING') return;
        while (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.score += 2;
        }
        triggerHaptic(25);
        this.lockPair();
      }

      lockPair() {
        if (!this.pair) return;
        const subX = this.getSubX();
        const subY = this.getSubY();

        if (this.pair.y >= 0) {
          this.grid[this.pair.y][this.pair.x] = this.pair.g1;
          this.squish[this.pair.y][this.pair.x] = 1.0;
          this.spawnImpactParticles(this.pair.x, this.pair.y);
        }
        if (subY >= 0) {
          this.grid[subY][subX] = this.pair.g2;
          this.squish[subY][subX] = 1.0;
          this.spawnImpactParticles(subX, subY);
        }

        play808Sfx('land');
        cameraShake = Math.max(cameraShake, 2);
        this.pair = null;

        this.updateCounterGems();
        this.applyGravity();
        this.processRainbowDiamond();
        // Gravity again — diamond blast may have cleared gems leaving floaters
        this.applyGravity();
        this.detectPowerGems();
        
        const matchFound = this.evaluateMatches();
        if (matchFound) {
          this.state = 'CLEARING';
          this.clearTimer = 36;
        } else {
          this.comboCount = 0;
          this.state = 'SPAWN';
        }
      }

      updateCounterGems() {
        // Puzzle Fighter: counter gems tick down by 1 each time a pair lands.
        // When timer hits 0, they convert to a random normal gem.
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 10) {
              this.counterTimers[r][c]--;
              if (this.counterTimers[r][c] <= 0) {
                this.grid[r][c] = Math.floor(Math.random() * 4) + 1;
              }
            }
          }
        }
      }

      spawnImpactParticles(col, row) {
        const px = this.offsetX + col * CELL_W + CELL_W / 2;
        const py = this.offsetY + row * CELL_H + CELL_H;
        for (let i = 0; i < 4; i++) {
          const vx = (Math.random() - 0.5) * 1.5;
          const vy = -Math.random() * 0.8;
          globalParticles.push(new Particle(px, py, vx, vy, 6, 12, 1));
        }
      }

      applyGravity() {
        let anyMoved = false;
        let pass = true;
        // Loop until no gems move — guarantees full settle even with complex gap patterns
        while (pass) {
          pass = false;
          for (let col = 0; col < COLS; col++) {
            for (let row = ROWS - 2; row >= 0; row--) {
              if (this.grid[row][col] !== 0 && this.grid[row + 1][col] === 0) {
                let r = row;
                while (r < ROWS - 1 && this.grid[r + 1][col] === 0) {
                  this.grid[r + 1][col] = this.grid[r][col];
                  this.powerGems[r + 1][col] = this.powerGems[r][col];
                  this.counterTimers[r + 1][col] = this.counterTimers[r][col];
                  this.grid[r][col] = 0;
                  this.powerGems[r][col] = false;
                  this.counterTimers[r][col] = 3;
                  r++;
                }
                this.squish[r][col] = 0.5;
                pass = true;
                anyMoved = true;
              }
            }
          }
        }
        return anyMoved;
      }

      processRainbowDiamond() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 9) {
              const adj = [[r+1,c], [r-1,c], [r,c+1], [r,c-1]];
              let targetColor = 0;
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  const g = this.grid[ar][ac];
                  if (g >= 1 && g <= 4) targetColor = g;
                  else if (g >= 5 && g <= 8) targetColor = g - 4;
                }
              });

              if (targetColor > 0 || r === ROWS - 1) {
                this.grid[r][c] = 0;
                if (targetColor > 0) {
                  for (let tr = 0; tr < ROWS; tr++) {
                    for (let tc = 0; tc < COLS; tc++) {
                      if (this.grid[tr][tc] === targetColor || this.grid[tr][tc] === targetColor + 4) {
                        this.grid[tr][tc] = 0;
                      }
                    }
                  }
                }
                play808Sfx('detonate');
                globalFloatingTexts.push(new FloatingText('DIAMOND BLAST!', this.offsetX + 2, this.offsetY + 30, 10));
              }
            }
          }
        }
      }

      detectPowerGems() {
        // === PUZZLE FIGHTER POWER GEM DETECTION ===
        // Finds ALL maximal rectangles of same-color normal gems (≥2×2).
        // Marks every cell in a qualifying rectangle as a power gem.
        const prev = Array(ROWS).fill(null).map((_, r) =>
          Array(COLS).fill(null).map((_, c) => this.powerGems[r][c])
        );

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) this.powerGems[r][c] = false;
        }

        // For each possible top-left corner and color, find the largest rectangle
        for (let r = 0; r < ROWS - 1; r++) {
          for (let c = 0; c < COLS - 1; c++) {
            const g = this.grid[r][c];
            if (g < 1 || g > 4) continue;

            // Expand rectangle right and down as far as possible
            let maxW = 0;
            for (let cc = c; cc < COLS; cc++) {
              if (this.grid[r][cc] === g) maxW++;
              else break;
            }

            // Try all widths from maxW down to 2
            for (let w = maxW; w >= 2; w--) {
              let h = 1;
              for (let rr = r + 1; rr < ROWS; rr++) {
                let rowOk = true;
                for (let cc = c; cc < c + w; cc++) {
                  if (this.grid[rr][cc] !== g) { rowOk = false; break; }
                }
                if (rowOk) h++;
                else break;
              }
              if (h >= 2) {
                // Mark all cells in this rectangle as power gems
                for (let rr = r; rr < r + h; rr++) {
                  for (let cc = c; cc < c + w; cc++) {
                    this.powerGems[rr][cc] = true;
                  }
                }
              }
            }
          }
        }

        // Check if any new power gems were formed
        let newFusion = false;
        for (let r = 0; r < ROWS && !newFusion; r++) {
          for (let c = 0; c < COLS && !newFusion; c++) {
            if (this.powerGems[r][c] && !prev[r][c]) newFusion = true;
          }
        }
        if (newFusion) {
          play808Sfx('fuse');
          globalFloatingTexts.push(new FloatingText('POWER GEM!', this.offsetX + 2, this.offsetY + 40, 10));
        }
      }

      evaluateMatches() {
        // === PUZZLE FIGHTER: ONLY CRASH GEMS TRIGGER CLEARS ===
        // A crash gem (type 5-8) clears when adjacent to a same-color normal gem.
        // It flood-fills and removes all connected gems of that color.
        // No Puyo-style cluster matching.
        let matched = false;
        let toClear = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const orb = this.grid[r][c];
            if (orb >= 5 && orb <= 8) {
              const targetColor = orb - 4;
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              let triggered = false;

              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === targetColor) triggered = true;
                }
              });

              if (triggered) {
                matched = true;
                toClear[r][c] = true;
                this.floodFillClear(r, c, targetColor, toClear);
              }
            }
          }
        }

        if (matched) {
          this.pendingClear = { toClear };
        }
        return matched;
      }

      clearPendingMatches() {
        if (!this.pendingClear) return;
        const { toClear } = this.pendingClear;
        let clearCount = 0;
        let powerGemCount = 0;

        // First pass: also mark adjacent counter gems for clearing
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) {
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === 10) toClear[ar][ac] = true;
                }
              });
            }
          }
        }

        // Second pass: clear gems and spawn particles
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) {
              clearCount++;
              if (this.powerGems[r][c]) powerGemCount++;

              const px = this.offsetX + c * CELL_W + CELL_W / 2;
              const py = this.offsetY + r * CELL_H + CELL_H / 2;
              const gColor = GEM_COLORS[(this.grid[r][c] - 1) % 4] || 8;

              for (let k = 0; k < 6; k++) {
                const vx = (Math.random() - 0.5) * 3;
                const vy = (Math.random() - 0.5) * 3 - 1;
                globalParticles.push(new Particle(px, py, vx, vy, gColor, 20, 2));
              }

              this.grid[r][c] = 0;
              this.powerGems[r][c] = false;
            }
          }
        }

        // === PUZZLE FIGHTER DAMAGE & GARBAGE ===
        this.comboCount++;
        if (this.comboCount > maxComboTrack) {
          maxComboTrack = this.comboCount;
          dset(1, maxComboTrack);
        }

        // Damage: base from gem count, power gem bonus, chain multiplier
        const powerBonus = powerGemCount > 0 ? 1.5 : 1.0;
        const chainMult = this.comboCount;
        const dmg = Math.floor(clearCount * 3 * powerBonus * chainMult);
        const opponent = (this.id === 1) ? p2 : p1;

        opponent.hp = Math.max(0, opponent.hp - dmg);
        this.superMeter = Math.min(100, this.superMeter + clearCount * 6);
        this.score += Math.floor(dmg * 10);

        if (this.score > highScore) {
          highScore = this.score;
          dset(0, highScore);
        }

        // Garbage: Puzzle Fighter style — half of cleared gems + chain bonus
        const garbageToSend = Math.max(1, Math.ceil(clearCount / 2) + (this.comboCount - 1) * 2);
        opponent.receiveGarbage(garbageToSend);

        flashFrames = 3;
        globalFloatingTexts.push(new FloatingText(`-${dmg} HP!`, 58, 32, 8));

        // Punch animation intensity scales with damage
        if (powerGemCount > 0 || this.comboCount >= 3) {
          this.anim = 'UPPERCUT';
          cameraShake = 14;
          play808Sfx('uppercut');
        } else if (this.comboCount === 2 || clearCount >= 5) {
          this.anim = 'HOOK';
          cameraShake = 10;
          play808Sfx('hook');
        } else if (clearCount >= 4) {
          this.anim = 'STRAIGHT';
          cameraShake = 8;
          play808Sfx('straight');
        } else {
          this.anim = 'JAB';
          cameraShake = 6;
          play808Sfx('jab');
        }
        this.animTimer = 72;

        // Opponent reaction
        const defenseRoll = Math.random();
        if (defenseRoll < 0.15) {
          opponent.anim = 'BLOCK';
        } else if (defenseRoll < 0.25) {
          opponent.anim = 'DODGE';
        } else if (defenseRoll < 0.32) {
          opponent.anim = 'LEAN';
        } else if (defenseRoll < 0.38) {
          opponent.anim = 'SHOULDER_ROLL';
        } else {
          opponent.anim = 'FLINCH';
        }
        opponent.animTimer = 72;

        this.pendingClear = null;
      }

      getClusterGroup(r, c, targetColor, visited, group) {
        visited[r][c] = true;
        group.push([r, c]);
        const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        adj.forEach(([ar, ac]) => {
          if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
            if (!visited[ar][ac] && this.grid[ar][ac] === targetColor) {
              this.getClusterGroup(ar, ac, targetColor, visited, group);
            }
          }
        });
      }

      receiveGarbage(count) {
        // Puzzle Fighter: counter gems start with timer=5, placed from top, gravity settles
        let remaining = count;
        for (let r = 0; r < ROWS && remaining > 0; r++) {
          for (let c = 0; c < COLS && remaining > 0; c++) {
            if (this.grid[r][c] === 0) {
              this.grid[r][c] = 10;
              this.counterTimers[r][c] = 5;
              remaining--;
            }
          }
        }
        this.applyGravity();
        play808Sfx('garbage');
        globalFloatingTexts.push(new FloatingText(`GARBAGE +${count}!`, this.offsetX + 2, this.offsetY + 20, 8));
      }

      floodFillClear(r, c, targetColor, toClear) {
        const stack = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        while (stack.length > 0) {
          const [cr, cc] = stack.pop();
          if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS) {
            if (!toClear[cr][cc] && this.grid[cr][cc] === targetColor) {
              toClear[cr][cc] = true;
              stack.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
            }
          }
        }
      }

      update() {
        if (gameState !== 'PLAYING') return;

        this.pulseAngle += 0.12;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.squish[r][c] > 0) {
              this.squish[r][c] -= 0.15;
              if (this.squish[r][c] < 0.01) this.squish[r][c] = 0;
            }
          }
        }

        if (this.animTimer > 0) {
          this.animTimer--;
          // BUG-004 FIX: Allow retract phase to complete before snapping to IDLE
          if (this.animTimer <= 0) {
            this.animTimer = 0;
            this.anim = 'IDLE';
          }
        }
      }

      getDropInterval() {
        const elapsedSeconds = Math.max(0, 99 - roundTimer);
        const speedLevel = Math.min(10, Math.floor(elapsedSeconds / 10) + 1);
        // Level 1: 52 frames (0.87s/drop), Level 5: 36 frames (0.6s/drop), Level 10: 16 frames (0.27s/drop)
        return Math.max(14, 52 - (speedLevel - 1) * 4);
      }

      update() {
        if (this.state === 'SPAWN') {
          this.spawnPair();
          this.state = 'FALLING';
        } else if (this.state === 'CLEARING') {
          this.clearTimer--;
          if (this.clearTimer <= 0) {
            this.clearPendingMatches();
            this.applyGravity();
            this.state = 'GRAVITY';
          }
        } else if (this.state === 'GRAVITY') {
          const moved = this.applyGravity();
          if (!moved) {
            this.detectPowerGems();
            const matchFound = this.evaluateMatches();
            if (matchFound) {
              this.state = 'CLEARING';
              this.clearTimer = 28;
            } else {
              this.comboCount = 0;
              this.state = 'SPAWN';
            }
          }
        } else if (this.state === 'FALLING') {
          if (this.isAi && this.pair) {
            this.aiTimer++;
            // AI decision pace: 16 frames (~0.27s) between actions for natural human-like rhythm
            if (this.aiTimer >= 16) {
              this.aiTimer = 0;

              let moved = false;
              if (this.pair.x < this.aiTargetCol) {
                if (this.isValid(this.pair.x + 1, this.pair.y, this.pair.rot)) {
                  this.move(1);
                  moved = true;
                }
              } else if (this.pair.x > this.aiTargetCol) {
                if (this.isValid(this.pair.x - 1, this.pair.y, this.pair.rot)) {
                  this.move(-1);
                  moved = true;
                }
              }

              if (!moved) {
                if (Math.random() < 0.25) this.rotate(1);
                // 30% soft drop chance for deliberate pacing instead of instant hard drop spam
                if (Math.random() < 0.30) this.dropSoft();
              }

              if (this.superMeter >= 100 && Math.random() < 0.15) this.triggerSuper();
            }
          }

          if (this.pair) {
            this.dropTimer++;
            const targetInterval = this.getDropInterval();
            if (this.dropTimer >= targetInterval) {
              this.dropTimer = 0;
              if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
                this.pair.y++;
              } else {
                this.lockDelay++;
                if (this.lockDelay >= 8) {
                  this.lockDelay = 0;
                  this.lockPair();
                }
              }
            }
          }
        }
      }

      draw() {
        ctx.strokeStyle = getPalColor(5);
        ctx.lineWidth = 1;
        ctx.strokeRect(this.offsetX - 1, this.offsetY - 1, COLS * CELL_W + 2, ROWS * CELL_H + 2);

        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(this.offsetX, this.offsetY, COLS * CELL_W, ROWS * CELL_H);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const g = this.grid[r][c];
            if (g !== 0) {
              this.drawGem(this.offsetX + c * CELL_W, this.offsetY + r * CELL_H, g, this.powerGems[r][c], this.squish[r][c], this.counterTimers[r][c]);
            }
          }
        }

        if (this.pair && this.state === 'FALLING') {
          const mainX = this.offsetX + this.pair.x * CELL_W;
          const mainY = this.offsetY + this.pair.y * CELL_H;
          const subX = this.offsetX + this.getSubX() * CELL_W;
          const subY = this.offsetY + this.getSubY() * CELL_H;



          if (this.pair.y >= 0) this.drawGem(mainX, mainY, this.pair.g1, false, 0, 3);
          if (this.getSubY() >= 0) this.drawGem(subX, subY, this.pair.g2, false, 0, 3);
        }
      }

      drawGem(x, y, type, isPower, squishFactor, timerVal) {
        // === FULL-CELL GEM RENDERER — NO BORDER GAPS ===
        // Gems fill their entire cell. Bevels provide 3D separation.
        // No squish animation — consistent sizing at all times.
        const dx = x;
        const dy = y;
        const w = CELL_W;   // 6
        const h = CELL_H;   // 8

        const isCrash   = (type >= 5 && type <= 8);
        const isDiamond = (type === 9);
        const isCounter = (type === 10);
        const cIdx = isCrash ? (type - 4) : type;

        const PAL = {
          1: [8,  14, 2],  // Red:    red / pink / maroon
          2: [12, 13, 1],  // Blue:   blue / lavender / navy
          3: [11, 10, 3],  // Green:  green / yellow / dark-green
          4: [10, 7,  9],  // Yellow: yellow / white / orange
        };
        const c = PAL[cIdx] || PAL[1];
        const base  = getPalColor(c[0]);
        const lite  = getPalColor(c[1]);
        const dark  = getPalColor(c[2]);
        const white = getPalColor(7);

        if (isCrash) {
          // ── CRASH ORB: full-cell with rounded inner shape ──
          // Dark fill for corners (creates rounded look)
          ctx.fillStyle = dark;
          ctx.fillRect(dx, dy, w, h);

          // Rounded body
          ctx.fillStyle = base;
          ctx.fillRect(dx + 1, dy, w - 2, h);
          ctx.fillRect(dx, dy + 1, w, h - 2);

          // Top specular arc
          ctx.fillStyle = lite;
          ctx.fillRect(dx + 1, dy + 1, w - 2, 1);
          ctx.fillRect(dx + 2, dy + 2, w - 4, 1);

          // Bottom shadow arc
          ctx.fillStyle = dark;
          ctx.fillRect(dx + 1, dy + h - 2, w - 2, 1);

        } else if (isDiamond) {
          // ── RAINBOW DIAMOND ──
          const phase = Math.floor(this.pulseAngle * 6) % 4;
          const dCols = [8, 12, 11, 10];

          // Full cell base
          ctx.fillStyle = getPalColor(dCols[phase]);
          ctx.fillRect(dx, dy, w, h);

          // Top-left highlight bevel
          ctx.fillStyle = white;
          ctx.fillRect(dx, dy, w, 1);
          ctx.fillRect(dx, dy, 1, h);

          // Bottom-right shadow bevel
          ctx.fillStyle = getPalColor(dCols[(phase + 1) % 4]);
          ctx.fillRect(dx, dy + h - 1, w, 1);
          ctx.fillRect(dx + w - 1, dy, 1, h);

          ctx.fillRect(dx, dy, w, h);

          // Top-left highlight bevel

          ctx.fillRect(dx, dy, w, 1);
          ctx.fillRect(dx, dy, 1, h);

          // Bottom-right shadow bevel

          ctx.fillRect(dx, dy + h - 1, w, 1);
          ctx.fillRect(dx + w - 1, dy, 1, h);

          ctx.font = 'bold 6px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(timerVal, dx + 3, dy + 6);

          ctx.fillRect(dx, dy, w, h);

          // Top highlight (1px)

          ctx.fillRect(dx, dy, w, 1);

          // Left highlight (1px)
          ctx.fillRect(dx, dy + 1, 1, h - 1);

          // Bottom shadow (1px)
          ctx.fillStyle = dark;
          ctx.fillRect(dx, dy + h - 1, w, 1);

          ctx.fillRect(dx + 1, dy + 1, 1, 1);

    // DYNAMIC COLOR-KEYING TRANSPARENCY HELPER
    function createTransparentCanvas(img) {
      const offCanvas = document.createElement('canvas');
      const w = img.naturalWidth || img.width || 22;
      const h = img.naturalHeight || img.height || 40;
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(img, 0, 0);
      const imgData = offCtx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const isWhite = (r > 210 && g > 210 && b > 210);
        const isBlack = (r < 25 && g < 25 && b < 25);
        if (isWhite || isBlack) data[i+3] = 0;
      }
      offCtx.putImageData(imgData, 0, 0);
      return offCanvas;
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);

    // Punch grid: used for jab, straight, hook, uppercut
    // All defensive poses are the SAME idle sprite with Canvas transforms.

    const PUNCH_QUAD = { 'JAB': 0, 'STRAIGHT': 1, 'HOOK': 2, 'UPPERCUT': 3 };

    function drawBoxer(x, y, isP1, anim, animTimer) {
      let fx = x;
      let fy = 50 + (isP1 ? 0 : 3); // P2 (Deen) source image padding adjustment to align boots on floor level

      const idleController = isP1 ? idleP1 : idleP2;
      const { dx } = idleController.getOffsets();
      fx += Math.floor(dx);

      let isHitFlash = false;
      let extProgress = 0;

      const timerVal = animTimer || 0;
      const progress = 1.0 - (timerVal / 72.0);

      // === DETERMINE WHAT TO DRAW ===
      let usePunch = false;      // true = draw from punch grid
      let punchQuad = 0;         // which quadrant of punch grid
      let bodyTilt = 0;          // rotation in radians
      let vertSquash = 1.0;      // vertical scale (< 1 = duck)
      let horzShift = 0;         // horizontal position offset
      let vertShift = 0;         // vertical position offset

      if (anim === 'JAB' || anim === 'STRAIGHT' || anim === 'HOOK' || anim === 'UPPERCUT') {
        punchQuad = PUNCH_QUAD[anim] || 0;

        // Animation phases: windup → extend → hold → retract
        if (progress < 0.15) {
          // Windup: lean back slightly, use idle sprite
          extProgress = smoothstep(0.0, 0.15, progress) * 0.3;
          bodyTilt = (isP1 ? -1 : 1) * extProgress * 0.08;
        } else if (progress < 0.35) {
          // Extend: switch to punch sprite, lunge forward
          usePunch = true;
          extProgress = 0.3 + smoothstep(0.15, 0.35, progress) * 0.7;
        } else if (progress < 0.65) {
          // Hold: full extension punch sprite
          usePunch = true;
          extProgress = 1.0;
        } else {
          // Retract: back to idle
          extProgress = 1.0 - smoothstep(0.65, 1.00, progress);
          if (progress < 0.80) usePunch = true;
        }

        const lungeDist = extProgress * 8.0;
        horzShift = isP1 ? lungeDist : -lungeDist;

        // BUG-002 FIX: Per-player impact flags
        const impactFlag = isP1 ? impactTriggeredP1 : impactTriggeredP2;
        if (progress >= 0.42 && progress < 0.58 && !impactFlag) {
          if (isP1) impactTriggeredP1 = true; else impactTriggeredP2 = true;
          triggerImpactBurst(isP1 ? 57 : 55, anim === 'UPPERCUT' ? 48 : anim === 'HOOK' ? 50 : 54);
          triggerHaptic(30);
        } else if (progress >= 0.90) {
          if (isP1) impactTriggeredP1 = false; else impactTriggeredP2 = false;
        }

      } else if (anim === 'FLINCH') {
        let fp = 0;
        if (progress < 0.40) fp = 0;
        else if (progress < 0.65) fp = smoothstep(0.40, 0.65, progress);
        else fp = 1.0 - smoothstep(0.65, 1.00, progress);
        horzShift = (isP1 ? -1 : 1) * fp * 8.0;
        bodyTilt = (isP1 ? -1 : 1) * fp * 0.15;
        if (progress >= 0.42 && progress < 0.58) isHitFlash = true;

      } else if (anim === 'DODGE' || anim === 'DUCK') {
        // Duck: squash vertically, shift down
        let dp = 0;
        if (progress < 0.25) dp = smoothstep(0.0, 0.25, progress);
        else if (progress < 0.65) dp = 1.0;
        else dp = 1.0 - smoothstep(0.65, 1.0, progress);
        vertSquash = 1.0 - dp * 0.35;  // squash to 65% height
        vertShift = dp * 14;            // shift down

      } else if (anim === 'LEAN') {
        // Lean back: tilt torso backward
        let lp = 0;
        if (progress < 0.25) lp = smoothstep(0.0, 0.25, progress);
        else if (progress < 0.65) lp = 1.0;
        else lp = 1.0 - smoothstep(0.65, 1.0, progress);
        bodyTilt = (isP1 ? -1 : 1) * lp * 0.2;
        horzShift = (isP1 ? -1 : 1) * lp * -4;

      } else if (anim === 'BLOCK' || anim === 'SHOULDER_ROLL') {
        // Shoulder roll: slight crouch + tilt
        let bp = 0;
        if (progress < 0.20) bp = smoothstep(0.0, 0.20, progress);
        else if (progress < 0.70) bp = 1.0;
        else bp = 1.0 - smoothstep(0.70, 1.0, progress);
        vertSquash = 1.0 - bp * 0.12;
        bodyTilt = (isP1 ? -1 : 1) * bp * 0.1;
        vertShift = bp * 5;
      }
      // else: IDLE — no transforms, just the base idle sprite with bounce from idleController

      fx += horzShift;

      // Draw shadow
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(fx + 11, 89, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();

      const fObj = isP1 ? ROSTER[p1SelectIdx] : ROSTER[p2SelectIdx];
      const fId = fObj ? fObj.id : (isP1 ? 'broner' : 'deen');

      // All sprite assets (idle + punch) face LEFT natively.
      // P1 (left side) → flip to face RIGHT toward center.
      // P2 (right side) → no flip, already faces LEFT toward center.
      const needsFlip = isP1;

      ctx.translate(fx + 11, fy + 20);
      if (needsFlip) {
        ctx.scale(-1, 1);
      }

      // Apply body tilt (negate when flipped to preserve visual direction)
      if (bodyTilt !== 0) {
        ctx.rotate(needsFlip ? -bodyTilt : bodyTilt);
      }

      if (isHitFlash) {
        ctx.filter = 'brightness(2.5) contrast(1.5)';
      }

      // === DRAW THE SPRITE ===
      const idleCanvas = ROSTER_IDLE_CANVASES[fId] || (isP1 ? bronerIdleCanvas : deenIdleCanvas);
      const punchCanvas = ROSTER_PUNCH_CANVASES[fId] || (fId === 'deen' ? deenPunchCanvas : bronerPunchCanvas);

      const dw = 44;
      const dh = 44 * vertSquash;
      const ddx = -22;                    // center horizontally
      const ddy = -44 + 8 + vertShift;    // anchor at feet, shift down for duck

      if (usePunch && punchCanvas) {
        // Draw from 2x2 punch grid
        const pw = punchCanvas.width / 2;
        const ph = punchCanvas.height / 2;
        const col = punchQuad % 2;
        const row = Math.floor(punchQuad / 2);
        ctx.drawImage(punchCanvas, col * pw, row * ph, pw, ph, ddx, ddy, dw, dh);
      } else if (idleCanvas) {

      } else {

        ctx.fillRect(-6, -20, 12, 38);
      }

      ctx.filter = 'none';
      ctx.restore();
    }

        ctx.fillRect(3 * s, -1.5 * s, 11 * s, 3.5 * s);
        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(1 * s, 1 * s, 7 * s, 1.5 * s);
      } else if (details.feature === 'ponytail') {
        ctx.fillRect(3 * s, 0 * s, 11 * s, 2.5 * s);
        ctx.fillRect(13 * s, 1.5 * s, 3 * s, 6 * s);
      } else if (details.feature === 'braids') {
        ctx.fillRect(3 * s, 0 * s, 11 * s, 2.5 * s);
        ctx.fillRect(3 * s, 2.5 * s, 1.5 * s, 5 * s);
        ctx.fillRect(12.5 * s, 2.5 * s, 1.5 * s, 5 * s);
      } else {
        ctx.fillRect(3 * s, 0 * s, 11 * s, 2.5 * s);
      }

      // Beard & Chain
      if (f.id === 'broner' || f.id === 'rampage' || f.id === 'floyd' || f.id === 'tank') {
        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(4 * s, 7.5 * s, 9 * s, 2.5 * s);
      }
      if (details.chain) {
        ctx.fillStyle = getPalColor(details.chain);
        ctx.fillRect(4.5 * s, 10 * s, 8 * s, 1.5 * s);
      }

      // Torso & Musculature
      ctx.fillStyle = getPalColor(details.skin);
      ctx.fillRect(4.5 * s, 10 * s, 8 * s, 9 * s);
      ctx.strokeRect(4.5 * s, 10 * s, 8 * s, 9 * s);

      // Trunks & Waistband
      ctx.fillStyle = getPalColor(details.trunks);
      ctx.fillRect(4 * s, 17 * s, 9 * s, 6 * s);
      ctx.fillStyle = getPalColor(7);
      ctx.fillRect(4 * s, 17 * s, 9 * s, 1.5 * s);

      // Gloves
      ctx.fillStyle = getPalColor(details.gloves);
      ctx.fillRect(1 * s, 11 * s, 3.5 * s, 4.5 * s);
      ctx.fillRect(12.5 * s, 11 * s, 3.5 * s, 4.5 * s);

      ctx.restore();
    }

    // === CHARACTER SELECT RENDERER ===
    function drawCharSelectScreen() {
      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(0, 0, 128, 128);

      // Header
      ctx.fillStyle = getPalColor(10);
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SELECT YOUR FIGHTER', 64, 10);

      // 14-Character Grid (2 rows x 7 cols)
      const cols = 7;
      const cellW = 16;
      const cellH = 17;
      const startX = 8;
      const startY = 15;

      ROSTER.forEach((f, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const cx = startX + c * 17;
        const cy = startY + r * 18;

        const isP1 = (p1SelectIdx === idx);
        const isP2 = (p2SelectIdx === idx);

        // Cell background
        ctx.fillStyle = getPalColor(1);
        ctx.fillRect(cx, cy, cellW, cellH);

        // Draw Fighter 16-bit Arcade Sprite Mini-Avatar
        const cellCanvas = ROSTER_IDLE_CANVASES[f.id];
        if (cellCanvas) {
          ctx.drawImage(cellCanvas, 0, 0, cellCanvas.width, cellCanvas.height, cx, cy - 2, cellW, cellH + 2);
        } else {
          drawBoxerAvatar(ctx, f, cx - 1, cy - 2, false);
        }

        // Name Initial Badge at bottom of cell
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(cx, cy + 11, cellW, 6);
        ctx.fillStyle = getPalColor(7);
        ctx.font = 'bold 5px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(f.name.substring(0, 3), cx + 8, cy + 16);

        // Cell border
        ctx.strokeStyle = getPalColor(f.color);
        ctx.strokeRect(cx, cy, cellW, cellH);

        // Dual Cursors
        if (isP1 && isP2) {
          ctx.strokeStyle = getPalColor(10); // Yellow P1
          ctx.strokeRect(cx - 1, cy - 1, cellW + 2, cellH + 2);
          ctx.strokeStyle = getPalColor(12); // Cyan P2
          ctx.strokeRect(cx - 2, cy - 2, cellW + 4, cellH + 4);
        } else if (isP1) {
          ctx.strokeStyle = getPalColor(10);
          ctx.strokeRect(cx - 1, cy - 1, cellW + 2, cellH + 2);
        } else if (isP2) {
          ctx.strokeStyle = getPalColor(12);
          ctx.strokeRect(cx - 1, cy - 1, cellW + 2, cellH + 2);
        }
      });

      // Bio Card Panel (Bottom)
      const selectedFighter = ROSTER[p1SelectIdx];
      ctx.fillStyle = getPalColor(1);
      ctx.fillRect(4, 54, 120, 58);
      ctx.strokeStyle = getPalColor(5);
      ctx.strokeRect(4, 54, 120, 58);

      // Fighter Portrait Frame
      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(8, 58, 30, 48);
      ctx.strokeStyle = getPalColor(selectedFighter.color);
      ctx.strokeRect(8, 58, 30, 48);

      // Draw 16-bit Capcom Arcade Sprite Preview
      const previewCanvas = ROSTER_IDLE_CANVASES[selectedFighter.id];
      if (previewCanvas) {
        ctx.drawImage(previewCanvas, 0, 0, previewCanvas.width, previewCanvas.height, 10, 60, 26, 44);
      } else {
        drawBoxerAvatar(ctx, selectedFighter, 8, 60, true);
      }

      // Fighter Stats & Bio Text
      ctx.textAlign = 'left';
      ctx.fillStyle = getPalColor(10);
      ctx.font = 'bold 7px monospace';
      ctx.fillText(selectedFighter.fullName, 42, 66);

      ctx.fillStyle = getPalColor(6);
      ctx.font = '5px monospace';
      ctx.fillText(selectedFighter.stance, 42, 74);

      ctx.fillStyle = getPalColor(9);
      ctx.fillText('SP: ' + selectedFighter.move, 42, 82);

      // Stat Bars
      const drawStatBar = (label, val, y, col) => {
        ctx.fillStyle = getPalColor(7);
        ctx.font = '5px monospace';
        ctx.fillText(label, 42, y + 5);
        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(60, y, 58, 6);
        ctx.fillStyle = getPalColor(col);
        ctx.fillRect(60, y, Math.floor(58 * (val / 100)), 6);
      };

      drawStatBar('PWR', selectedFighter.pwr, 87, 8);
      drawStatBar('SPD', selectedFighter.spd, 95, 10);
      drawStatBar('DEF', selectedFighter.def, 103, 12);

      // Lock-In Status Footer
      ctx.textAlign = 'center';
      if (p1Locked && p2Locked) {
        ctx.fillStyle = getPalColor(10);
        ctx.font = 'bold 8px monospace';
        ctx.fillText('MATCH STARTING...', 64, 122);
      } else if (p1Locked) {
        ctx.fillStyle = getPalColor(11);
        ctx.font = '6px monospace';
        ctx.fillText('P1 READY! PRESS START TO BATTLE', 64, 122);
      } else {
        ctx.fillStyle = getPalColor(7);
        ctx.font = '6px monospace';
        ctx.fillText('ARROWS: NAVIGATE  X: SELECT FIGHTER', 64, 122);
      }
      ctx.textAlign = 'left';
    }

    // === BATTLE SCREEN RENDERER ===
    function drawBattleScreen() {
      ctx.fillStyle = getPalColor(1);
      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(0, 0, 128, 15);

      ctx.fillStyle = getPalColor(8);
      ctx.fillRect(4, 3, 42, 5);
      ctx.fillStyle = getPalColor(11);
      ctx.fillRect(4, 3, 42 * (p1.hp / 100), 5);

      ctx.fillStyle = getPalColor(8);
      ctx.fillRect(82, 3, 42, 5);
      ctx.fillStyle = getPalColor(11);
      ctx.fillRect(82, 3, 42 * (p2.hp / 100), 5);

      ctx.fillStyle = getPalColor(7);
      ctx.font = '8px monospace';
      ctx.fillText(p1.name || 'BRONER', 4, 13);
      ctx.fillText(p2.name || 'DEEN', 94, 13);
      ctx.fillText(roundTimer < 10 ? '0' + roundTimer : roundTimer, 58, 10);

      const elapsedSec = Math.max(0, 99 - roundTimer);
      const currentLvl = Math.min(10, Math.floor(elapsedSec / 10) + 1);
      ctx.fillStyle = getPalColor(10);
      ctx.font = '6px monospace';
      ctx.fillText('LVL ' + currentLvl, 52, 22);

      drawPicoDitheredCrowd();

      // PICO-8 RING FLOOR (DARK RETRO RING FLOOR)
      ctx.fillStyle = getPalColor(1);
      ctx.fillRect(41, 45, 46, 68);

      ctx.strokeStyle = getPalColor(6);
      ctx.beginPath();
      ctx.moveTo(41, 45); ctx.lineTo(86, 45);
      ctx.moveTo(41, 65); ctx.lineTo(86, 65);
      ctx.moveTo(41, 85); ctx.lineTo(86, 85);
      ctx.stroke();

      ctx.fillStyle = getPalColor(5);
      ctx.fillRect(41, 90, 46, 23);

      drawBoxer(41, 50, true, p1.anim, p1.animTimer);
      drawBoxer(65, 50, false, p2.anim, p2.animTimer);

      if (impactFxTimer > 0) {
        impactFxTimer--;
        ctx.fillStyle = getPalColor(10);
        ctx.fillRect(impactFxX - 3, impactFxY - 3, 7, 7);
        ctx.fillStyle = getPalColor(7);
        ctx.fillRect(impactFxX - 1, impactFxY - 1, 3, 3);
      }

      p1.draw();
      p2.draw();

      globalParticles.forEach(p => p.draw());
      globalFloatingTexts.forEach(t => t.draw());

      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(0, 114, 128, 14);

      ctx.fillStyle = getPalColor(10);
      ctx.fillRect(4, 118, 40 * (p1.superMeter / 100), 4);
      ctx.fillRect(84, 118, 40 * (p2.superMeter / 100), 4);

      ctx.fillStyle = getPalColor(7);
      ctx.fillText('SP', 46, 123);
      ctx.fillText('SP', 74, 123);

      ctx.fillStyle = getPalColor(10);
      ctx.font = '7px monospace';
      ctx.fillText('HI:' + highScore, 4, 22);

      if (gameState === 'KO') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 45, 128, 38);
        ctx.fillStyle = getPalColor(10);
        ctx.font = 'bold 12px monospace';
        ctx.fillText(koMessage, 10, 68);
      }
    }

    function render() {
      const superBtn = document.getElementById('btnX');
      if (p1 && p1.superMeter >= 100) {
        superBtn.classList.add('super-ready');
      } else {
        superBtn.classList.remove('super-ready');
      }

      if (flashFrames > 0) {
        flashFrames--;
        pal(0, 7); pal(1, 7); pal(2, 7); pal(3, 7);
      } else {
        pal();
      }

      ctx.save();
      if (cameraShake > 0) {
        const rx = (Math.random() * cameraShake - cameraShake / 2);
        const ry = (Math.random() * cameraShake - cameraShake / 2);
        ctx.translate(rx, ry);
        cameraShake *= 0.85;
        if (cameraShake < 0.5) cameraShake = 0;
      }

      if (appState === 'TITLE') {
        drawTitleScreen();
      } else if (appState === 'MODE_SELECT') {
        drawModeSelectScreen();
      } else if (appState === 'CHAR_SELECT') {
        drawCharSelectScreen();
      } else {
        drawBattleScreen();
      }

      ctx.restore();
    }

    function startMatch() {
      const f1 = ROSTER[p1SelectIdx];
      const f2 = ROSTER[p2SelectIdx];

      p1.name = f1.name;
      p2.name = f2.name;

      if (selectedModeIdx === 0) { // 1P vs CPU
        p1.isAi = false;
        p2.isAi = true;
        gameMode = 'VS_AI';
        document.getElementById('btnMode').innerText = 'MODE: VS AI';
      } else if (selectedModeIdx === 1) { // 2P Local
        p1.isAi = false;
        p2.isAi = false;
        gameMode = 'VS_LOCAL';
        document.getElementById('btnMode').innerText = 'MODE: 2P LOCAL';
      } else { // CPU vs CPU
        p1.isAi = true;
        p2.isAi = true;
        gameMode = 'AI_VS_AI';
        document.getElementById('btnMode').innerText = 'MODE: AI VS AI';
      }

      p1.hp = 100; p2.hp = 100;
      p1.superMeter = 0; p2.superMeter = 0;
      p1.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p2.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p1.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
      p2.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
      p1.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
      p2.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
      p1.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p2.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

      p1.state = 'SPAWN';
      p2.state = 'SPAWN';
      p1.pair = null;
      p2.pair = null;

      roundTimer = 99;
      timerFrameCounter = 0;
      gameState = 'PLAYING';
      appState = 'PLAYING';
    }

    function update() {
      globalFrameCount++;

      if (appState === 'CHAR_SELECT' && p1Locked && p2Locked) {
        if (lockCountdown < 0) lockCountdown = 30;
        lockCountdown--;
        if (lockCountdown <= 0) {
          lockCountdown = -1;
          startMatch();
        }
      }

      if (appState !== 'PLAYING' && appState !== 'KO') return;

      if (!p1 || !p2) return;

      p1.update();
      p2.update();

      globalParticles.forEach(p => p.update());
      globalParticles = globalParticles.filter(p => p.life > 0);

      globalFloatingTexts.forEach(t => t.update());
      globalFloatingTexts = globalFloatingTexts.filter(t => t.life > 0);

      if (gameState === 'PLAYING') {
        timerFrameCounter++;
        if (timerFrameCounter >= 60) {
          timerFrameCounter = 0;
          if (roundTimer > 0) {
            roundTimer--;
          } else {
            gameState = 'KO';
            appState = 'KO';
            if (p1.hp > p2.hp) {
              koMessage = 'TIME! ' + p1.name + ' WINS!';
            } else if (p2.hp > p1.hp) {
              koMessage = 'TIME! ' + p2.name + ' WINS!';
            } else {
              koMessage = 'TIME! DRAW!';
            }
          }
        }
      }
    }

    let lastTime = performance.now();
    const step = 1000 / 60;

    function tick() {
      const now = performance.now();
      let delta = now - lastTime;
      if (delta > 250) delta = 250;

      while (delta >= step) {
        update();
        lastTime += step;
        delta -= step;
      }
      render();
    }

    function loop() {
      tick();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // === UNIFIED KEYBOARD CONTROL MANAGER ===
    window.addEventListener('keydown', (e) => {
      initAudio();

      if (appState === 'TITLE') {
        if (e.key === 'x' || e.key === 'X' || e.key === 'z' || e.key === 'Z' || e.key === 'Enter' || e.key === ' ') {
          appState = 'MODE_SELECT';
        }
        return;
      }

      if (appState === 'MODE_SELECT') {
        if (e.key === 'ArrowUp') selectedModeIdx = (selectedModeIdx + 2) % 3;
        if (e.key === 'ArrowDown') selectedModeIdx = (selectedModeIdx + 1) % 3;
        if (e.key === 'x' || e.key === 'X' || e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
          appState = 'CHAR_SELECT';
          p1Locked = false;
          p2Locked = false;
          p1SelectIdx = 0; // Broner
          p2SelectIdx = 1; // Deen
        }
        return;
      }

      if (appState === 'CHAR_SELECT') {
        if (!p1Locked) {
          if (e.key === 'ArrowLeft') p1SelectIdx = (p1SelectIdx + 13) % 14;
          if (e.key === 'ArrowRight') p1SelectIdx = (p1SelectIdx + 1) % 14;
          if (e.key === 'ArrowUp') p1SelectIdx = (p1SelectIdx + 7) % 14;
          if (e.key === 'ArrowDown') p1SelectIdx = (p1SelectIdx + 7) % 14;
        }

        if (e.key === 'x' || e.key === 'X' || e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
          p1Locked = true;
          // In 1P vs CPU or CPU vs CPU, auto lock P2
          p2Locked = true;
        }
        return;
      }

      // IN BATTLE / KO
      if (appState === 'PLAYING') {
        if (e.key === 'ArrowLeft') p1.move(-1);
        if (e.key === 'ArrowRight') p1.move(1);
        if (e.key === 'ArrowDown') p1.dropSoft();
        if (e.key === 'ArrowUp') p1.dropHard();
        if (e.key === 'z' || e.key === 'Z') p1.rotate(-1);
        if (e.key === 'x' || e.key === 'X') {
          if (p1.superMeter >= 100) p1.triggerSuper();
          else p1.rotate(1);
        }
      }
    });

    // Touch & Button Handler
    const bindBtn = (id, action) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      let lastFired = 0;
      const handler = (e) => {
        e.preventDefault();
        const now = performance.now();
        if (now - lastFired < 80) return;
        lastFired = now;
        initAudio();
        action();
      };
      btn.addEventListener('touchstart', handler, { passive: false });
      btn.addEventListener('click', handler);
    };

    bindBtn('btnLeft', () => {
      if (appState === 'CHAR_SELECT') p1SelectIdx = (p1SelectIdx + 13) % 14;
      else if (appState === 'PLAYING') p1.move(-1);
    });

    bindBtn('btnRight', () => {
      if (appState === 'CHAR_SELECT') p1SelectIdx = (p1SelectIdx + 1) % 14;
      else if (appState === 'PLAYING') p1.move(1);
    });

    bindBtn('btnDown', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 1) % 3;
      else if (appState === 'CHAR_SELECT') p1SelectIdx = (p1SelectIdx + 7) % 14;
      else if (appState === 'PLAYING') p1.dropSoft();
    });

    bindBtn('btnUp', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 2) % 3;
      else if (appState === 'CHAR_SELECT') p1SelectIdx = (p1SelectIdx + 7) % 14;
      else if (appState === 'PLAYING') p1.dropHard();
    });

    bindBtn('btnO', () => {
      if (appState === 'TITLE') appState = 'MODE_SELECT';
      else if (appState === 'MODE_SELECT') { appState = 'CHAR_SELECT'; p1Locked = false; p2Locked = false; }
      else if (appState === 'CHAR_SELECT') { p1Locked = true; p2Locked = true; }
      else if (appState === 'PLAYING') p1.rotate(-1);
    });

    bindBtn('btnX', () => {
      if (appState === 'TITLE') appState = 'MODE_SELECT';
      else if (appState === 'MODE_SELECT') { appState = 'CHAR_SELECT'; p1Locked = false; p2Locked = false; }
      else if (appState === 'CHAR_SELECT') { p1Locked = true; p2Locked = true; }
      else if (appState === 'PLAYING') {
        if (p1.superMeter >= 100) p1.triggerSuper();
        else p1.rotate(1);
      }
    });

    bindBtn('btnMode', () => {
      appState = 'CHAR_SELECT';
      p1Locked = false; p2Locked = false;
    });

    bindBtn('btnReset', () => {
      appState = 'TITLE';
    });

    bindBtn('btnAudio', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? 'AUDIO: CHIPTUNE ON' : 'AUDIO: OFF';
    });

    // Direct Canvas Click Navigation for Desktop / Mobile
    const canvasEl = document.getElementById('picoCanvas');
    if (canvasEl) {
      canvasEl.addEventListener('click', (e) => {
      initAudio();
      if (appState === 'TITLE') {
        appState = 'MODE_SELECT';
      } else if (appState === 'MODE_SELECT') {
        appState = 'CHAR_SELECT';
        p1Locked = false; p2Locked = false;
      } else if (appState === 'CHAR_SELECT') {
        const rect = canvasEl.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 128;
        const clickY = ((e.clientY - rect.top) / rect.height) * 128;

        // Check grid click (X: 8..124, Y: 15..51)
        if (clickY >= 15 && clickY <= 51 && clickX >= 8 && clickX <= 124) {
          const col = Math.floor((clickX - 8) / 17);
          const row = Math.floor((clickY - 15) / 18);
          const idx = row * 7 + col;
          if (idx >= 0 && idx < 14) {
            p1SelectIdx = idx;
            p1Locked = true;
            p2Locked = true;
          }
        } else {
          p1Locked = true;
          p2Locked = true;
        }
      }
    });
    }
  </script>
</body>
</html>
