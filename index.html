      ctx.strokeRect(81, 2, 44, 6);

      // Fighter Names
      printPico(p1.name || 'BRONER', 4, 9, 10, 1);
      const p2Name = p2.name || 'DEEN';
      printPico(p2Name, 128 - p2Name.length * 5 - 4, 9, 10, 1);

      // Round Timer
      const timerStr = roundTimer < 10 ? '0' + roundTimer : String(roundTimer);
      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(52, 1, 24, 13);
      ctx.strokeStyle = getPalColor(10);
      ctx.strokeRect(52, 1, 24, 13);
      printPicoCenter(timerStr, 3, 7, 1, true);
      printPicoCenter('RND 1', 9, 10, 1);

      // ── DYNAMIC ARENA ATMOSPHERE & BACKGROUND ──
      drawPicoDitheredCrowd(arena.colors.crowdBg, arena.colors.crowdDit);

      // Dynamic Camera Flash FX in crowd
      if (Math.random() < 0.14 || impactFxTimer > 0) {
        const flashX = 42 + Math.floor(Math.random() * 44);
        const flashY = 16 + Math.floor(Math.random() * 26);
        ctx.fillStyle = getPalColor(7);
        ctx.fillRect(flashX, flashY, 2, 2);
      }

      // Center Stage Backdrop (X: 41..87, Y: 17..113)
      ctx.fillStyle = getPalColor(arena.colors.backdrop);
      ctx.fillRect(41, 17, 46, 96);

      // Arena-Specific Dynamic Lighting & Effects
      if (arena.id === 'vegas' || arena.id === 'misfits') {
        // Moving searchlight / laser beams across roof
        const beam1X = 64 + Math.round(Math.sin(globalFrameCount * 0.04) * 18);
        const beam2X = 64 + Math.round(Math.cos(globalFrameCount * 0.03) * 18);
        ctx.fillStyle = arena.id === 'vegas' ? 'rgba(255, 236, 39, 0.25)' : 'rgba(41, 173, 255, 0.25)';
        ctx.beginPath();
        ctx.moveTo(64, 17);
        ctx.lineTo(beam1X - 6, 46);
        ctx.lineTo(beam1X + 6, 46);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(64, 17);
        ctx.lineTo(beam2X - 6, 46);
        ctx.lineTo(beam2X + 6, 46);
        ctx.fill();

      } else if (arena.id === 'warehouse') {
        // Pulsing Kick Neon Logo in background
        const neonPulse = Math.floor(globalFrameCount / 12) % 2 === 0;
        ctx.fillStyle = neonPulse ? getPalColor(11) : getPalColor(3);
        ctx.fillRect(56, 24, 16, 6);
        ctx.fillStyle = getPalColor(0);
        printPico('KICK', 57, 25, neonPulse ? 7 : 11, 1);

      } else if (arena.id === 'miamiHouse') {
        // Sunset pink glow band
        ctx.fillStyle = getPalColor(14);
        ctx.fillRect(41, 32, 46, 6);
        // Neon palm tree silhouette
        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(45, 24, 2, 14);
        ctx.fillRect(43, 22, 6, 3);
      }

      // Ring Canvas Floor
      ctx.fillStyle = getPalColor(arena.colors.floor);
      ctx.fillRect(41, 88, 46, 25);

      // Ring Ropes & Turnbuckles
      ctx.strokeStyle = getPalColor(arena.colors.ropes);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(41, 46); ctx.lineTo(87, 46);
      ctx.moveTo(41, 64); ctx.lineTo(87, 64);
      ctx.moveTo(41, 82); ctx.lineTo(87, 82);
      ctx.stroke();

      // Turnbuckle pads (Theme Accent Colors)
      ctx.fillStyle = getPalColor(arena.colors.accent);
      ctx.fillRect(41, 44, 2, 40);
      ctx.fillRect(85, 44, 2, 40);

      // Live Stream Chat Broadcast Ticker
      streamChatTimer++;
      if (streamChatTimer > 140) {
        streamChatTimer = 0;
        streamChatIdx = (streamChatIdx + 1) % KICK_STREAM_CHAT.length;
      }

      ctx.fillStyle = 'rgba(0,0,0,0.92)';
      ctx.fillRect(41, 101, 46, 12);
      ctx.strokeStyle = getPalColor(arena.colors.accent);
      ctx.strokeRect(41, 101, 46, 12);

      // Stream badge and chat message
      printPico('LIVE 142K', 43, 102, arena.colors.accent, 1);
      const chatMsg = KICK_STREAM_CHAT[streamChatIdx] || 'RING RUSH LIVE';
      const shortChat = chatMsg.length > 11 ? chatMsg.slice(0, 11) : chatMsg;
      printPico(shortChat, 43, 107, 7, 1);

      // Animated Boxers (Grounded on floor Y=90, facing each other)
      drawBoxer(52, 90, true, p1.anim, p1.animTimer);
      drawBoxer(76, 90, false, p2.anim, p2.animTimer);

      // Hit Impact Spark FX
      if (impactFxTimer > 0) {
        impactFxTimer--;
        ctx.fillStyle = getPalColor(10);
        ctx.fillRect(impactFxX - 3, impactFxY - 3, 7, 7);
        ctx.fillStyle = getPalColor(7);
        ctx.fillRect(impactFxX - 1, impactFxY - 1, 3, 3);
      }

      // Draw Left (P1) and Right (P2) Playfields
      p1.draw();
      p2.draw();

      // Particles & Floating Combo Texts
      globalParticles.forEach(p => p.draw());
      globalFloatingTexts.forEach(t => t.draw());

      // Bottom HUD: Super Meter Gauges
      ctx.fillStyle = getPalColor(0);
      ctx.fillRect(0, 114, 128, 14);

      // P1 Super Gauge
      const p1SuperW = Math.floor(34 * (p1.superMeter / 100));
      ctx.fillStyle = getPalColor(1);
      ctx.fillRect(4, 117, 34, 5);
      ctx.fillStyle = (p1.superMeter >= 100 && Math.floor(globalFrameCount / 6) % 2 === 0) ? getPalColor(7) : getPalColor(10);
      ctx.fillRect(4, 117, p1SuperW, 5);
      ctx.strokeStyle = getPalColor(5);
      ctx.strokeRect(4, 117, 34, 5);
      printPico('SP', 40, 117, p1.superMeter >= 100 ? 10 : 7, 1);

      // Center Super Status Indicator
      if (p1.superMeter >= 100 || p2.superMeter >= 100) {
        printPicoCenter('SUPER READY', 117, 8, 1, true);
      }

      // P2 Super Gauge
      const p2SuperW = Math.floor(34 * (p2.superMeter / 100));
      ctx.fillStyle = getPalColor(1);
      ctx.fillRect(90, 117, 34, 5);
      ctx.fillStyle = (p2.superMeter >= 100 && Math.floor(globalFrameCount / 6) % 2 === 0) ? getPalColor(7) : getPalColor(10);
      ctx.fillRect(90, 117, p2SuperW, 5);
      ctx.strokeStyle = getPalColor(5);
      ctx.strokeRect(90, 117, 34, 5);
      printPico('SP', 78, 117, p2.superMeter >= 100 ? 10 : 7, 1);

      // Knockout Banner Overlay
      if (gameState === 'KO') {
        ctx.fillStyle = 'rgba(0,0,0,0.92)';
        ctx.fillRect(0, 40, 128, 48);
        ctx.strokeStyle = getPalColor(10);
        ctx.strokeRect(0, 40, 128, 48);
        printPicoCenter('K.O.!', 44, 8, 2, true);
        printPicoCenter(koMessage, 60, 10, 1, true);
        if (Math.floor(globalFrameCount / 15) % 2 === 0) {
          printPicoCenter('PRESS START TO REMATCH', 74, 7, 1);
        }
      }
    }

    function rematchToCharSelect() {
      appState = 'CHAR_SELECT';
      gameState = 'PLAYING';
      p1Locked = false;
      p2Locked = false;
      lockCountdown = -1;
      if (p1) { p1.hp = 100; p1.superMeter = 0; p1.anim = 'IDLE'; p1.pendingGarbage = 0; }
      if (p2) { p2.hp = 100; p2.superMeter = 0; p2.anim = 'IDLE'; p2.pendingGarbage = 0; }
      play808Sfx('confirm');
    }

    function render() {
      const superBtn = document.getElementById('btnX');
      if (p1 && p1.superMeter >= 100) {
        superBtn.classList.add('super-ready');
      } else {
        superBtn.classList.remove('super-ready');
      }

      if (flashFrames > 0) {
        flashFrames--;
        pal(0, 7); pal(1, 7); pal(2, 7); pal(3, 7);
      } else {
        pal();
      }

      ctx.save();
      ctx.scale(2, 2); // 2x high-DPI scaling for ultra-sharp typography & pixel art

      if (cameraShake > 0) {
        const rx = (Math.random() * cameraShake - cameraShake / 2);
        const ry = (Math.random() * cameraShake - cameraShake / 2);
        ctx.translate(rx, ry);
        cameraShake *= 0.85;
        if (cameraShake < 0.5) cameraShake = 0;
      }

      if (appState === 'TITLE') {
        drawTitleScreen();
      } else if (appState === 'MODE_SELECT') {
        drawModeSelectScreen();
      } else if (appState === 'CHAR_SELECT') {
        drawCharSelectScreen();
      } else if (appState === 'FIGHTER_BIO') {
        drawFighterBioScreen();
      } else if (appState === 'ARENA_SELECT') {
        drawArenaSelectScreen();
      } else {
        drawBattleScreen();
      }

      ctx.restore();
    }

    function startMatch() {
      switchMusicTrack();

      // In 1P vs CPU the AI opponent picks a random fighter different from P1
      // so arcade runs vary across the 14-fighter roster instead of always Deen.
      if (selectedModeIdx === 0) {
        do { p2SelectIdx = Math.floor(Math.random() * ROSTER.length); }
        while (p2SelectIdx === p1SelectIdx);
      }

      const f1 = ROSTER[p1SelectIdx];
      const f2 = ROSTER[p2SelectIdx];

      p1.fighterId = f1.id;
      p2.fighterId = f2.id;
      p1.name = f1.name;
      p2.name = f2.name;
      p1.score = 0; p2.score = 0;
      p1.comboCount = 0; p2.comboCount = 0;
      p1.dropCount = 0; p2.dropCount = 0;
      p1.pityBreakerCount = 0; p2.pityBreakerCount = 0;
      p1.pendingGarbage = 0; p2.pendingGarbage = 0;

      if (selectedModeIdx === 0) { // 1P vs CPU
        p1.isAi = false;
        p2.isAi = true;
        gameMode = 'VS_AI';
        document.getElementById('btnMode').innerText = 'MODE: VS AI';
      } else if (selectedModeIdx === 1) { // 2P Local
        p1.isAi = false;
        p2.isAi = false;
        gameMode = 'VS_LOCAL';
        document.getElementById('btnMode').innerText = 'MODE: 2P LOCAL';
      } else { // CPU vs CPU
        p1.isAi = true;
        p2.isAi = true;
        gameMode = 'AI_VS_AI';
        document.getElementById('btnMode').innerText = 'MODE: AI VS AI';
      }

      p1.hp = 100; p2.hp = 100;
      p1.superMeter = 0; p2.superMeter = 0;
      p1.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p2.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p1.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
      p2.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
      p1.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
      p2.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
      p1.counterColors = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p2.counterColors = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p1.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
      p2.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

      p1.state = 'SPAWN';
      p2.state = 'SPAWN';
      p1.pair = null;
      p2.pair = null;

      for (const p of [p1, p2]) {
        p.anim = 'IDLE';
        p.animTimer = 0;
        p.dropTimer = 0;
        p.lockDelay = 0;
        p.aiTimer = 0;
        p.clearTimer = 0;
        p.superActive = false;
        p.superTimer = 0;
      }

      impactTriggeredP1 = false;
      impactTriggeredP2 = false;
      impactFxTimer = 0;
      cameraShake = 0;
      flashFrames = 0;
      globalParticles = [];
      globalFloatingTexts = [];

      roundTimer = 99;
      timerFrameCounter = 0;
      gameState = 'PLAYING';
      appState = 'PLAYING';
      play808Sfx('bell');
    }

    function update() {
      globalFrameCount++;

      if (appState === 'CHAR_SELECT' && p1Locked && p2Locked) {
        if (lockCountdown < 0) lockCountdown = 30;
        lockCountdown--;
        if (lockCountdown <= 0) {
          lockCountdown = -1;
          appState = 'ARENA_SELECT';
        }
      }

      if (appState !== 'PLAYING' && appState !== 'KO') return;
      if (!p1 || !p2) return;

      timerFrameCounter++;
      if (timerFrameCounter >= 60) {
        timerFrameCounter = 0;
        if (roundTimer > 0) {
          roundTimer--;
          if (roundTimer === 0) {
            if (p1.hp > p2.hp) triggerKO(1);
            else if (p2.hp > p1.hp) triggerKO(2);
            else triggerKO(0);
          }
        }
      }

      idleP1.update();
      idleP2.update();

      p1.update();
      p2.update();

      for (let i = globalParticles.length - 1; i >= 0; i--) {
        globalParticles[i].update();
        if (globalParticles[i].life <= 0) globalParticles.splice(i, 1);
      }

      for (let i = globalFloatingTexts.length - 1; i >= 0; i--) {
        globalFloatingTexts[i].update();
        if (globalFloatingTexts[i].life <= 0) globalFloatingTexts.splice(i, 1);
      }
    }
    function isStartKey(k) {
      if (!k) return false;
      const key = String(k).toLowerCase();
      return key === 'x' || key === 'z' || key === 'c' || key === 'enter' || key === ' ' || key === 'space';
    }

    window.addEventListener('keydown', (e) => {
      initAudio();

      if (appState === 'TITLE') {
        if (isStartKey(e.key)) {
          appState = 'MODE_SELECT';
        }
        return;
      }

      if (appState === 'MODE_SELECT') {
        if (e.key === 'ArrowUp') selectedModeIdx = (selectedModeIdx + 2) % 3;
        if (e.key === 'ArrowDown') selectedModeIdx = (selectedModeIdx + 1) % 3;
        if (isStartKey(e.key)) {
          appState = 'CHAR_SELECT';
          p1Locked = false;
          p2Locked = false;
          p1SelectIdx = 0;
          p2SelectIdx = 1;
        }
        return;
      }

      if (appState === 'CHAR_SELECT') {
        if (!p1Locked) {
          const prev = p1SelectIdx;
          if (e.key === 'ArrowLeft') p1SelectIdx = (p1SelectIdx + 13) % 14;
          if (e.key === 'ArrowRight') p1SelectIdx = (p1SelectIdx + 1) % 14;
          if (e.key === 'ArrowUp') p1SelectIdx = (p1SelectIdx + 7) % 14;
          if (e.key === 'ArrowDown') p1SelectIdx = (p1SelectIdx + 7) % 14;
          if (p1SelectIdx !== prev) play808Sfx('nav');
        }

        // P2 cursor controls — only in 2P Local mode
        if (selectedModeIdx === 1 && !p2Locked) {
          const prev = p2SelectIdx;
          if (e.key === 'a' || e.key === 'A') p2SelectIdx = (p2SelectIdx + 13) % 14;
          if (e.key === 'd' || e.key === 'D') p2SelectIdx = (p2SelectIdx + 1) % 14;
          if (e.key === 'w' || e.key === 'W') p2SelectIdx = (p2SelectIdx + 7) % 14;
          if (e.key === 's' || e.key === 'S') p2SelectIdx = (p2SelectIdx + 7) % 14;
          if (p2SelectIdx !== prev) play808Sfx('nav');
        }
        if (selectedModeIdx === 1 && !p2Locked && (e.key === 'f' || e.key === 'F')) {
          p2Locked = true;
          play808Sfx('confirm');
        }

        if ((e.key === 'b' || e.key === 'B') && !(p1Locked && p2Locked)) {
          bioFighterIdx = p1SelectIdx;
          appState = 'FIGHTER_BIO';
          play808Sfx('nav');
        }

        if (isStartKey(e.key)) {
          p1Locked = true;
          play808Sfx('confirm');
          if (selectedModeIdx !== 1) {
            p2Locked = true;
          }
        }
        return;
      }

      if (appState === 'FIGHTER_BIO') {
        const prev = bioFighterIdx;
        if (e.key === 'ArrowLeft') bioFighterIdx = (bioFighterIdx + 13) % 14;
        if (e.key === 'ArrowRight') bioFighterIdx = (bioFighterIdx + 1) % 14;
        if (bioFighterIdx !== prev) play808Sfx('nav');
        if (isStartKey(e.key) || e.key === 'Backspace' || e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
          appState = 'CHAR_SELECT';
          p1SelectIdx = bioFighterIdx;
          play808Sfx('nav');
        }
        return;
      }

      if (appState === 'ARENA_SELECT') {
        const prev = selectedArenaIdx;
        if (e.key === 'ArrowLeft') selectedArenaIdx = (selectedArenaIdx + 5) % 6;
        if (e.key === 'ArrowRight') selectedArenaIdx = (selectedArenaIdx + 1) % 6;
        if (e.key === 'ArrowUp') selectedArenaIdx = (selectedArenaIdx + 3) % 6;
        if (e.key === 'ArrowDown') selectedArenaIdx = (selectedArenaIdx + 3) % 6;
        if (selectedArenaIdx !== prev) play808Sfx('nav');
        if (isStartKey(e.key)) {
          play808Sfx('confirm');
          startMatch();
        }
        if (e.key === 'Escape' || e.key === 'Backspace') {
          appState = 'CHAR_SELECT';
          p1Locked = false;
          p2Locked = false;
          lockCountdown = -1;
          play808Sfx('nav');
        }
        return;
      }

      // KO: allow an immediate rematch instead of softlocking on the finisher.
      if (appState === 'KO') {
        if (isStartKey(e.key) || e.key === 'r' || e.key === 'R') {
          rematchToCharSelect();
        }
        return;
      }

      // IN BATTLE
      if (appState === 'PLAYING') {
        // Player 1 (arrow keys + Z/X)
        if (e.key === 'ArrowLeft') { e.preventDefault(); p1.move(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); p1.move(1); }
        if (e.key === 'ArrowDown') { e.preventDefault(); p1.dropSoft(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); p1.dropHard(); }
        if (e.key === 'z' || e.key === 'Z') p1.rotate(-1);
        if (e.key === 'x' || e.key === 'X') {
          if (p1.superMeter >= 100) p1.triggerSuper();
          else p1.rotate(1);
        }

        // Player 2 local controls (WASD + Q/E) — only active in 2P VERSUS mode.
        if (gameMode === 'VS_LOCAL') {
          if (e.key === 'a' || e.key === 'A') p2.move(-1);
          if (e.key === 'd' || e.key === 'D') p2.move(1);
          if (e.key === 's' || e.key === 'S') p2.dropSoft();
          if (e.key === 'w' || e.key === 'W') p2.dropHard();
          if (e.key === 'q' || e.key === 'Q') p2.rotate(-1);
          if (e.key === 'e' || e.key === 'E') {
            if (p2.superMeter >= 100) p2.triggerSuper();
            else p2.rotate(1);
          }
        }
      }
    });

    // Touch & Button Handler
    const bindBtn = (id, action) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      let lastFired = 0;
      const handler = (e) => {
        e.preventDefault();
        const now = performance.now();
        if (now - lastFired < 80) return;
        lastFired = now;
        initAudio();
        action();
      };
      btn.addEventListener('touchstart', handler, { passive: false });
      btn.addEventListener('click', handler);
    };

    bindBtn('btnLeft', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 2) % 3;
      else if (appState === 'CHAR_SELECT' && !p1Locked) { p1SelectIdx = (p1SelectIdx + 13) % 14; play808Sfx('nav'); }
      else if (appState === 'FIGHTER_BIO') { bioFighterIdx = (bioFighterIdx + 13) % 14; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { selectedArenaIdx = (selectedArenaIdx + 5) % 6; play808Sfx('nav'); }
      else if (appState === 'PLAYING') p1.move(-1);
    });

    bindBtn('btnRight', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 1) % 3;
      else if (appState === 'CHAR_SELECT' && !p1Locked) { p1SelectIdx = (p1SelectIdx + 1) % 14; play808Sfx('nav'); }
      else if (appState === 'FIGHTER_BIO') { bioFighterIdx = (bioFighterIdx + 1) % 14; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { selectedArenaIdx = (selectedArenaIdx + 1) % 6; play808Sfx('nav'); }
      else if (appState === 'PLAYING') p1.move(1);
    });

    bindBtn('btnDown', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 1) % 3;
      else if (appState === 'CHAR_SELECT' && !p1Locked) { p1SelectIdx = (p1SelectIdx + 7) % 14; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { selectedArenaIdx = (selectedArenaIdx + 3) % 6; play808Sfx('nav'); }
      else if (appState === 'PLAYING') p1.dropSoft();
    });

    bindBtn('btnUp', () => {
      if (appState === 'MODE_SELECT') selectedModeIdx = (selectedModeIdx + 2) % 3;
      else if (appState === 'CHAR_SELECT' && !p1Locked) { p1SelectIdx = (p1SelectIdx + 7) % 14; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { selectedArenaIdx = (selectedArenaIdx + 3) % 6; play808Sfx('nav'); }
      else if (appState === 'PLAYING') p1.dropHard();
    });

    bindBtn('btnO', () => {
      if (appState === 'TITLE') appState = 'MODE_SELECT';
      else if (appState === 'MODE_SELECT') { appState = 'CHAR_SELECT'; p1Locked = false; p2Locked = false; }
      else if (appState === 'CHAR_SELECT') { p1Locked = true; if (selectedModeIdx !== 1) p2Locked = true; play808Sfx('confirm'); }
      else if (appState === 'FIGHTER_BIO') { appState = 'CHAR_SELECT'; p1SelectIdx = bioFighterIdx; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { play808Sfx('confirm'); startMatch(); }
      else if (appState === 'KO') rematchToCharSelect();
      else if (appState === 'PLAYING') p1.rotate(-1);
    });

    bindBtn('btnX', () => {
      if (appState === 'TITLE') appState = 'MODE_SELECT';
      else if (appState === 'MODE_SELECT') { appState = 'CHAR_SELECT'; p1Locked = false; p2Locked = false; }
      else if (appState === 'CHAR_SELECT') { p1Locked = true; if (selectedModeIdx !== 1) p2Locked = true; play808Sfx('confirm'); }
      else if (appState === 'FIGHTER_BIO') { appState = 'CHAR_SELECT'; p1SelectIdx = bioFighterIdx; play808Sfx('nav'); }
      else if (appState === 'ARENA_SELECT') { play808Sfx('confirm'); startMatch(); }
      else if (appState === 'KO') rematchToCharSelect();
      else if (appState === 'PLAYING') {
        if (p1.superMeter >= 100) p1.triggerSuper();
        else p1.rotate(1);
      }
    });

    bindBtn('btnMode', () => {
      appState = 'CHAR_SELECT';
      gameState = 'PLAYING';
      p1Locked = false; p2Locked = false;
      lockCountdown = -1;
    });

    bindBtn('btnReset', () => {
      appState = 'TITLE';
      gameState = 'PLAYING';
      lockCountdown = -1;
    });

    bindBtn('btnAudio', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? 'AUDIO: TRAP ON' : 'AUDIO: OFF';
    });

    // Direct Canvas Click Navigation for Desktop / Mobile
    const canvasEl = document.getElementById('picoCanvas');
    if (canvasEl) {
      canvasEl.addEventListener('click', (e) => {
      initAudio();
      if (appState === 'TITLE') {
        appState = 'MODE_SELECT';
      } else if (appState === 'MODE_SELECT') {
        appState = 'CHAR_SELECT';
        p1Locked = false; p2Locked = false;
      } else if (appState === 'FIGHTER_BIO') {
        appState = 'CHAR_SELECT';
        p1SelectIdx = bioFighterIdx;
        play808Sfx('nav');
      } else if (appState === 'ARENA_SELECT') {
        const rect = canvasEl.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 128;
        const clickY = ((e.clientY - rect.top) / rect.height) * 128;
        // 2x3 cards: start (6,18), cardW 36, cardH 46, gapX 4, gapY 4
        for (let idx = 0; idx < 6; idx++) {
          const r = Math.floor(idx / 3);
          const c = idx % 3;
          const cx = 6 + c * 40;
          const cy = 18 + r * 50;
          if (clickX >= cx && clickX <= cx + 36 && clickY >= cy && clickY <= cy + 46) {
            if (selectedArenaIdx === idx) {
              play808Sfx('confirm');
              startMatch();
            } else {
              selectedArenaIdx = idx;
              play808Sfx('nav');
            }
            return;
          }
        }
      } else if (appState === 'KO') {
        rematchToCharSelect();
      } else if (appState === 'CHAR_SELECT') {
        const rect = canvasEl.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 128;
        const clickY = ((e.clientY - rect.top) / rect.height) * 128;

        // Portrait panel opens the bio screen instead of locking
        if (clickX >= 8 && clickX <= 38 && clickY >= 58 && clickY <= 106 && !p1Locked) {
          bioFighterIdx = p1SelectIdx;
          appState = 'FIGHTER_BIO';
          play808Sfx('nav');
          return;
        }

        // Check grid click (X: 8..124, Y: 15..51) — selects, then locks
        if (clickY >= 15 && clickY <= 51 && clickX >= 8 && clickX <= 124) {
          const col = Math.floor((clickX - 8) / 17);
          const row = Math.floor((clickY - 15) / 18);
          const idx = row * 7 + col;
          if (idx >= 0 && idx < 14) {
            p1SelectIdx = idx;
          }
        }
        p1Locked = true;
        if (selectedModeIdx !== 1) p2Locked = true;
        play808Sfx('confirm');
      }
    });
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
