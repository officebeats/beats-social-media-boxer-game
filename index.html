<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#050815" />
    <meta name="description" content="Ring Rush — a premium 2.5D boxing puzzle fighter." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ring Rush</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>
      (() => {
        const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);
        if (!isLocal || !("serviceWorker" in navigator)) return;

        Promise.all([
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
          "caches" in window
            ? caches
                .keys()
                .then((keys) =>
                  Promise.all(keys.filter((key) => key.startsWith("ring-rush-")).map((key) => caches.delete(key))),
                )
            : Promise.resolve(),
        ]).then(() => {
          const reloadKey = "ring-rush-development-worker-cleared";
          if (navigator.serviceWorker.controller && sessionStorage.getItem(reloadKey) !== "1") {
            sessionStorage.setItem(reloadKey, "1");
            window.location.reload();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
