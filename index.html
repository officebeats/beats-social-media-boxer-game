<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRASH OUT: RING RUSH — PICO-8 Puzzle Boxing</title>
  <style>
    :root {
      --pico-black: #000000;
      --pico-dark-blue: #1D2B53;
      --pico-dark-purple: #7E2553;
      --pico-dark-green: #008751;
      --pico-brown: #AB5236;
      --pico-dark-gray: #5F574F;
      --pico-light-gray: #C2C3C7;
      --pico-white: #FFF1E8;
      --pico-red: #FF004D;
      --pico-orange: #FFA300;
      --pico-yellow: #FFEC27;
      --pico-green: #00E436;
      --pico-blue: #29ADFF;
      --pico-lavender: #83769C;
      --pico-pink: #FF77A8;
      --pico-peach: #FFCCAA;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #080810;
      color: var(--pico-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .arcade-cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #181428 0%, #0d0a18 100%);
      border: 4px solid #2a2244;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(41, 173, 255, 0.3);
      padding: 16px;
      max-width: 100vw;
    }

    .cabinet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--pico-yellow);
      text-shadow: 2px 2px 0px var(--pico-red);
      letter-spacing: 1px;
    }

    .badge-pico8 {
      background-color: var(--pico-dark-blue);
      color: var(--pico-pink);
      border: 1px solid var(--pico-blue);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
    }

    .viewport-container {
      position: relative;
      background-color: #000;
      border: 4px solid var(--pico-dark-gray);
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    /* Crisp PICO-8 128x128 Pixel Canvas */
    canvas#picoCanvas {
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    @media (max-width: 560px) {
      canvas#picoCanvas {
        width: 320px;
        height: 320px;
      }
    }

    /* Controls Panel */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 12px;
      gap: 12px;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
    }

    .btn-ctrl {
      background-color: #241e38;
      border: 2px solid #4a3e6b;
      color: var(--pico-white);
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #120e1f;
    }

    .btn-ctrl:active, .btn-ctrl.active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #120e1f;
      background-color: var(--pico-blue);
      color: var(--pico-black);
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #120e1f;
      border: 2px solid #fff;
    }

    .btn-o {
      background-color: var(--pico-orange);
      color: var(--pico-black);
    }

    .btn-x {
      background-color: var(--pico-pink);
      color: var(--pico-black);
    }

    .btn-action span {
      font-size: 8px;
      margin-top: 2px;
    }

    .options-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-opt {
      background: var(--pico-dark-blue);
      border: 1px solid var(--pico-blue);
      color: var(--pico-white);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .instructions {
      font-size: 10px;
      color: var(--pico-light-gray);
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="cabinet-header">
      <div class="brand-title">CRASH OUT: RING RUSH</div>
      <div class="badge-pico8">BOXING ART ENGINE v1.6.0</div>
    </div>

    <div class="viewport-container">
      <canvas id="picoCanvas" width="128" height="128"></canvas>
    </div>

    <div class="control-panel">
      <!-- D-PAD -->
      <div class="dpad-container">
        <button class="btn-ctrl dpad-up" id="btnUp">▲</button>
        <button class="btn-ctrl dpad-left" id="btnLeft">◄</button>
        <button class="btn-ctrl dpad-down" id="btnDown">▼</button>
        <button class="btn-ctrl dpad-right" id="btnRight">►</button>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="action-buttons">
        <button class="btn-action btn-o" id="btnO">🅾️<span>ROTATE</span></button>
        <button class="btn-action btn-x" id="btnX">❎<span>SUPER</span></button>
      </div>
    </div>

    <div class="options-bar">
      <button class="btn-opt" id="btnMode">MODE: AI VS AI</button>
      <button class="btn-opt" id="btnReset">RESET MATCH</button>
      <button class="btn-opt" id="btnAudio">AUDIO: 808 ON</button>
    </div>

    <div class="instructions">
      AI VS AI Auto-Match | Keyboard: Arrows = Move/Drop | Z/X = Action
    </div>
  </div>

  <script>
    // =========================================================================
    // CAPCOM 16-BIT HEAVYWEIGHT BOXING ART ENGINE v1.6.0
    // - 3 Distinct Heavyweight Punch Animations: JAB, HOOK, UPPERCUT
    //   * JAB: Fast stiff lead extension with shoulder chin protection
    //   * HOOK: Wide curving power arc with heavy 18° torso rotation torque
    //   * UPPERCUT: Upward skyward scooping explosion rising from crouching knees
    // - Grounded 72-Frame Pacing (~1.2s per punch): Weighty, clear, zero flicking
    // - Distinct Hit Knockback Reactions for each punch type
    // =========================================================================

    const PICO_PALETTE = [
      '#000000', '#1D2B53', '#7E2553', '#008751',
      '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8',
      '#FF004D', '#FFA300', '#FFEC27', '#00E436',
      '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'
    ];

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    const canvas = document.getElementById('picoCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Load High-Definition Capcom Boxer Sprites
    const imgBroner = new Image();
    imgBroner.src = 'assets/broner_sprite.jpg';
    let bronerCanvas = null;
    imgBroner.onload = () => { bronerCanvas = createCleanTransparentSprite(imgBroner); };

    const imgDeen = new Image();
    imgDeen.src = 'assets/deen_sprite.jpg';
    let deenCanvas = null;
    imgDeen.onload = () => { deenCanvas = createCleanTransparentSprite(imgDeen); };

    function createCleanTransparentSprite(img) {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const cCtx = c.getContext('2d');
      cCtx.drawImage(img, 0, 0);
      const imgData = cCtx.getImageData(0, 0, c.width, c.height);
      const d = imgData.data;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i];
        const g = d[i+1];
        const b = d[i+2];

        const isLight = (r > 120 && g > 120 && b > 120);
        const isGray = (Math.abs(r - g) < 25 && Math.abs(g - b) < 25 && r > 80);
        if (isLight || isGray) {
          d[i+3] = 0;
        }
      }
      cCtx.putImageData(imgData, 0, 0);
      return c;
    }

    // WebAudio 808 Synth
    let audioEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function play808Sfx(type) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;

        if (type === 'step') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.03);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.03);
        } else if (type === 'rotate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.05);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.05);
        } else if (type === 'land') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(38, t + 0.09);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (type === 'fuse') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(110, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.18);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'detonate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.35);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } else if (type === 'cluster_pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.12);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'super') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, t);
          osc.frequency.exponentialRampToValueAtTime(950, t + 0.45);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        } else if (type === 'garbage') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'jab') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(90, t + 0.08);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === 'hook') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
          gain.gain.setValueAtTime(0.45, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'uppercut') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(750, t + 0.25);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'ko') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987, t);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.8);
        }
      } catch (e) {}
    }

    const COLS = 6;
    const ROWS = 12;
    const CELL_W = 6;
    const CELL_H = 8;
    const GEM_COLORS = [8, 12, 11, 10]; // Red, Blue, Green, Yellow

    let gameMode = 'AI_VS_AI';
    let cameraShake = 0;
    let flashFrames = 0;
    let roundTimer = 99;
    let timerFrameCounter = 0;
    let globalFrameCount = 0;
    let gameState = 'PLAYING';

    class Particle {
      constructor(x, y, vx, vy, color, life, size = 1) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.12;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = PICO_PALETTE[this.color];
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
    }

    class FloatingText {
      constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 50;
      }
      update() {
        this.y -= 0.3;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = PICO_PALETTE[0];
        ctx.font = 'bold 9px monospace';
        ctx.fillText(this.text, Math.floor(this.x) + 1, Math.floor(this.y) + 1);
        ctx.fillStyle = PICO_PALETTE[this.color];
        ctx.fillText(this.text, Math.floor(this.x), Math.floor(this.y));
      }
    }

    let globalParticles = [];
    let globalFloatingTexts = [];
    var p1 = null;
    var p2 = null;

    // --- DEFENSIVE ONLY IDLE CONTROLLER ---
    class BoxerIdleController {
      constructor(isP1) {
        this.isP1 = isP1;
        this.actionState = 'SHOULDER_ROLL';
        this.frameIndex = 1;
        this.timer = 0;
        this.duration = 80;
      }

      update() {
        this.timer++;
        if (this.timer >= this.duration) {
          this.timer = 0;
          const actions = ['SHOULDER_ROLL', 'DUCK', 'HIGH_BLOCK', 'SLIP', 'SHUFFLE'];
          this.actionState = actions[Math.floor(Math.random() * actions.length)];

          if (this.actionState === 'SHUFFLE') this.frameIndex = 0;
          else if (this.actionState === 'SHOULDER_ROLL') this.frameIndex = 1;
          else if (this.actionState === 'DUCK') this.frameIndex = 2;
          else if (this.actionState === 'HIGH_BLOCK') this.frameIndex = 3;
          else if (this.actionState === 'SLIP') this.frameIndex = 4;

          this.duration = 80 + Math.floor(Math.random() * 90);
        }
      }

      getOffsets() {
        let dx = 0;
        const shuffleX = Math.sin(globalFrameCount * 0.04 + (this.isP1 ? 0 : 2.5)) * 1.2;
        dx += shuffleX;

        const progress = Math.sin((this.timer / Math.max(1, this.duration)) * Math.PI);

        if (this.actionState === 'SHOULDER_ROLL') {
          dx += (this.isP1 ? 2.5 : -2.5) * progress;
        } else if (this.actionState === 'SLIP') {
          const slipWave = Math.sin((this.timer / Math.max(1, this.duration)) * Math.PI * 2);
          dx += (this.isP1 ? 3.0 : -3.0) * slipWave;
        }

        return { dx, dy: 0, frameIndex: this.frameIndex };
      }
    }

    const idleP1 = new BoxerIdleController(true);
    const idleP2 = new BoxerIdleController(false);

    // --- DETERMINISTIC BOARD STATE MACHINE ENGINE ---
    class Board {
      constructor(id, offsetX, isAi = true) {
        this.id = id;
        this.offsetX = offsetX;
        this.offsetY = 16;
        this.isAi = isAi;

        this.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        this.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
        this.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
        this.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

        this.hp = 100;
        this.superMeter = 0;
        this.score = 0;
        this.comboCount = 0;
        this.dropCount = 0;
        this.pulseAngle = 0;

        this.pair = null;
        this.dropTimer = 0;
        this.dropInterval = 45; // Smooth Steady Soft Falling Speed
        this.lockDelay = 0;

        this.anim = 'IDLE';
        this.animTimer = 0;

        this.aiTargetCol = 2;
        this.aiTimer = 0;

        this.state = 'SPAWN'; // 'SPAWN', 'FALLING', 'CLEARING', 'GRAVITY'
        this.clearTimer = 0;
        this.pendingClear = null;
      }

      spawnPair() {
        this.dropCount++;
        this.dropTimer = 0;
        this.lockDelay = 0;

        // Intelligent column targeting
        const colHeights = Array(COLS).fill(0);
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            if (this.grid[r][c] !== 0) {
              colHeights[c] = ROWS - r;
              break;
            }
          }
        }
        let minH = 99;
        let bestC = 2;
        for (let c = 0; c < COLS; c++) {
          if (colHeights[c] < minH) {
            minH = colHeights[c];
            bestC = c;
          }
        }
        this.aiTargetCol = Math.random() < 0.2 ? Math.floor(Math.random() * COLS) : bestC;

        if (this.dropCount % 12 === 0) {
          this.pair = { x: 2, y: 0, rot: 0, g1: 9, g2: Math.floor(Math.random() * 4) + 1, vy: 0 };
        } else {
          const g1 = Math.floor(Math.random() * 4) + 1;
          const isCrash = Math.random() < 0.35;
          const g2 = isCrash ? (Math.floor(Math.random() * 4) + 5) : (Math.floor(Math.random() * 4) + 1);
          this.pair = { x: 2, y: 0, rot: 0, g1: g1, g2: g2, vy: 0 };
        }

        if (this.grid[0][2] !== 0 || this.grid[1][2] !== 0) {
          this.hp = 0;
          gameState = 'KO';
          play808Sfx('ko');
        } else {
          this.state = 'FALLING';
        }
      }

      triggerSuper() {
        if (this.superMeter >= 100) {
          this.superMeter = 0;
          const opponent = (this.id === 1) ? p2 : p1;

          for (let r = ROWS - 3; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (this.grid[r][c] !== 0) {
                this.grid[r][c] = 0;
                this.powerGems[r][c] = false;
              }
            }
          }

          opponent.hp = Math.max(0, opponent.hp - 35);
          opponent.receiveGarbage(10);

          cameraShake = 16;
          flashFrames = 6;
          play808Sfx('super');

          this.anim = 'UPPERCUT';
          opponent.anim = 'FLINCH';
          this.animTimer = 72; // Grounded 72-Frame (~1.2s) Punch Sequence
          opponent.animTimer = 72;

          globalFloatingTexts.push(new FloatingText('SUPER FINISHER!', 50, 40, 10));
        } else {
          this.rotate(1);
        }
      }

      getSubX() {
        if (!this.pair) return 2;
        if (this.pair.rot === 1) return this.pair.x + 1;
        if (this.pair.rot === 3) return this.pair.x - 1;
        return this.pair.x;
      }

      getSubY() {
        if (!this.pair) return 0;
        if (this.pair.rot === 0) return this.pair.y - 1;
        if (this.pair.rot === 2) return this.pair.y + 1;
        return this.pair.y;
      }

      isValid(x, y, rot) {
        let subX = x;
        let subY = y;
        if (rot === 0) subY = y - 1;
        if (rot === 1) subX = x + 1;
        if (rot === 2) subY = y + 1;
        if (rot === 3) subX = x - 1;

        if (x < 0 || x >= COLS || y >= ROWS) return false;
        if (subX < 0 || subX >= COLS || subY >= ROWS) return false;

        if (y >= 0 && this.grid[y][x] !== 0) return false;
        if (subY >= 0 && this.grid[subY][subX] !== 0) return false;

        return true;
      }

      move(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x + dir, this.pair.y, this.pair.rot)) {
          this.pair.x += dir;
          play808Sfx('step');
        }
      }

      rotate(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        let newRot = (this.pair.rot + dir + 4) % 4;
        let newX = this.pair.x;
        let newY = this.pair.y;

        if (!this.isValid(newX, newY, newRot)) {
          if (this.isValid(newX - 1, newY, newRot)) newX -= 1;
          else if (this.isValid(newX + 1, newY, newRot)) newX += 1;
          else if (this.isValid(newX, newY - 1, newRot)) newY -= 1;
        }

        if (this.isValid(newX, newY, newRot)) {
          this.pair.x = newX;
          this.pair.y = newY;
          this.pair.rot = newRot;
          play808Sfx('rotate');
        }
      }

      dropSoft() {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.pair.vy += 1;
          this.score += 1;
        } else {
          this.lockPair();
        }
      }

      dropHard() {
        if (!this.pair || this.state !== 'FALLING') return;
        while (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.score += 2;
        }
        this.lockPair();
      }

      lockPair() {
        if (!this.pair) return;
        const subX = this.getSubX();
        const subY = this.getSubY();

        if (this.pair.y >= 0) {
          this.grid[this.pair.y][this.pair.x] = this.pair.g1;
          this.squish[this.pair.y][this.pair.x] = 1.0;
          this.spawnImpactParticles(this.pair.x, this.pair.y);
        }
        if (subY >= 0) {
          this.grid[subY][subX] = this.pair.g2;
          this.squish[subY][subX] = 1.0;
          this.spawnImpactParticles(subX, subY);
        }

        play808Sfx('land');
        cameraShake = Math.max(cameraShake, 2);
        this.pair = null;

        this.updateCounterGems();
        this.applyGravity();
        this.processRainbowDiamond();
        this.detectPowerGems();
        
        // Evaluate Matches Deterministically
        const matchFound = this.evaluateMatches();
        if (matchFound) {
          this.state = 'CLEARING';
          this.clearTimer = 36;
        } else {
          this.comboCount = 0;
          this.state = 'SPAWN';
        }
      }

      updateCounterGems() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 10) {
              this.counterTimers[r][c]--;
              if (this.counterTimers[r][c] <= 0) {
                this.grid[r][c] = Math.floor(Math.random() * 4) + 1;
              }
            }
          }
        }
      }

      spawnImpactParticles(col, row) {
        const px = this.offsetX + col * CELL_W + CELL_W / 2;
        const py = this.offsetY + row * CELL_H + CELL_H;
        for (let i = 0; i < 4; i++) {
          const vx = (Math.random() - 0.5) * 1.5;
          const vy = -Math.random() * 0.8;
          globalParticles.push(new Particle(px, py, vx, vy, 6, 12, 1));
        }
      }

      applyGravity() {
        let moved = false;
        for (let col = 0; col < COLS; col++) {
          for (let row = ROWS - 2; row >= 0; row--) {
            if (this.grid[row][col] !== 0 && this.grid[row + 1][col] === 0) {
              let r = row;
              while (r < ROWS - 1 && this.grid[r + 1][col] === 0) {
                this.grid[r + 1][col] = this.grid[r][col];
                this.powerGems[r + 1][col] = this.powerGems[r][col];
                this.counterTimers[r + 1][col] = this.counterTimers[r][col];
                this.grid[r][col] = 0;
                this.powerGems[r][col] = false;
                r++;
              }
              this.squish[r][col] = 0.8;
              moved = true;
            }
          }
        }
        return moved;
      }

      processRainbowDiamond() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 9) {
              const adj = [[r+1,c], [r-1,c], [r,c+1], [r,c-1]];
              let targetColor = 0;
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  const g = this.grid[ar][ac];
                  if (g >= 1 && g <= 4) targetColor = g;
                  else if (g >= 5 && g <= 8) targetColor = g - 4;
                }
              });

              if (targetColor > 0 || r === ROWS - 1) {
                this.grid[r][c] = 0;
                if (targetColor > 0) {
                  for (let tr = 0; tr < ROWS; tr++) {
                    for (let tc = 0; tc < COLS; tc++) {
                      if (this.grid[tr][tc] === targetColor || this.grid[tr][tc] === targetColor + 4) {
                        this.grid[tr][tc] = 0;
                      }
                    }
                  }
                }
                play808Sfx('detonate');
                globalFloatingTexts.push(new FloatingText('DIAMOND BLAST!', this.offsetX + 2, this.offsetY + 30, 10));
              }
            }
          }
        }
      }

      detectPowerGems() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) this.powerGems[r][c] = false;
        }

        let newFusion = false;
        for (let r = 0; r < ROWS - 1; r++) {
          for (let c = 0; c < COLS - 1; c++) {
            const g = this.grid[r][c];
            if (g >= 1 && g <= 4) {
              if (this.grid[r][c + 1] === g && this.grid[r + 1][c] === g && this.grid[r + 1][c + 1] === g) {
                this.powerGems[r][c] = true;
                this.powerGems[r][c + 1] = true;
                this.powerGems[r + 1][c] = true;
                this.powerGems[r + 1][c + 1] = true;
                newFusion = true;
              }
            }
          }
        }

        if (newFusion) {
          play808Sfx('fuse');
          globalFloatingTexts.push(new FloatingText('POWER FUSION!', this.offsetX + 2, this.offsetY + 40, 10));
        }
      }

      evaluateMatches() {
        let matched = false;
        let isSecondaryCluster = false;
        let toClear = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const orb = this.grid[r][c];
            if (orb >= 5 && orb <= 8) {
              const targetColor = orb - 4;
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              let triggered = false;

              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === targetColor) triggered = true;
                }
              });

              if (triggered) {
                matched = true;
                toClear[r][c] = true;
                this.floodFillClear(r, c, targetColor, toClear);
              }
            }
          }
        }

        if (!matched) {
          const visited = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const g = this.grid[r][c];
              if (g >= 1 && g <= 4 && !visited[r][c]) {
                const group = [];
                this.getClusterGroup(r, c, g, visited, group);
                if (group.length >= 4) {
                  matched = true;
                  isSecondaryCluster = true;
                  group.forEach(([gr, gc]) => toClear[gr][gc] = true);
                }
              }
            }
          }
        }

        if (matched) {
          this.pendingClear = { toClear, isSecondaryCluster };
        }
        return matched;
      }

      clearPendingMatches() {
        if (!this.pendingClear) return;
        const { toClear, isSecondaryCluster } = this.pendingClear;
        let clearCount = 0;
        let powerGemCleared = false;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) {
              clearCount++;
              if (this.powerGems[r][c]) powerGemCleared = true;

              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === 10) toClear[ar][ac] = true;
                }
              });

              const px = this.offsetX + c * CELL_W + CELL_W / 2;
              const py = this.offsetY + r * CELL_H + CELL_H / 2;
              const gColor = GEM_COLORS[(this.grid[r][c] - 1) % 4] || 8;

              for (let k = 0; k < 6; k++) {
                const vx = (Math.random() - 0.5) * 3;
                const vy = (Math.random() - 0.5) * 3 - 1;
                globalParticles.push(new Particle(px, py, vx, vy, gColor, 20, 2));
              }

              this.grid[r][c] = 0;
              this.powerGems[r][c] = false;
            }
          }
        }

        this.comboCount++;
        const powerMult = isSecondaryCluster ? 0.5 : (powerGemCleared ? 1.6 : 1.0);
        const dmg = clearCount * 3 * powerMult * this.comboCount;
        const opponent = (this.id === 1) ? p2 : p1;

        opponent.hp = Math.max(0, opponent.hp - Math.floor(dmg));
        this.superMeter = Math.min(100, this.superMeter + clearCount * 6);
        this.score += Math.floor(dmg * 10);

        const baseGarbage = isSecondaryCluster ? Math.floor(clearCount / 2) : Math.max(2, Math.floor((clearCount - 2) * 1.4));
        const garbageToSend = Math.max(1, baseGarbage + (this.comboCount - 1) * 2);
        opponent.receiveGarbage(garbageToSend);

        flashFrames = 3;

        // TRIGGER DISTINCT HEAVYWEIGHT PUNCH ANIMATION TYPES (JAB, HOOK, UPPERCUT)
        if (powerGemCleared || this.comboCount >= 3) { // SKYWARD UPPERCUT EXPLOSION
          this.anim = 'UPPERCUT';
          opponent.anim = 'FLINCH';
          cameraShake = 14;
          play808Sfx('uppercut');
        } else if (isSecondaryCluster || this.comboCount >= 2 || clearCount >= 5) { // CURVING HOOK POWER ARC
          this.anim = 'HOOK';
          opponent.anim = 'FLINCH';
          cameraShake = 10;
          play808Sfx('hook');
        } else { // QUICK TECHNICAL JAB STIFF LEAD
          this.anim = 'JAB';
          opponent.anim = 'FLINCH';
          cameraShake = 6;
          play808Sfx('jab');
        }
        this.animTimer = 72; // Grounded 72-Frame (~1.2s) Pacing for Heavyweight Boxing Visuals!
        opponent.animTimer = 72;

        this.pendingClear = null;
      }

      getClusterGroup(r, c, targetColor, visited, group) {
        visited[r][c] = true;
        group.push([r, c]);
        const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        adj.forEach(([ar, ac]) => {
          if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
            if (!visited[ar][ac] && this.grid[ar][ac] === targetColor) {
              this.getClusterGroup(ar, ac, targetColor, visited, group);
            }
          }
        });
      }

      receiveGarbage(count) {
        let dropped = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < COLS; c++) {
            if (dropped < count && this.grid[r][c] === 0) {
              this.grid[r][c] = 10;
              this.counterTimers[r][c] = 3;
              dropped++;
            }
          }
        }
        play808Sfx('garbage');
        globalFloatingTexts.push(new FloatingText(`GARBAGE +${count}!`, this.offsetX + 2, this.offsetY + 20, 8));
      }

      floodFillClear(r, c, targetColor, toClear) {
        const stack = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        while (stack.length > 0) {
          const [cr, cc] = stack.pop();
          if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS) {
            if (!toClear[cr][cc] && this.grid[cr][cc] === targetColor) {
              toClear[cr][cc] = true;
              stack.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
            }
          }
        }
      }

      update() {
        if (gameState !== 'PLAYING') return;

        this.pulseAngle += 0.12;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.squish[r][c] > 0) {
              this.squish[r][c] -= 0.1;
              if (this.squish[r][c] < 0) this.squish[r][c] = 0;
            }
          }
        }

        if (this.animTimer > 0) {
          this.animTimer--;
          if (this.animTimer === 0) this.anim = 'IDLE';
        }

        // --- SYNCHRONOUS STATE MACHINE LOGIC ---
        if (this.state === 'SPAWN') {
          this.spawnPair();
        } else if (this.state === 'CLEARING') {
          this.clearTimer--;
          if (this.clearTimer <= 0) {
            this.clearPendingMatches();
            this.applyGravity();
            this.state = 'GRAVITY';
          }
        } else if (this.state === 'GRAVITY') {
          const moved = this.applyGravity();
          if (!moved) {
            this.detectPowerGems();
            const matchFound = this.evaluateMatches();
            if (matchFound) {
              this.state = 'CLEARING';
              this.clearTimer = 28;
            } else {
              this.comboCount = 0;
              this.state = 'SPAWN';
            }
          }
        } else if (this.state === 'FALLING') {
          // FAIL-SAFE AI TICK ENGINE (Every 10 frames ~0.16s per decision)
          if (this.isAi && this.pair) {
            this.aiTimer++;
            if (this.aiTimer >= 10) {
              this.aiTimer = 0;

              let moved = false;
              if (this.pair.x < this.aiTargetCol) {
                if (this.isValid(this.pair.x + 1, this.pair.y, this.pair.rot)) {
                  this.move(1);
                  moved = true;
                }
              } else if (this.pair.x > this.aiTargetCol) {
                if (this.isValid(this.pair.x - 1, this.pair.y, this.pair.rot)) {
                  this.move(-1);
                  moved = true;
                }
              }

              if (!moved) {
                if (Math.random() < 0.2) this.rotate(1);
                this.dropHard();
              }

              if (this.superMeter >= 100) this.triggerSuper();
            }
          }

          if (this.pair) {
            this.dropTimer++;
            if (this.dropTimer >= this.dropInterval) {
              this.dropTimer = 0;
              if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
                this.pair.y++;
              } else {
                this.lockDelay++;
                if (this.lockDelay >= 2) {
                  this.lockDelay = 0;
                  this.lockPair();
                }
              }
            }
          }
        }
      }

      draw() {
        ctx.strokeStyle = PICO_PALETTE[5];
        ctx.lineWidth = 1;
        ctx.strokeRect(this.offsetX - 1, this.offsetY - 1, COLS * CELL_W + 2, ROWS * CELL_H + 2);

        ctx.fillStyle = PICO_PALETTE[0];
        ctx.fillRect(this.offsetX, this.offsetY, COLS * CELL_W, ROWS * CELL_H);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const g = this.grid[r][c];
            if (g !== 0) {
              this.drawGem(this.offsetX + c * CELL_W, this.offsetY + r * CELL_H, g, this.powerGems[r][c], this.squish[r][c], this.counterTimers[r][c]);
            }
          }
        }

        if (this.pair && this.state === 'FALLING') {
          const mainX = this.offsetX + this.pair.x * CELL_W;
          const mainY = this.offsetY + this.pair.y * CELL_H;
          const subX = this.offsetX + this.getSubX() * CELL_W;
          const subY = this.offsetY + this.getSubY() * CELL_H;

          if (this.pair.vy > 0) {
            ctx.fillStyle = PICO_PALETTE[6];
            ctx.fillRect(mainX + 2, mainY - 3, 2, 3);
            ctx.fillRect(subX + 2, subY - 3, 2, 3);
          }

          if (this.pair.y >= 0) this.drawGem(mainX, mainY, this.pair.g1, false, 0, 3);
          if (this.getSubY() >= 0) this.drawGem(subX, subY, this.pair.g2, false, 0, 3);
        }
      }

      // AAA CAPCOM ARCADE 16-BIT PIXEL ART BLOCK RENDERER
      drawGem(x, y, type, isPower, squishFactor, timerVal) {
        let colorIdx = 8;
        let darkColorIdx = 0;
        let isCrash = false;
        let isDiamond = false;
        let isCounter = false;

        if (type === 1) { colorIdx = 8; darkColorIdx = 2; }
        else if (type === 2) { colorIdx = 12; darkColorIdx = 1; }
        else if (type === 3) { colorIdx = 11; darkColorIdx = 3; }
        else if (type === 4) { colorIdx = 10; darkColorIdx = 4; }
        else if (type >= 5 && type <= 8) {
          colorIdx = GEM_COLORS[type - 5];
          darkColorIdx = (type === 5 ? 2 : type === 6 ? 1 : type === 7 ? 3 : 4);
          isCrash = true;
        } else if (type === 9) {
          isDiamond = true;
          colorIdx = 7;
        } else if (type === 10) {
          isCounter = true;
          colorIdx = 5;
        }

        const squishY = Math.floor(squishFactor * 2);
        const squishX = Math.floor(squishFactor * 1);
        const drawX = x - squishX / 2;
        const drawY = y + squishY;
        const drawW = CELL_W + squishX;
        const drawH = CELL_H - squishY;

        if (isCrash) { // AAA 3D CRASH ORB (DETONATOR)
          const glowPulse = Math.abs(Math.sin(this.pulseAngle * 5));
          const ringColor = (glowPulse > 0.4) ? PICO_PALETTE[10] : PICO_PALETTE[9];

          ctx.fillStyle = ringColor;
          ctx.fillRect(drawX, drawY, drawW, drawH);

          ctx.fillStyle = PICO_PALETTE[colorIdx];
          ctx.fillRect(drawX + 1, drawY, drawW - 2, drawH);
          ctx.fillRect(drawX, drawY + 1, drawW, drawH - 2);

          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 1, drawY + 1, 2, 1);
          ctx.fillRect(drawX + 1, drawY + 2, 1, 1);

          const starFlash = Math.floor(this.pulseAngle * 8) % 2;
          ctx.fillStyle = (starFlash === 0) ? PICO_PALETTE[7] : PICO_PALETTE[10];
          ctx.fillRect(drawX + 2, drawY + 2, 2, 4);
          ctx.fillRect(drawX + 1, drawY + 3, 4, 2);

          ctx.strokeStyle = PICO_PALETTE[0];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

        } else if (isDiamond) { // AAA PRISMATIC RAINBOW DIAMOND
          const diaCol = Math.floor(this.pulseAngle * 6) % 4;
          ctx.fillStyle = PICO_PALETTE[GEM_COLORS[diaCol]];
          ctx.fillRect(drawX, drawY, drawW, drawH);

          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 1, drawY + 1, drawW - 2, 2);
          ctx.fillRect(drawX + 2, drawY + 3, 2, 2);

          ctx.strokeStyle = PICO_PALETTE[10];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

        } else if (isCounter) { // AAA GRANITE STONE COUNTER BLOCK
          ctx.fillStyle = PICO_PALETTE[5];
          ctx.fillRect(drawX, drawY, drawW, drawH);

          ctx.fillStyle = PICO_PALETTE[6];
          ctx.fillRect(drawX + 1, drawY + 1, 2, 1);
          ctx.fillRect(drawX + 3, drawY + 4, 2, 1);

          ctx.fillStyle = PICO_PALETTE[0];
          ctx.font = 'bold 7px monospace';
          ctx.fillText(timerVal, drawX + 2, drawY + 7);
          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillText(timerVal, drawX + 1, drawY + 6);

          ctx.strokeStyle = PICO_PALETTE[0];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

        } else { // AAA 3D BEVELED CRYSTAL GEM BLOCK
          ctx.strokeStyle = PICO_PALETTE[0];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

          ctx.fillStyle = PICO_PALETTE[colorIdx];
          ctx.fillRect(drawX + 1, drawY + 1, drawW - 2, drawH - 2);

          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 1, drawY + 1, drawW - 2, 1);
          ctx.fillRect(drawX + 1, drawY + 1, 1, drawH - 2);

          ctx.fillStyle = PICO_PALETTE[darkColorIdx];
          ctx.fillRect(drawX + 1, drawY + drawH - 2, drawW - 2, 1);
          ctx.fillRect(drawX + drawW - 2, drawY + 1, 1, drawH - 2);

          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 2, drawY + 2, 1, 1);

          if (isPower) {
            ctx.strokeStyle = PICO_PALETTE[10];
            ctx.lineWidth = 1;
            ctx.strokeRect(drawX + 0.5, drawY + 0.5, drawW - 1, drawH - 1);
            ctx.fillStyle = PICO_PALETTE[10];
            ctx.fillRect(drawX + 2, drawY + 3, 2, 2);
          }
        }
      }
    }

    let impactFxTimer = 0;
    let impactFxX = 58;
    let impactFxY = 56;
    let impactTriggeredThisPunch = false;

    function triggerImpactBurst(hitX = 58, hitY = 56) {
      impactFxTimer = 10;
      impactFxX = hitX;
      impactFxY = hitY;

      for (let k = 0; k < 14; k++) {
        const vx = (Math.random() - 0.5) * 4;
        const vy = (Math.random() - 0.5) * 4;
        const pColor = (k % 3 === 0) ? 10 : (k % 3 === 1 ? 8 : 7);
        globalParticles.push(new Particle(hitX, hitY, vx, vy, pColor, 24, 2));
      }
    }

    // =========================================================================
    // CAPCOM 16-BIT DISTINCT PUNCH RENDERER v1.6.0
    // - JAB: Straight stiff lead extension ($14px$ lunge across floor)
    // - HOOK: Wide curving power arc ($18px$ lunge, $dy = -3px$, $18^\circ$ torque)
    // - UPPERCUT: Skyward scooping explosion ($fy+4 \rightarrow fy-6$, $-0.18$ rad scoop)
    // =========================================================================
    function drawBoxer(x, y, isP1, anim, animTimer) {
      let fx = x;
      let fy = 50; // Feet strictly grounded on ring floor canvas (50 + 40 = 90)

      const idleController = isP1 ? idleP1 : idleP2;
      const { dx, frameIndex } = idleController.getOffsets();
      fx += Math.floor(dx);

      let currentPose = frameIndex;
      let punchTilt = 0;
      let flinchTilt = 0;
      let dyOffset = 0;
      let isHitFlash = false;

      const timerVal = animTimer || 0;
      const progress = 1.0 - (timerVal / 72.0); // 0.0 to 1.0 over 72 frames (~1.2s)

      // --- DISTINCT PUNCH ANIMATION TYPES ---
      if (anim === 'JAB') {
        currentPose = 3;
        let lungeProgress = 0;
        if (progress < 0.35) {
          lungeProgress = smoothstep(0.0, 0.35, progress) * 0.70;
        } else if (progress < 0.50) {
          lungeProgress = 0.70 + smoothstep(0.35, 0.50, progress) * 0.30;
        } else if (progress < 0.70) {
          lungeProgress = 1.0;
        } else {
          lungeProgress = 1.0 - smoothstep(0.70, 1.00, progress);
        }

        const lungeDist = lungeProgress * 14.0;
        fx += isP1 ? lungeDist : -lungeDist;
        punchTilt = isP1 ? 0.05 : -0.05;

        if (progress >= 0.45 && progress < 0.55 && !impactTriggeredThisPunch) {
          impactTriggeredThisPunch = true;
          triggerImpactBurst(55, 56);
        } else if (progress >= 0.95) {
          impactTriggeredThisPunch = false;
        }

      } else if (anim === 'HOOK') { // WIDE CURVING POWER ARC
        currentPose = 3;
        let lungeProgress = 0;
        if (progress < 0.35) {
          lungeProgress = smoothstep(0.0, 0.35, progress) * 0.65;
        } else if (progress < 0.50) {
          lungeProgress = 0.65 + smoothstep(0.35, 0.50, progress) * 0.35;
        } else if (progress < 0.70) {
          lungeProgress = 1.0;
        } else {
          lungeProgress = 1.0 - smoothstep(0.70, 1.00, progress);
        }

        const lungeDist = lungeProgress * 18.0;
        fx += isP1 ? lungeDist : -lungeDist;

        // Curving Arc & Torque Rotation (18 degrees / 0.30 rad)
        dyOffset = -Math.sin(lungeProgress * Math.PI) * 3.5;
        const torqueAmt = Math.sin(lungeProgress * Math.PI) * 0.30;
        punchTilt = isP1 ? torqueAmt : -torqueAmt;

        if (progress >= 0.45 && progress < 0.55 && !impactTriggeredThisPunch) {
          impactTriggeredThisPunch = true;
          triggerImpactBurst(59, 53);
        } else if (progress >= 0.95) {
          impactTriggeredThisPunch = false;
        }

      } else if (anim === 'UPPERCUT') { // SKYWARD SCOOPING EXPLOSION
        currentPose = 3;
        let lungeProgress = 0;
        if (progress < 0.35) {
          lungeProgress = smoothstep(0.0, 0.35, progress) * 0.70;
          dyOffset = smoothstep(0.0, 0.35, progress) * 4.0; // Knee Dip Crouch
        } else if (progress < 0.50) {
          lungeProgress = 0.70 + smoothstep(0.35, 0.50, progress) * 0.30;
          dyOffset = 4.0 - smoothstep(0.35, 0.50, progress) * 10.0; // Skyward Lift (-6px)
        } else if (progress < 0.70) {
          lungeProgress = 1.0;
          dyOffset = -6.0;
        } else {
          lungeProgress = 1.0 - smoothstep(0.70, 1.00, progress);
          dyOffset = -6.0 + smoothstep(0.70, 1.00, progress) * 6.0;
        }

        const lungeDist = lungeProgress * 16.0;
        fx += isP1 ? lungeDist : -lungeDist;
        punchTilt = isP1 ? -0.18 : 0.18; // Backward leverage

        if (progress >= 0.45 && progress < 0.55 && !impactTriggeredThisPunch) {
          impactTriggeredThisPunch = true;
          triggerImpactBurst(57, 48);
        } else if (progress >= 0.95) {
          impactTriggeredThisPunch = false;
        }

      // --- DISTINCT DEFENDER HIT KNOCKBACK REACTIONS ---
      } else if (anim === 'FLINCH') {
        currentPose = 4;
        let flinchProgress = 0;
        if (progress < 0.45) {
          flinchProgress = 0;
        } else if (progress < 0.70) {
          flinchProgress = smoothstep(0.45, 0.70, progress);
        } else {
          flinchProgress = 1.0 - smoothstep(0.70, 1.00, progress);
        }

        const flinchDist = flinchProgress * 14.0;
        fx += isP1 ? -flinchDist : flinchDist;

        // Head Knockback Tilt (20 degrees / 0.35 rad)
        const tiltAmt = flinchProgress * 0.35;
        flinchTilt = isP1 ? -tiltAmt : tiltAmt;

        if (progress >= 0.45 && progress < 0.55) isHitFlash = true;
      }

      // Dynamic Ambient Ring Drop Shadow ON THE FLOOR CANVAS
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(fx + 11, 89, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      const singleCanvas = isP1 ? bronerCanvas : deenCanvas;

      if (singleCanvas) {
        ctx.save();

        // HORIZONTAL FLIP FOR DEEN (P2) SO BOTH BOXERS FACE EACH OTHER!
        if (!isP1) {
          ctx.translate(fx + 22, fy + dyOffset);
          ctx.scale(-1, 1);
          fx = 0;
          fy = 0;
        } else {
          fy += dyOffset;
        }

        if (isHitFlash) {
          ctx.filter = 'brightness(2.2)';
        }

        if (anim === 'JAB' || anim === 'HOOK' || anim === 'UPPERCUT') { // DISTINCT PUNCH RENDERING
          ctx.translate(fx + 11, fy + 38);
          ctx.rotate(punchTilt);
          ctx.drawImage(singleCanvas, -11, -38, 22, 40);
        } else if (anim === 'FLINCH') { // HEAD KNOCKBACK TILT
          ctx.translate(fx + 11, fy + 38);
          ctx.rotate(flinchTilt);
          ctx.drawImage(singleCanvas, -11, -38, 22, 40);
        } else if (currentPose === 1) { // SHOULDER ROLL (Philly Shell tilt)
          ctx.translate(fx + 11, fy + 38);
          ctx.rotate(isP1 ? -0.06 : -0.06);
          ctx.drawImage(singleCanvas, -11, -38, 22, 40);
        } else if (currentPose === 2) { // DUCK CROUCH
          ctx.drawImage(singleCanvas, fx, fy + 3, 22, 37);
        } else if (currentPose === 4) { // HEAD SLIP & WEAVE
          ctx.translate(fx + 11, fy + 38);
          ctx.rotate(isP1 ? 0.08 : 0.08);
          ctx.drawImage(singleCanvas, -11, -38, 22, 40);
        } else { // STANCE GUARD
          ctx.drawImage(singleCanvas, fx, fy, 22, 40);
        }
        ctx.restore();
      } else {
        ctx.fillStyle = isP1 ? '#AB5236' : '#29ADFF';
        ctx.fillRect(fx + 3, fy + dyOffset, 14, 38);
      }
    }

    function render() {
      if (flashFrames > 0) {
        flashFrames--;
        ctx.fillStyle = PICO_PALETTE[7];
        ctx.fillRect(0, 0, 128, 128);
        return;
      }

      ctx.save();
      if (cameraShake > 0) {
        const rx = (Math.random() * cameraShake - cameraShake / 2);
        const ry = (Math.random() * cameraShake - cameraShake / 2);
        ctx.translate(rx, ry);
        cameraShake *= 0.85;
        if (cameraShake < 0.5) cameraShake = 0;
      }

      ctx.fillStyle = PICO_PALETTE[1];
      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(0, 0, 128, 15);

      ctx.fillStyle = PICO_PALETTE[8];
      ctx.fillRect(4, 3, 42, 5);
      ctx.fillStyle = PICO_PALETTE[11];
      ctx.fillRect(4, 3, 42 * (p1.hp / 100), 5);

      ctx.fillStyle = PICO_PALETTE[8];
      ctx.fillRect(82, 3, 42, 5);
      ctx.fillStyle = PICO_PALETTE[11];
      ctx.fillRect(82, 3, 42 * (p2.hp / 100), 5);

      ctx.fillStyle = PICO_PALETTE[7];
      ctx.font = '8px monospace';
      ctx.fillText('BRONER', 4, 13);
      ctx.fillText('DEEN', 98, 13);
      ctx.fillText(roundTimer < 10 ? '0' + roundTimer : roundTimer, 58, 10);

      // Center Boxing Ring Stage (X: 41..86)
      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(41, 15, 46, 98);

      // Ring Ropes
      ctx.strokeStyle = PICO_PALETTE[6];
      ctx.beginPath();
      ctx.moveTo(41, 45); ctx.lineTo(86, 45);
      ctx.moveTo(41, 65); ctx.lineTo(86, 65);
      ctx.moveTo(41, 85); ctx.lineTo(86, 85);
      ctx.stroke();

      // Ring Floor Canvas (Y: 90)
      ctx.fillStyle = PICO_PALETTE[7];
      ctx.fillRect(41, 90, 46, 23);

      // Draw Clean Transparent Full-Size Face-to-Face Capcom Boxer Sprites!
      drawBoxer(41, 50, true, p1.anim, p1.animTimer);   // Adrien Broner
      drawBoxer(65, 50, false, p2.anim, p2.animTimer); // Deen The Great

      // 8-BIT CONTACT STARBURST IMPACT FLARE (★) AT CONTACT POINT
      if (impactFxTimer > 0) {
        impactFxTimer--;
        ctx.fillStyle = PICO_PALETTE[10]; // Gold star flare
        ctx.fillRect(impactFxX - 3, impactFxY - 3, 7, 7);
        ctx.fillStyle = PICO_PALETTE[7]; // Specular white core
        ctx.fillRect(impactFxX - 1, impactFxY - 1, 3, 3);
      }

      p1.draw();
      p2.draw();

      globalParticles.forEach(p => p.draw());
      globalFloatingTexts.forEach(t => t.draw());

      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(0, 114, 128, 14);

      ctx.fillStyle = PICO_PALETTE[10];
      ctx.fillRect(4, 118, 40 * (p1.superMeter / 100), 4);
      ctx.fillRect(84, 118, 40 * (p2.superMeter / 100), 4);

      ctx.fillStyle = PICO_PALETTE[7];
      ctx.fillText('SP', 46, 123);
      ctx.fillText('SP', 74, 123);

      if (gameState === 'KO') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 45, 128, 38);
        ctx.fillStyle = PICO_PALETTE[10];
        ctx.font = 'bold 16px monospace';
        ctx.fillText('K.O.!', 44, 68);
      }

      ctx.restore();
    }

    function update() {
      globalFrameCount++;

      idleP1.update();
      idleP2.update();

      p1.update();
      p2.update();

      globalParticles.forEach(p => p.update());
      globalParticles = globalParticles.filter(p => p.life > 0);

      globalFloatingTexts.forEach(t => t.update());
      globalFloatingTexts = globalFloatingTexts.filter(t => t.life > 0);

      if (gameState === 'PLAYING') {
        timerFrameCounter++;
        if (timerFrameCounter >= 30) {
          timerFrameCounter = 0;
          if (roundTimer > 0) roundTimer--;
        }
      }
    }

    let lastTime = performance.now();
    const step = 1000 / 60; // 16.66ms per 60Hz frame

    function tick() {
      const now = performance.now();
      let delta = now - lastTime;
      if (delta > 250) delta = 250;

      while (delta >= step) {
        update();
        lastTime += step;
        delta -= step;
      }
      render();
    }

    // High-frequency 60Hz interval guarantees execution in all browser environments
    setInterval(tick, 16);
    function loop() {
      tick();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft') p1.move(-1);
      if (e.key === 'ArrowRight') p1.move(1);
      if (e.key === 'ArrowDown') p1.dropSoft();
      if (e.key === 'ArrowUp') p1.dropHard();
      if (e.key === 'z' || e.key === 'Z') p1.rotate(-1);
      if (e.key === 'x' || e.key === 'X') {
        if (p1.superMeter >= 100) p1.triggerSuper();
        else p1.rotate(1);
      }
    });

    document.getElementById('btnLeft').onclick = () => { initAudio(); p1.move(-1); };
    document.getElementById('btnRight').onclick = () => { initAudio(); p1.move(1); };
    document.getElementById('btnDown').onclick = () => { initAudio(); p1.dropSoft(); };
    document.getElementById('btnUp').onclick = () => { initAudio(); p1.dropHard(); };
    document.getElementById('btnO').onclick = () => { initAudio(); p1.rotate(-1); };
    document.getElementById('btnX').onclick = () => {
      initAudio();
      if (p1.superMeter >= 100) p1.triggerSuper();
      else p1.rotate(1);
    };

    document.getElementById('btnMode').onclick = () => {
      if (gameMode === 'AI_VS_AI') {
        gameMode = 'VS_AI';
        p1.isAi = false;
        p2.isAi = true;
        document.getElementById('btnMode').innerText = 'MODE: VS AI';
      } else {
        gameMode = 'AI_VS_AI';
        p1.isAi = true;
        p2.isAi = true;
        document.getElementById('btnMode').innerText = 'MODE: AI VS AI';
      }
    };

    document.getElementById('btnReset').onclick = () => {
      location.reload();
    };

    document.getElementById('btnAudio').onclick = () => {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? 'AUDIO: 808 ON' : 'AUDIO: OFF';
    };
  </script>
</body>
