<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRASH OUT: RING RUSH — PICO-8 Puzzle Boxing</title>
  <style>
    :root {
      --pico-black: #000000;
      --pico-dark-blue: #1D2B53;
      --pico-dark-purple: #7E2553;
      --pico-dark-green: #008751;
      --pico-brown: #AB5236;
      --pico-dark-gray: #5F574F;
      --pico-light-gray: #C2C3C7;
      --pico-white: #FFF1E8;
      --pico-red: #FF004D;
      --pico-orange: #FFA300;
      --pico-yellow: #FFEC27;
      --pico-green: #00E436;
      --pico-blue: #29ADFF;
      --pico-lavender: #83769C;
      --pico-pink: #FF77A8;
      --pico-peach: #FFCCAA;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #080810;
      color: var(--pico-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .arcade-cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, #181428 0%, #0d0a18 100%);
      border: 4px solid #2a2244;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(41, 173, 255, 0.3);
      padding: 16px;
      max-width: 100vw;
    }

    .cabinet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--pico-yellow);
      text-shadow: 2px 2px 0px var(--pico-red);
      letter-spacing: 1px;
    }

    .badge-pico8 {
      background-color: var(--pico-dark-blue);
      color: var(--pico-pink);
      border: 1px solid var(--pico-blue);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
    }

    .viewport-container {
      position: relative;
      background-color: #000;
      border: 4px solid var(--pico-dark-gray);
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    /* Crisp PICO-8 128x128 Pixel Canvas */
    canvas#picoCanvas {
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    @media (max-width: 560px) {
      canvas#picoCanvas {
        width: 320px;
        height: 320px;
      }
    }

    /* Controls Panel */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 12px;
      gap: 12px;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
    }

    .btn-ctrl {
      background-color: #241e38;
      border: 2px solid #4a3e6b;
      color: var(--pico-white);
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #120e1f;
    }

    .btn-ctrl:active, .btn-ctrl.active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #120e1f;
      background-color: var(--pico-blue);
      color: var(--pico-black);
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #120e1f;
      border: 2px solid #fff;
    }

    .btn-o {
      background-color: var(--pico-orange);
      color: var(--pico-black);
    }

    .btn-x {
      background-color: var(--pico-pink);
      color: var(--pico-black);
    }

    .btn-action span {
      font-size: 8px;
      margin-top: 2px;
    }

    .options-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-opt {
      background: var(--pico-dark-blue);
      border: 1px solid var(--pico-blue);
      color: var(--pico-white);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .instructions {
      font-size: 10px;
      color: var(--pico-light-gray);
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="cabinet-header">
      <div class="brand-title">CRASH OUT: RING RUSH</div>
      <div class="badge-pico8">HIGH-DETAIL v0.1.0</div>
    </div>

    <div class="viewport-container">
      <canvas id="picoCanvas" width="128" height="128"></canvas>
    </div>

    <div class="control-panel">
      <!-- D-PAD -->
      <div class="dpad-container">
        <button class="btn-ctrl dpad-up" id="btnUp">▲</button>
        <button class="btn-ctrl dpad-left" id="btnLeft">◄</button>
        <button class="btn-ctrl dpad-down" id="btnDown">▼</button>
        <button class="btn-ctrl dpad-right" id="btnRight">►</button>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="action-buttons">
        <button class="btn-action btn-o" id="btnO">🅾️<span>ROTATE</span></button>
        <button class="btn-action btn-x" id="btnX">❎<span>SUPER</span></button>
      </div>
    </div>

    <div class="options-bar">
      <button class="btn-opt" id="btnMode">MODE: VS AI</button>
      <button class="btn-opt" id="btnReset">RESET MATCH</button>
      <button class="btn-opt" id="btnAudio">AUDIO: 808 ON</button>
    </div>

    <div class="instructions">
      Keyboard: Arrows = Move/Drop | Z = Rotate CCW | X = Rotate CW / SUPER
    </div>
  </div>

  <script>
    // =========================================================================
    // HIGH-DETAIL BOXER ART, DISTINCTIVE CRASH ORBS, & SLOWER PACE ENGINE
    // =========================================================================

    const PICO_PALETTE = [
      '#000000', // 0: Black
      '#1D2B53', // 1: Dark Blue
      '#7E2553', // 2: Dark Purple
      '#008751', // 3: Dark Green
      '#AB5236', // 4: Brown (Skin Base)
      '#5F574F', // 5: Dark Gray
      '#C2C3C7', // 6: Light Gray
      '#FFF1E8', // 7: White
      '#FF004D', // 8: Red
      '#FFA300', // 9: Orange
      '#FFEC27', // 10: Yellow (Gold)
      '#00E436', // 11: Green
      '#29ADFF', // 12: Blue
      '#83769C', // 13: Lavender
      '#FF77A8', // 14: Pink
      '#FFCCAA'  // 15: Peach (Skin Highlight)
    ];

    const canvas = document.getElementById('picoCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // --- WebAudio 808 Synthesizer ---
    let audioEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function play808Sfx(type) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const t = audioCtx.currentTime;

        if (type === 'step') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(200, t + 0.03);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.03);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.03);
        } else if (type === 'rotate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(900, t + 0.05);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.05);
        } else if (type === 'land') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(38, t + 0.09);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.09);
        } else if (type === 'fuse') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(110, t);
          osc.frequency.exponentialRampToValueAtTime(440, t + 0.18);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } else if (type === 'detonate') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.35);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } else if (type === 'cluster_pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.12);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'garbage') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(250, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.15);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'jab') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.exponentialRampToValueAtTime(90, t + 0.08);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === 'uppercut') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(750, t + 0.25);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'ko') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987, t);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.8);
        }
      } catch (e) {}
    }

    const COLS = 6;
    const ROWS = 12;
    const CELL_W = 6;
    const CELL_H = 8;
    const GEM_COLORS = [8, 12, 11, 10]; // Red, Blue, Green, Yellow

    let vsAiMode = true;
    let cameraShake = 0;
    let flashFrames = 0;
    let roundTimer = 99;
    let timerFrameCounter = 0;
    let gameState = 'PLAYING';

    class Particle {
      constructor(x, y, vx, vy, color, life, size = 1) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.size = size;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.12;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = PICO_PALETTE[this.color];
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
      }
    }

    class FloatingText {
      constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.life = 40;
      }
      update() {
        this.y -= 0.4;
        this.life--;
      }
      draw() {
        if (this.life <= 0) return;
        ctx.fillStyle = PICO_PALETTE[0];
        ctx.font = 'bold 9px monospace';
        ctx.fillText(this.text, Math.floor(this.x) + 1, Math.floor(this.y) + 1);
        ctx.fillStyle = PICO_PALETTE[this.color];
        ctx.fillText(this.text, Math.floor(this.x), Math.floor(this.y));
      }
    }

    let globalParticles = [];
    let globalFloatingTexts = [];

    // --- PUZZLE BOARD ENGINE ---
    class Board {
      constructor(id, offsetX, isAi = false) {
        this.id = id;
        this.offsetX = offsetX;
        this.offsetY = 16;
        this.isAi = isAi;

        this.grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        this.powerGems = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
        this.counterTimers = Array(ROWS).fill(null).map(() => Array(COLS).fill(3));
        this.squish = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));

        this.hp = 100;
        this.superMeter = 0;
        this.score = 0;
        this.comboCount = 0;
        this.dropCount = 0;
        this.pulseAngle = 0;

        this.pair = null;
        this.spawnPair();

        // 25% SLOWER DROP SPEED AGAIN (48 frames = ~1.6s per cell drop!)
        this.dropTimer = 0;
        this.dropInterval = 48;
        this.lockDelay = 0;

        this.anim = 'IDLE';
        this.animTimer = 0;
      }

      spawnPair() {
        this.dropCount++;

        if (this.dropCount % 12 === 0) {
          this.pair = { x: 2, y: 0, rot: 0, g1: 9, g2: Math.floor(Math.random() * 4) + 1, vy: 0 };
          return;
        }

        const g1 = Math.floor(Math.random() * 4) + 1;
        const isCrash = Math.random() < 0.32;
        const g2 = isCrash ? (Math.floor(Math.random() * 4) + 5) : (Math.floor(Math.random() * 4) + 1);

        this.pair = { x: 2, y: 0, rot: 0, g1: g1, g2: g2, vy: 0 };

        if (this.grid[0][2] !== 0 || this.grid[1][2] !== 0) {
          this.hp = 0;
          gameState = 'KO';
          play808Sfx('ko');
        }
      }

      getSubX() {
        if (this.pair.rot === 1) return this.pair.x + 1;
        if (this.pair.rot === 3) return this.pair.x - 1;
        return this.pair.x;
      }

      getSubY() {
        if (this.pair.rot === 0) return this.pair.y - 1;
        if (this.pair.rot === 2) return this.pair.y + 1;
        return this.pair.y;
      }

      isValid(x, y, rot) {
        let subX = x;
        let subY = y;
        if (rot === 0) subY = y - 1;
        if (rot === 1) subX = x + 1;
        if (rot === 2) subY = y + 1;
        if (rot === 3) subX = x - 1;

        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
        if (subX < 0 || subX >= COLS || subY < 0 || subY >= ROWS) return false;

        if (this.grid[y][x] !== 0) return false;
        if (subY >= 0 && this.grid[subY][subX] !== 0) return false;

        return true;
      }

      move(dir) {
        if (!this.pair) return;
        if (this.isValid(this.pair.x + dir, this.pair.y, this.pair.rot)) {
          this.pair.x += dir;
          play808Sfx('step');
        }
      }

      rotate(dir) {
        if (!this.pair) return;
        let newRot = (this.pair.rot + dir + 4) % 4;
        let newX = this.pair.x;
        let newY = this.pair.y;

        if (!this.isValid(newX, newY, newRot)) {
          if (this.isValid(newX - 1, newY, newRot)) newX -= 1;
          else if (this.isValid(newX + 1, newY, newRot)) newX += 1;
          else if (this.isValid(newX, newY - 1, newRot)) newY -= 1;
        }

        if (this.isValid(newX, newY, newRot)) {
          this.pair.x = newX;
          this.pair.y = newY;
          this.pair.rot = newRot;
          play808Sfx('rotate');
        }
      }

      dropSoft() {
        if (!this.pair) return;
        if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.pair.vy += 1;
          this.score += 1;
        } else {
          this.lockPair();
        }
      }

      dropHard() {
        if (!this.pair) return;
        while (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.score += 2;
        }
        this.lockPair();
      }

      lockPair() {
        if (!this.pair) return;
        const subX = this.getSubX();
        const subY = this.getSubY();

        if (this.pair.y >= 0) {
          this.grid[this.pair.y][this.pair.x] = this.pair.g1;
          this.squish[this.pair.y][this.pair.x] = 1.0;
          this.spawnImpactParticles(this.pair.x, this.pair.y);
        }
        if (subY >= 0) {
          this.grid[subY][subX] = this.pair.g2;
          this.squish[subY][subX] = 1.0;
          this.spawnImpactParticles(subX, subY);
        }

        play808Sfx('land');
        cameraShake = Math.max(cameraShake, 2);
        this.pair = null;

        this.updateCounterGems();

        this.applyGravity();
        this.processRainbowDiamond();
        this.detectPowerGems();
        this.processDetonations();
      }

      updateCounterGems() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 10) {
              this.counterTimers[r][c]--;
              if (this.counterTimers[r][c] <= 0) {
                this.grid[r][c] = Math.floor(Math.random() * 4) + 1;
              }
            }
          }
        }
      }

      spawnImpactParticles(col, row) {
        const px = this.offsetX + col * CELL_W + CELL_W / 2;
        const py = this.offsetY + row * CELL_H + CELL_H;
        for (let i = 0; i < 4; i++) {
          const vx = (Math.random() - 0.5) * 1.5;
          const vy = -Math.random() * 0.8;
          globalParticles.push(new Particle(px, py, vx, vy, 6, 12, 1));
        }
      }

      applyGravity() {
        for (let col = 0; col < COLS; col++) {
          for (let row = ROWS - 2; row >= 0; row--) {
            if (this.grid[row][col] !== 0 && this.grid[row + 1][col] === 0) {
              let r = row;
              while (r < ROWS - 1 && this.grid[r + 1][col] === 0) {
                this.grid[r + 1][col] = this.grid[r][col];
                this.powerGems[r + 1][col] = this.powerGems[r][col];
                this.counterTimers[r + 1][col] = this.counterTimers[r][col];
                this.grid[r][col] = 0;
                this.powerGems[r][col] = false;
                r++;
              }
              this.squish[r][col] = 0.8;
            }
          }
        }
      }

      processRainbowDiamond() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 9) {
              const adj = [[r+1,c], [r-1,c], [r,c+1], [r,c-1]];
              let targetColor = 0;
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  const g = this.grid[ar][ac];
                  if (g >= 1 && g <= 4) targetColor = g;
                  else if (g >= 5 && g <= 8) targetColor = g - 4;
                }
              });

              if (targetColor > 0 || r === ROWS - 1) {
                this.grid[r][c] = 0;
                if (targetColor > 0) {
                  for (let tr = 0; tr < ROWS; tr++) {
                    for (let tc = 0; tc < COLS; tc++) {
                      if (this.grid[tr][tc] === targetColor || this.grid[tr][tc] === targetColor + 4) {
                        this.grid[tr][tc] = 0;
                      }
                    }
                  }
                }
                play808Sfx('detonate');
                globalFloatingTexts.push(new FloatingText('DIAMOND BLAST!', this.offsetX + 2, this.offsetY + 30, 10));
              }
            }
          }
        }
      }

      detectPowerGems() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) this.powerGems[r][c] = false;
        }

        let newFusion = false;
        for (let r = 0; r < ROWS - 1; r++) {
          for (let c = 0; c < COLS - 1; c++) {
            const g = this.grid[r][c];
            if (g >= 1 && g <= 4) {
              if (this.grid[r][c + 1] === g && this.grid[r + 1][c] === g && this.grid[r + 1][c + 1] === g) {
                this.powerGems[r][c] = true;
                this.powerGems[r][c + 1] = true;
                this.powerGems[r + 1][c] = true;
                this.powerGems[r + 1][c + 1] = true;
                newFusion = true;
              }
            }
          }
        }

        if (newFusion) {
          play808Sfx('fuse');
          globalFloatingTexts.push(new FloatingText('POWER FUSION!', this.offsetX + 2, this.offsetY + 40, 10));
        }
      }

      processDetonations() {
        let matched = false;
        let isSecondaryCluster = false;
        let toClear = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const orb = this.grid[r][c];
            if (orb >= 5 && orb <= 8) {
              const targetColor = orb - 4;
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              let triggered = false;

              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === targetColor) triggered = true;
                }
              });

              if (triggered) {
                matched = true;
                toClear[r][c] = true;
                this.floodFillClear(r, c, targetColor, toClear);
              }
            }
          }
        }

        if (!matched) {
          const visited = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const g = this.grid[r][c];
              if (g >= 1 && g <= 4 && !visited[r][c]) {
                const group = [];
                this.getClusterGroup(r, c, g, visited, group);
                if (group.length >= 4) {
                  matched = true;
                  isSecondaryCluster = true;
                  group.forEach(([gr, gc]) => toClear[gr][gc] = true);
                }
              }
            }
          }
        }

        if (matched) {
          let clearCount = 0;
          let powerGemCleared = false;

          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (toClear[r][c]) {
                clearCount++;
                if (this.powerGems[r][c]) powerGemCleared = true;

                const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
                adj.forEach(([ar, ac]) => {
                  if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                    if (this.grid[ar][ac] === 10) toClear[ar][ac] = true;
                  }
                });

                const px = this.offsetX + c * CELL_W + CELL_W / 2;
                const py = this.offsetY + r * CELL_H + CELL_H / 2;
                const gColor = GEM_COLORS[(this.grid[r][c] - 1) % 4] || 8;

                for (let k = 0; k < 6; k++) {
                  const vx = (Math.random() - 0.5) * 3;
                  const vy = (Math.random() - 0.5) * 3 - 1;
                  globalParticles.push(new Particle(px, py, vx, vy, gColor, 20, 2));
                }

                this.grid[r][c] = 0;
                this.powerGems[r][c] = false;
              }
            }
          }

          this.comboCount++;
          const powerMult = isSecondaryCluster ? 0.5 : (powerGemCleared ? 1.6 : 1.0);
          const dmg = clearCount * 3 * powerMult * this.comboCount;
          const opponent = (this.id === 1) ? p2 : p1;

          opponent.hp = Math.max(0, opponent.hp - Math.floor(dmg));
          this.superMeter = Math.min(100, this.superMeter + clearCount * 4);
          this.score += Math.floor(dmg * 10);

          const baseGarbage = isSecondaryCluster ? Math.floor(clearCount / 2) : Math.max(2, Math.floor((clearCount - 2) * 1.4));
          const garbageToSend = Math.max(1, baseGarbage + (this.comboCount - 1) * 2);
          opponent.receiveGarbage(garbageToSend);

          flashFrames = 3;

          if (isSecondaryCluster) {
            globalFloatingTexts.push(new FloatingText(`CLUSTER POP! +${clearCount}`, this.offsetX + 2, this.offsetY + 30, 11));
            play808Sfx('cluster_pop');
          } else if (this.comboCount >= 2) {
            globalFloatingTexts.push(new FloatingText(`${this.comboCount}-CHAIN!`, this.offsetX + 4, this.offsetY + 30, 9));
            play808Sfx('detonate');
          } else {
            globalFloatingTexts.push(new FloatingText(`CRASH! +${clearCount}`, this.offsetX + 4, this.offsetY + 30, 10));
            play808Sfx('detonate');
          }

          if (powerGemCleared || this.comboCount >= 2) {
            this.anim = 'UPPERCUT';
            opponent.anim = 'FLINCH';
            cameraShake = 9;
            play808Sfx('uppercut');
          } else {
            this.anim = 'JAB';
            opponent.anim = 'FLINCH';
            cameraShake = 4;
            play808Sfx('jab');
          }
          this.animTimer = 24;
          opponent.animTimer = 24;

          setTimeout(() => {
            this.applyGravity();
            this.detectPowerGems();
            this.processDetonations();
          }, 260);

        } else {
          this.comboCount = 0;
          this.spawnPair();
        }
      }

      getClusterGroup(r, c, targetColor, visited, group) {
        visited[r][c] = true;
        group.push([r, c]);
        const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        adj.forEach(([ar, ac]) => {
          if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
            if (!visited[ar][ac] && this.grid[ar][ac] === targetColor) {
              this.getClusterGroup(ar, ac, targetColor, visited, group);
            }
          }
        });
      }

      receiveGarbage(count) {
        let dropped = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < COLS; c++) {
            if (dropped < count && this.grid[r][c] === 0) {
              this.grid[r][c] = 10;
              this.counterTimers[r][c] = 3;
              dropped++;
            }
          }
        }
        play808Sfx('garbage');
        globalFloatingTexts.push(new FloatingText(`GARBAGE +${count}!`, this.offsetX + 2, this.offsetY + 20, 8));
      }

      floodFillClear(r, c, targetColor, toClear) {
        const stack = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        while (stack.length > 0) {
          const [cr, cc] = stack.pop();
          if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS) {
            if (!toClear[cr][cc] && this.grid[cr][cc] === targetColor) {
              toClear[cr][cc] = true;
              stack.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
            }
          }
        }
      }

      update() {
        if (gameState !== 'PLAYING') return;

        this.pulseAngle += 0.12;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.squish[r][c] > 0) {
              this.squish[r][c] -= 0.1;
              if (this.squish[r][c] < 0) this.squish[r][c] = 0;
            }
          }
        }

        if (this.animTimer > 0) {
          this.animTimer--;
          if (this.animTimer === 0) this.anim = 'IDLE';
        }

        if (this.isAi && this.pair) {
          if (Math.random() < 0.1) {
            const targetX = Math.floor(Math.random() * COLS);
            if (this.pair.x < targetX) this.move(1);
            else if (this.pair.x > targetX) this.move(-1);
          }
          if (Math.random() < 0.05) this.rotate(1);
        }

        if (this.pair) {
          this.dropTimer++;
          if (this.dropTimer >= this.dropInterval) {
            this.dropTimer = 0;
            if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
              this.pair.y++;
            } else {
              this.lockDelay++;
              if (this.lockDelay >= 4) {
                this.lockDelay = 0;
                this.lockPair();
              }
            }
          }
        }
      }

      draw() {
        ctx.strokeStyle = PICO_PALETTE[5];
        ctx.lineWidth = 1;
        ctx.strokeRect(this.offsetX - 1, this.offsetY - 1, COLS * CELL_W + 2, ROWS * CELL_H + 2);

        ctx.fillStyle = PICO_PALETTE[0];
        ctx.fillRect(this.offsetX, this.offsetY, COLS * CELL_W, ROWS * CELL_H);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const g = this.grid[r][c];
            if (g !== 0) {
              this.drawGem(this.offsetX + c * CELL_W, this.offsetY + r * CELL_H, g, this.powerGems[r][c], this.squish[r][c], this.counterTimers[r][c]);
            }
          }
        }

        if (this.pair) {
          const mainX = this.offsetX + this.pair.x * CELL_W;
          const mainY = this.offsetY + this.pair.y * CELL_H;
          const subX = this.offsetX + this.getSubX() * CELL_W;
          const subY = this.offsetY + this.getSubY() * CELL_H;

          if (this.pair.vy > 0) {
            ctx.fillStyle = PICO_PALETTE[6];
            ctx.fillRect(mainX + 2, mainY - 3, 2, 3);
            ctx.fillRect(subX + 2, subY - 3, 2, 3);
          }

          if (this.pair.y >= 0) this.drawGem(mainX, mainY, this.pair.g1, false, 0, 3);
          if (this.getSubY() >= 0) this.drawGem(subX, subY, this.pair.g2, false, 0, 3);
        }
      }

      // --- HIGHLY DISTINCTIVE CRASH ORB & GEM RENDERING ---
      drawGem(x, y, type, isPower, squishFactor, timerVal) {
        let colorIdx = 8;
        let isCrash = false;
        let isDiamond = false;
        let isCounter = false;

        if (type >= 1 && type <= 4) colorIdx = GEM_COLORS[type - 1];
        else if (type >= 5 && type <= 8) {
          colorIdx = GEM_COLORS[type - 5];
          isCrash = true;
        } else if (type === 9) {
          isDiamond = true;
          colorIdx = 7;
        } else if (type === 10) {
          isCounter = true;
          colorIdx = 5;
        }

        const squishY = Math.floor(squishFactor * 2);
        const squishX = Math.floor(squishFactor * 1);
        const drawX = x - squishX / 2;
        const drawY = y + squishY;
        const drawW = CELL_W + squishX;
        const drawH = CELL_H - squishY;

        if (isCrash) {
          // --- HUGELY DISTINCTIVE PULSING CRASH ORB ---
          // 1. Animated Radial Glow Base
          const glowPulse = Math.abs(Math.sin(this.pulseAngle * 3));
          ctx.fillStyle = (glowPulse > 0.5) ? PICO_PALETTE[7] : PICO_PALETTE[10]; // Gold/White Pulse
          ctx.fillRect(drawX, drawY, drawW, drawH);

          // 2. Circular Orb Body (Rounded Corners)
          ctx.fillStyle = PICO_PALETTE[colorIdx];
          ctx.fillRect(drawX + 1, drawY, drawW - 2, drawH);
          ctx.fillRect(drawX, drawY + 1, drawW, drawH - 2);

          // 3. Inner Crystalline Highlight
          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 1, drawY + 1, 2, 2);

          // 4. Glowing Center Star (★) Core
          const starFrame = Math.floor(this.pulseAngle * 5) % 2;
          ctx.fillStyle = (starFrame === 0) ? PICO_PALETTE[10] : PICO_PALETTE[7];
          ctx.fillRect(drawX + 2, drawY + 3, 2, 2); // Center Core
          ctx.fillRect(drawX + 1, drawY + 3, 4, 1); // Horizontal Ray
          ctx.fillRect(drawX + 2, drawY + 2, 1, 4); // Vertical Ray

          // 5. Pulsing Black Border Frame
          ctx.strokeStyle = PICO_PALETTE[0];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

        } else {
          // --- NORMAL FACETED SQUARE GEM ---
          ctx.fillStyle = PICO_PALETTE[colorIdx];
          ctx.fillRect(drawX + 1, drawY + 1, drawW - 2, drawH - 2);

          ctx.strokeStyle = PICO_PALETTE[0];
          ctx.strokeRect(drawX, drawY, drawW, drawH);

          // Top-Left Beveled Highlight
          ctx.fillStyle = PICO_PALETTE[7];
          ctx.fillRect(drawX + 1, drawY + 1, drawW - 3, 1);
          ctx.fillRect(drawX + 1, drawY + 1, 1, drawH - 3);

          if (isPower) {
            ctx.strokeStyle = PICO_PALETTE[10];
            ctx.strokeRect(drawX + 0.5, drawY + 0.5, drawW - 1, drawH - 1);
          }

          if (isDiamond) {
            const diaCol = Math.floor(this.pulseAngle * 4) % 4;
            ctx.fillStyle = PICO_PALETTE[GEM_COLORS[diaCol]];
            ctx.fillRect(drawX + 2, drawY + 2, 2, 4);
          }

          if (isCounter) {
            ctx.fillStyle = PICO_PALETTE[7];
            ctx.font = '6px monospace';
            ctx.fillText(timerVal, drawX + 1, drawY + 6);
          }
        }
      }
    }

    const p1 = new Board(1, 4, false);
    const p2 = new Board(2, 88, true);

    // =========================================================================
    // HIGH-DETAIL 32x40 PIXEL BOXER ART ENGINE (REALISTIC ADRIEN BRONER vs DEEN)
    // =========================================================================
    function drawDetailedBoxer(x, y, isP1, anim) {
      let fx = x;
      let fy = y;

      if (anim === 'FLINCH') fx += isP1 ? -4 : 4;
      if (anim === 'UPPERCUT') fy -= 6;

      const skinBase = PICO_PALETTE[4];   // Brown #4
      const skinHi = PICO_PALETTE[15];   // Peach Highlight #15
      const blackCol = PICO_PALETTE[0];   // Black #0
      const whiteCol = PICO_PALETTE[7];   // White #7
      const goldCol = PICO_PALETTE[10];   // Gold #10

      if (isP1) {
        // --- ADRIEN "THE PROBLEM" BRONER ---
        // (Detailed Philly Shell stance, Red trunks with gold trim, Gold gloves & Gold chain)
        const trunksCol = PICO_PALETTE[8]; // Red #8

        // 1. Head & Hair (10x12 px detailed face)
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 4, fy, 10, 11);

        // Fade Hairline & Beard Stubble
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 4, fy, 10, 3);      // Fade hair
        ctx.fillRect(fx + 8, fy + 7, 6, 4);   // Stubble/Beard

        // Eye & Nose Detail
        ctx.fillStyle = whiteCol;
        ctx.fillRect(fx + 9, fy + 4, 3, 2);
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 10, fy + 4, 1, 2);
        ctx.fillStyle = skinHi;
        ctx.fillRect(fx + 11, fy + 5, 2, 2);  // Nose highlight

        // Gold Chain around Neck!
        ctx.fillStyle = goldCol;
        ctx.fillRect(fx + 5, fy + 11, 8, 2);

        // 2. Muscular Torso & Chest (Pecs & Abs definition)
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 3, fy + 13, 12, 10);
        ctx.fillStyle = skinHi;
        ctx.fillRect(fx + 5, fy + 14, 4, 3);  // Left Pec highlight
        ctx.fillRect(fx + 10, fy + 14, 4, 3); // Right Pec highlight
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 8, fy + 17, 2, 5);  // Abs center shadow line

        // Red Boxing Trunks with Gold Trim
        ctx.fillStyle = trunksCol;
        ctx.fillRect(fx + 3, fy + 23, 12, 8);
        ctx.fillStyle = goldCol;
        ctx.fillRect(fx + 3, fy + 23, 12, 3); // Wide Gold Waistband

        // Legs & Boxing Boots
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 4, fy + 31, 4, 5);
        ctx.fillRect(fx + 10, fy + 31, 4, 5);
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 3, fy + 34, 5, 4);  // Left Boot
        ctx.fillRect(fx + 10, fy + 34, 5, 4); // Right Boot
        ctx.fillStyle = whiteCol;
        ctx.fillRect(fx + 3, fy + 34, 5, 1);  // Boot Laces

        // 3. Gloves & Action Animations
        ctx.fillStyle = goldCol; // Gold Gloves
        if (anim === 'JAB') {
          // Extend Heavy Right Hook
          ctx.fillRect(fx + 15, fy + 12, 7, 6);
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 14, fy + 12, 2, 6); // Wrist tape
        } else if (anim === 'UPPERCUT') {
          // Explosive Uppercut surge
          ctx.fillRect(fx + 11, fy + 2, 6, 7);
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 11, fy + 8, 6, 2);
        } else {
          // Philly Shell Defensive Guard (Lead glove low, rear glove at chin)
          ctx.fillRect(fx + 11, fy + 11, 6, 6); // Rear Glove at chin
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 11, fy + 16, 6, 1);

          ctx.fillStyle = goldCol;
          ctx.fillRect(fx + 6, fy + 17, 6, 5);  // Lead Glove low at torso
        }

        // Crisp Black Outline
        ctx.strokeStyle = blackCol;
        ctx.strokeRect(fx + 2, fy - 1, 14, 40);

      } else {
        // --- DEEN THE GREAT ---
        // (Detailed High Guard Southpaw stance, Royal Blue trunks with white trim, Cyan gloves)
        const trunksCol = PICO_PALETTE[12]; // Royal Blue #12
        const glovesCol = PICO_PALETTE[12]; // Cyan/Blue #12

        // 1. Head & Buzzcut Hair
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 5, fy, 10, 11);

        // Buzzcut
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 5, fy, 10, 3);

        // Eyes & Nose Detail
        ctx.fillStyle = whiteCol;
        ctx.fillRect(fx + 7, fy + 4, 3, 2);
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 8, fy + 4, 1, 2);
        ctx.fillStyle = skinHi;
        ctx.fillRect(fx + 6, fy + 5, 2, 2);

        // 2. Muscular Lean Torso
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 4, fy + 11, 12, 11);
        ctx.fillStyle = skinHi;
        ctx.fillRect(fx + 5, fy + 13, 4, 3);
        ctx.fillRect(fx + 10, fy + 13, 4, 3);
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 9, fy + 16, 1, 5);

        // Royal Blue Trunks with White Trim
        ctx.fillStyle = trunksCol;
        ctx.fillRect(fx + 4, fy + 22, 12, 8);
        ctx.fillStyle = whiteCol;
        ctx.fillRect(fx + 4, fy + 22, 12, 3); // White Waistband

        // Legs & Boots
        ctx.fillStyle = skinBase;
        ctx.fillRect(fx + 5, fy + 30, 4, 5);
        ctx.fillRect(fx + 11, fy + 30, 4, 5);
        ctx.fillStyle = blackCol;
        ctx.fillRect(fx + 4, fy + 33, 5, 4);
        ctx.fillRect(fx + 11, fy + 33, 5, 4);
        ctx.fillStyle = whiteCol;
        ctx.fillRect(fx + 4, fy + 33, 5, 1);

        // 3. Gloves & Action Animations
        ctx.fillStyle = glovesCol;
        if (anim === 'JAB') {
          // Extend Southpaw Left Straight
          ctx.fillRect(fx - 3, fy + 11, 7, 6);
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 3, fy + 11, 2, 6);
        } else if (anim === 'UPPERCUT') {
          ctx.fillRect(fx + 3, fy + 2, 6, 7);
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 3, fy + 8, 6, 2);
        } else {
          // High Guard Southpaw Stance
          ctx.fillRect(fx + 3, fy + 10, 6, 6);  // Lead Glove high
          ctx.fillStyle = whiteCol;
          ctx.fillRect(fx + 3, fy + 15, 6, 1);

          ctx.fillStyle = glovesCol;
          ctx.fillRect(fx + 8, fy + 13, 6, 5);  // Rear Glove
        }

        ctx.strokeStyle = blackCol;
        ctx.strokeRect(fx + 3, fy - 1, 14, 40);
      }
    }

    function render() {
      if (flashFrames > 0) {
        flashFrames--;
        ctx.fillStyle = PICO_PALETTE[7];
        ctx.fillRect(0, 0, 128, 128);
        return;
      }

      ctx.save();
      if (cameraShake > 0) {
        const rx = (Math.random() * cameraShake - cameraShake / 2);
        const ry = (Math.random() * cameraShake - cameraShake / 2);
        ctx.translate(rx, ry);
        cameraShake *= 0.85;
        if (cameraShake < 0.5) cameraShake = 0;
      }

      ctx.fillStyle = PICO_PALETTE[1];
      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(0, 0, 128, 15);

      ctx.fillStyle = PICO_PALETTE[8];
      ctx.fillRect(4, 3, 42, 5);
      ctx.fillStyle = PICO_PALETTE[11];
      ctx.fillRect(4, 3, 42 * (p1.hp / 100), 5);

      ctx.fillStyle = PICO_PALETTE[8];
      ctx.fillRect(82, 3, 42, 5);
      ctx.fillStyle = PICO_PALETTE[11];
      ctx.fillRect(82, 3, 42 * (p2.hp / 100), 5);

      ctx.fillStyle = PICO_PALETTE[7];
      ctx.font = '8px monospace';
      ctx.fillText('BRONER', 4, 13);
      ctx.fillText('DEEN', 98, 13);
      ctx.fillText(roundTimer < 10 ? '0' + roundTimer : roundTimer, 58, 10);

      // Center Boxing Ring Stage (X: 41..86)
      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(41, 15, 46, 98);

      // Ring Ropes
      ctx.strokeStyle = PICO_PALETTE[6];
      ctx.beginPath();
      ctx.moveTo(41, 45); ctx.lineTo(86, 45);
      ctx.moveTo(41, 65); ctx.lineTo(86, 65);
      ctx.moveTo(41, 85); ctx.lineTo(86, 85);
      ctx.stroke();

      // Ring Floor Canvas
      ctx.fillStyle = PICO_PALETTE[7];
      ctx.fillRect(41, 90, 46, 23);

      // Draw Detailed Boxer Sprites!
      drawDetailedBoxer(41, 50, true, p1.anim);  // Adrien Broner (Large 32x40px)
      drawDetailedBoxer(65, 50, false, p2.anim); // Deen The Great (Large 32x40px)

      p1.draw();
      p2.draw();

      globalParticles.forEach(p => p.draw());
      globalFloatingTexts.forEach(t => t.draw());

      ctx.fillStyle = PICO_PALETTE[0];
      ctx.fillRect(0, 114, 128, 14);

      ctx.fillStyle = PICO_PALETTE[10];
      ctx.fillRect(4, 118, 40 * (p1.superMeter / 100), 4);
      ctx.fillRect(84, 118, 40 * (p2.superMeter / 100), 4);

      ctx.fillStyle = PICO_PALETTE[7];
      ctx.fillText('SP', 46, 123);
      ctx.fillText('SP', 74, 123);

      if (gameState === 'KO') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 45, 128, 38);
        ctx.fillStyle = PICO_PALETTE[10];
        ctx.font = 'bold 16px monospace';
        ctx.fillText('K.O.!', 44, 68);
      }

      ctx.restore();
    }

    function update() {
      p1.update();
      p2.update();

      globalParticles.forEach(p => p.update());
      globalParticles = globalParticles.filter(p => p.life > 0);

      globalFloatingTexts.forEach(t => t.update());
      globalFloatingTexts = globalFloatingTexts.filter(t => t.life > 0);

      if (gameState === 'PLAYING') {
        timerFrameCounter++;
        if (timerFrameCounter >= 30) {
          timerFrameCounter = 0;
          if (roundTimer > 0) roundTimer--;
        }
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft') p1.move(-1);
      if (e.key === 'ArrowRight') p1.move(1);
      if (e.key === 'ArrowDown') p1.dropSoft();
      if (e.key === 'ArrowUp') p1.dropHard();
      if (e.key === 'z' || e.key === 'Z') p1.rotate(-1);
      if (e.key === 'x' || e.key === 'X') p1.rotate(1);
    });

    document.getElementById('btnLeft').onclick = () => { initAudio(); p1.move(-1); };
    document.getElementById('btnRight').onclick = () => { initAudio(); p1.move(1); };
    document.getElementById('btnDown').onclick = () => { initAudio(); p1.dropSoft(); };
    document.getElementById('btnUp').onclick = () => { initAudio(); p1.dropHard(); };
    document.getElementById('btnO').onclick = () => { initAudio(); p1.rotate(-1); };
    document.getElementById('btnX').onclick = () => { initAudio(); p1.rotate(1); };

    document.getElementById('btnMode').onclick = () => {
      vsAiMode = !vsAiMode;
      p2.isAi = vsAiMode;
      document.getElementById('btnMode').innerText = vsAiMode ? 'MODE: VS AI' : 'MODE: VS P2';
    };

    document.getElementById('btnReset').onclick = () => {
      location.reload();
    };

    document.getElementById('btnAudio').onclick = () => {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? 'AUDIO: 808 ON' : 'AUDIO: OFF';
    };

    requestAnimationFrame(loop);
  </script>
</body>
</html>
