<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CRASH OUT: RING RUSH (v2.5.0) — PICO-8 Native Transparent Boxing</title>
  <style>
    :root {
      --pico-black: #000000;
      --pico-dark-blue: #1D2B53;
      --pico-dark-purple: #7E2553;
      --pico-dark-green: #008751;
      --pico-brown: #AB5236;
      --pico-dark-gray: #5F574F;
      --pico-light-gray: #C2C3C7;
      --pico-white: #FFF1E8;
      --pico-red: #FF004D;
      --pico-orange: #FFA300;
      --pico-yellow: #FFEC27;
      --pico-green: #00E436;
      --pico-blue: #29ADFF;
      --pico-lavender: #83769C;
      --pico-pink: #FF77A8;
      --pico-peach: #FFCCAA;

      /* Default GBA Theme: Classic Indigo */
      --gba-body: #43348a;
      --gba-body-shadow: #22184c;
      --gba-bezel: #202128;
      --gba-dpad: #2d2d35;
      --gba-btn: #8c1e50;
      --gba-btn-shadow: #4d0a28;
      --gba-accent: #b4aae6;
      --gba-text: #ffffff;
      --gba-grip: #5b49b5;
    }

    /* 🎨 12 DYNAMIC REALISTIC GBA SKINS */
    body.theme-indigo {
      --gba-body: #43348a; --gba-body-shadow: #22184c; --gba-bezel: #202128; --gba-dpad: #2d2d35;
      --gba-btn: #8c1e50; --gba-btn-shadow: #4d0a28; --gba-accent: #b4aae6; --gba-grip: #5b49b5;
    }
    body.theme-gold {
      --gba-body: #d4af37; --gba-body-shadow: #786015; --gba-bezel: #121216; --gba-dpad: #1c1c20;
      --gba-btn: #dc143c; --gba-btn-shadow: #73061a; --gba-accent: #ffec27; --gba-grip: #f3cf58;
    }
    body.theme-atomic {
      --gba-body: rgba(90, 75, 170, 0.94); --gba-body-shadow: #2e225e; --gba-bezel: #1c1a2e; --gba-dpad: #322f46;
      --gba-btn: #ff77a8; --gba-btn-shadow: #8c2652; --gba-accent: #29adff; --gba-grip: #7b68cc;
    }
    body.theme-kick {
      --gba-body: #18191f; --gba-body-shadow: #08080a; --gba-bezel: #0c0c10; --gba-dpad: #202126;
      --gba-btn: #00e436; --gba-btn-shadow: #006619; --gba-accent: #00e436; --gba-grip: #2b2d38;
    }
    body.theme-white {
      --gba-body: #ebeef5; --gba-body-shadow: #9ea4b5; --gba-bezel: #282a30; --gba-dpad: #727788;
      --gba-btn: #29adff; --gba-btn-shadow: #105280; --gba-accent: #465064; --gba-grip: #d0d5e2;
    }
    body.theme-red {
      --gba-body: #c3192d; --gba-body-shadow: #690a16; --gba-bezel: #16161a; --gba-dpad: #202024;
      --gba-btn: #ffd700; --gba-btn-shadow: #806c00; --gba-accent: #ffec27; --gba-grip: #e62c43;
    }
    body.theme-cobalt {
      --gba-body: #1941a5; --gba-body-shadow: #0b1d4d; --gba-bezel: #111522; --gba-dpad: #1e2233;
      --gba-btn: #ffc800; --gba-btn-shadow: #806400; --gba-accent: #29adff; --gba-grip: #285ad4;
    }
    body.theme-silver {
      --gba-body: #afb4be; --gba-body-shadow: #595e68; --gba-bezel: #1a1c22; --gba-dpad: #343842;
      --gba-btn: #dc1e3c; --gba-btn-shadow: #730a1a; --gba-accent: #ffffff; --gba-grip: #ccd1dc;
    }
    body.theme-cyber {
      --gba-body: #8c1478; --gba-body-shadow: #3d0734; --gba-bezel: #160c28; --gba-dpad: #220f38;
      --gba-btn: #00f0ff; --gba-btn-shadow: #007078; --gba-accent: #ff0080; --gba-grip: #b81ea0;
    }
    body.theme-dmg {
      --gba-body: #bebcaf; --gba-body-shadow: #6e6c60; --gba-bezel: #242955; --gba-dpad: #28282c;
      --gba-btn: #8c1e50; --gba-btn-shadow: #4d0a28; --gba-accent: #646464; --gba-grip: #d2d0c2;
    }
    body.theme-tiger {
      --gba-body: #e65f14; --gba-body-shadow: #7a2c04; --gba-bezel: #161212; --gba-dpad: #1e1e1e;
      --gba-btn: #ffec27; --gba-btn-shadow: #80750a; --gba-accent: #ffec27; --gba-grip: #ff7d30;
    }
    body.theme-emerald {
      --gba-body: #146e3c; --gba-body-shadow: #082e18; --gba-bezel: #0d1e15; --gba-dpad: #14281c;
      --gba-btn: #e6be28; --gba-btn-shadow: #735e10; --gba-accent: #00e436; --gba-grip: #1e9653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #06070a;
      color: var(--pico-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* 🎮 3D MOLDED GBA HANDHELD SHELL */
    .gba-shell {
      position: relative;
      width: min(100vw, 440px);
      height: min(100vh, 100dvh, 840px);
      background: radial-gradient(circle at 50% 20%, var(--gba-body) 0%, var(--gba-body-shadow) 100%);
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-radius: 38px;
      box-shadow: 0px 16px 42px rgba(0, 0, 0, 0.92), inset 0px 3px 6px rgba(255, 255, 255, 0.40), inset 0px -4px 8px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 10px 12px;
      overflow: hidden;
    }

    /* Side Grip Textures */
    .gba-shell::before, .gba-shell::after {
      content: '';
      position: absolute;
      top: 52%;
      width: 6px;
      height: 100px;
      background: repeating-linear-gradient(180deg, var(--gba-grip) 0px, var(--gba-grip) 4px, transparent 4px, transparent 12px);
      border-radius: 3px;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.6);
    }
    .gba-shell::before { left: 4px; }
    .gba-shell::after { right: 4px; }

    /* Top Shoulder Buttons & Quick Bar */
    .gba-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      margin-bottom: 3px;
      z-index: 10;
    }

    .btn-shoulder {
      background: linear-gradient(180deg, var(--gba-dpad) 0%, #121318 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: var(--gba-accent);
      font-weight: 900;
      font-size: 11px;
      padding: 4px 14px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: inset 0px 1px 1px rgba(255, 255, 255, 0.35), 0px 3px 5px rgba(0,0,0,0.8);
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .btn-shoulder:active {
      transform: translateY(2px);
      box-shadow: inset 0px 1px 2px rgba(0,0,0,0.8), 0px 1px 2px rgba(0,0,0,0.8);
    }

    .btn-skin-toggle {
      background: linear-gradient(180deg, #1D2B53 0%, #000000 100%);
      border: 1px solid var(--gba-accent);
      color: var(--pico-yellow);
      font-size: 9px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
      transition: transform 0.06s;
    }
    .btn-skin-toggle:active {
      transform: scale(0.95);
    }

    /* 🖥️ MAXIMIZED PICO-8 GLASS SCREEN BEZEL */
    .gba-screen-bezel {
      width: 100%;
      background: radial-gradient(circle at center, var(--gba-bezel) 0%, #0c0d10 100%);
      border-radius: 16px;
      padding: 4px 8px 6px 8px;
      border: 3px solid #060608;
      box-shadow: inset 0px 0px 16px rgba(0, 0, 0, 0.98), 0px 4px 12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .bezel-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      padding: 0 2px;
    }

    .power-led-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .power-led {
      width: 7px;
      height: 7px;
      background-color: var(--pico-green);
      border-radius: 50%;
      box-shadow: 0px 0px 8px var(--pico-green);
    }

    .power-text {
      font-size: 7px;
      font-weight: 900;
      color: #727788;
      letter-spacing: 0.5px;
    }

    .bezel-opt-buttons {
      display: flex;
      gap: 4px;
    }

    .btn-opt {
      background: #000000;
      border: 1px solid var(--gba-accent);
      color: var(--pico-yellow);
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 8px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0px 1px 2px #000000;
    }

    /* 🖥️ EDGE-MAXIMIZED 1:1 PICO-8 CANVAS */
    canvas#picoCanvas {
      width: 100%;
      max-width: min(88vw, 320px);
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background-color: var(--pico-black);
      border: 2px solid #000000;
      border-radius: 4px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.95);
      cursor: pointer;
    }

    .bezel-bottom-branding {
      margin-top: 3px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--gba-accent);
      text-shadow: 1px 1px 0px #000000;
    }

    /* 🕹️ GBA LOWER CONTROLS AREA */
    .gba-controls-area {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 2px 4px;
    }

    /* 3D RECESSED D-PAD HOUSING WELL */
    .dpad-well {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 100%);
      box-shadow: inset 0px 4px 8px rgba(0,0,0,0.95), 0px 1px 1px rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3D MOLDED GBA CROSS D-PAD WITH EMBOSSED ARROWS */
    .gba-dpad {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(3, 38px);
      gap: 0px;
      filter: drop-shadow(0px 5px 6px rgba(0, 0, 0, 0.85));
    }

    .btn-dir {
      background: linear-gradient(180deg, var(--gba-dpad) 0%, #15161b 100%);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--gba-accent);
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0px 4px 0px #090a0d, inset 0px 1px 1px rgba(255, 255, 255, 0.35);
      text-shadow: 0px 1px 0px rgba(255,255,255,0.2), 0px -1px 0px #000000;
      transition: transform 0.05s, box-shadow 0.05s, background 0.05s;
    }

    .btn-dir:active, .btn-dir.active {
      transform: translateY(3px);
      box-shadow: 0px 1px 0px #090a0d, inset 0px 1px 2px rgba(0,0,0,0.8);
      background: var(--gba-accent);
      color: #000000;
    }

    .dpad-up { grid-column: 2; grid-row: 1; border-top-left-radius: 6px; border-top-right-radius: 6px; }
    .dpad-left { grid-column: 1; grid-row: 2; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    .dpad-center { grid-column: 2; grid-row: 2; background: radial-gradient(circle at center, #18181e 0%, var(--gba-dpad) 100%); pointer-events: none; }
    .dpad-right { grid-column: 3; grid-row: 2; border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
    .dpad-down { grid-column: 2; grid-row: 3; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }

    /* 3D ACTION BUTTON WELL & ANGLED BUTTONS */
    .action-buttons-well {
      padding: 6px 8px;
      border-radius: 36px;
      background: rgba(0, 0, 0, 0.40);
      box-shadow: inset 0px 3px 6px rgba(0,0,0,0.92), 0px 1px 1px rgba(255,255,255,0.25);
      transform: rotate(-18deg);
    }

    .gba-action-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      filter: drop-shadow(0px 6px 8px rgba(0, 0, 0, 0.85));
    }

    /* 3D CONVEX PHYSICAL ACTION BUTTONS (REAL-LIFE DEPTH) */
    .btn-gba-action {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.45) 0%, transparent 45%), radial-gradient(circle at 50% 50%, var(--gba-btn) 0%, var(--gba-btn-shadow) 100%);
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: var(--gba-text);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0px 6px 0px var(--gba-btn-shadow), 0px 8px 14px rgba(0, 0, 0, 0.75), inset 0px 2px 3px rgba(255, 255, 255, 0.5), inset 0px -2px 3px rgba(0,0,0,0.5);
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .btn-gba-action:active, .btn-gba-action.active {
      transform: translateY(5px);
      box-shadow: 0px 1px 0px var(--gba-btn-shadow), 0px 2px 4px rgba(0, 0, 0, 0.8), inset 0px 1px 3px rgba(0, 0, 0, 0.8);
    }

    .btn-gba-action span {
      font-size: 7px;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    /* 3D START & SELECT RUBBER PILLS */
    .gba-center-pills {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 26px;
      margin-bottom: 2px;
    }

    .pill-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .btn-pill {
      width: 40px;
      height: 12px;
      background: linear-gradient(180deg, var(--gba-dpad) 0%, #121216 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      cursor: pointer;
      transform: rotate(-22deg);
      box-shadow: 0px 3px 0px #090a0e, 0px 4px 6px rgba(0, 0, 0, 0.8), inset 0px 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .btn-pill:active {
      transform: rotate(-22deg) translateY(2px);
      box-shadow: 0px 1px 0px #090a0e, inset 0px 1px 2px rgba(0,0,0,0.8);
    }

    .pill-label {
      font-size: 7px;
      font-weight: 900;
      color: var(--gba-accent);
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0px #000000;
    }

    /* 🌮 POCKET TACO & HORIZONTAL CLAMP CONTROLLER LANDSCAPE MAXIMIZED */
    @media (orientation: landscape), (min-aspect-ratio: 1.2) {
      body {
        background-color: #050608;
      }

      .gba-shell {
        width: 100vw;
        max-width: 980px;
        height: 100vh;
        height: 100dvh;
        max-height: 100%;
        border-radius: 24px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 4px 18px;
      }

      .gba-screen-bezel {
        order: 2;
        width: auto;
        height: calc(100vh - 12px);
        height: calc(100dvh - 12px);
        max-height: 520px;
        aspect-ratio: 1 / 1;
        padding: 4px 6px 6px 6px;
      }

      canvas#picoCanvas {
        height: 84%;
        max-height: 420px;
        max-width: 420px;
        width: auto;
      }

      .gba-controls-area {
        order: 1;
        width: auto;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        padding: 0;
      }

      .action-buttons-well {
        order: 3;
        transform: rotate(-14deg);
      }

      .gba-center-pills {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        gap: 36px;
      }
    }

    /* Gamepad Connected HUD Badge */
    body.gamepad-active .power-led {
      background-color: var(--pico-blue) !important;
      box-shadow: 0px 0px 10px var(--pico-blue) !important;
    }
    body.gamepad-active .power-text::after {
      content: ' • TACO GP';
      color: var(--pico-blue);
      font-weight: 900;
    }
    body.gamepad-active .btn-dir, body.gamepad-active .btn-gba-action {
      opacity: 0.75;
    }

  </style>
</head>
<body>

      <div class="gba-shell">
    <!-- GBA TOP BAR & SHOULDER TRIGGERS -->
    <div class="gba-top-bar">
      <button class="btn-shoulder" id="btnShoulderL">L</button>
      <button class="btn-skin-toggle" id="btnSkin">🎨 SKIN: INDIGO</button>
      <button class="btn-shoulder" id="btnShoulderR">R</button>
    </div>

    <!-- 🖥️ MAXIMIZED GBA GLASS SCREEN BEZEL & CANVAS -->
    <div class="gba-screen-bezel">
      <div class="bezel-top-row">
        <div class="power-led-group">
          <div class="power-led"></div>
          <span class="power-text">POWER</span>
        </div>
        <div class="bezel-opt-buttons">
          <button class="btn-opt" id="btnAudio">AUDIO: OFF</button>
          <button class="btn-opt" id="btnReset">HOME</button>
        </div>
      </div>

      <!-- MAXIMIZED PICO-8 128x128 GAME ENGINE CANVAS -->
      <canvas id="picoCanvas" width="256" height="256"></canvas>

      <div class="bezel-bottom-branding">PICO-8 ADVANCE</div>
    </div>

    <!-- 🕹️ 3D MOLDED GBA CONTROLS AREA -->
    <div class="gba-controls-area">
      <!-- 3D RECESSED D-PAD HOUSING WELL -->
      <div class="dpad-well">
        <div class="gba-dpad" id="dpadPad">
          <button class="btn-dir dpad-up" id="btnUp" aria-label="Drop Hard">▲</button>
          <button class="btn-dir dpad-left" id="btnLeft" aria-label="Move Left">◀</button>
          <div class="dpad-center"></div>
          <button class="btn-dir dpad-right" id="btnRight" aria-label="Move Right">▶</button>
          <button class="btn-dir dpad-down" id="btnDown" aria-label="Drop Soft">▼</button>
        </div>
      </div>

      <!-- 3D CONVEX B & A ACTION BUTTONS IN CYLINDRICAL WELL -->
      <div class="action-buttons-well">
        <div class="gba-action-buttons">
          <button class="btn-gba-action" id="btnO">B<span>ROTATE</span></button>
          <button class="btn-gba-action" id="btnX">A<span>DROP/SP</span></button>
        </div>
      </div>
    </div>

    <!-- GBA START & SELECT RUBBER PILLS -->
    <div class="gba-center-pills">
      <div class="pill-group">
        <button class="btn-pill" id="btnMode" aria-label="Select"></button>
        <span class="pill-label">SELECT</span>
      </div>
      <div class="pill-group">
        <button class="btn-pill" id="btnStart" aria-label="Start"></button>
        <span class="pill-label">START</span>
      </div>
    </div>
  </div>

  <script>

    // =========================================================================
    // 🎨 12-SKIN GBA THEME SWITCHER ENGINE
    // =========================================================================
    const GBA_SKIN_LIST = [
      { id: 'theme-indigo', label: 'INDIGO' },
      { id: 'theme-gold', label: 'GOLD SP' },
      { id: 'theme-atomic', label: 'ATOMIC' },
      { id: 'theme-kick', label: 'STEALTH' },
      { id: 'theme-white', label: 'ARCTIC' },
      { id: 'theme-red', label: 'FLAME RED' },
      { id: 'theme-cobalt', label: 'COBALT' },
      { id: 'theme-silver', label: 'PLATINUM' },
      { id: 'theme-cyber', label: 'CYBER 80S' },
      { id: 'theme-dmg', label: 'DMG 1989' },
      { id: 'theme-tiger', label: 'TIGER ORG' },
      { id: 'theme-emerald', label: 'EMERALD' }
    ];

    let currentSkinIdx = 0;
    try {
      const savedSkin = localStorage.getItem('gba_skin_idx');
      if (savedSkin !== null) currentSkinIdx = parseInt(savedSkin, 10) % GBA_SKIN_LIST.length;
    } catch(e) {}

    function applyGbaSkin(idx) {
      currentSkinIdx = idx % GBA_SKIN_LIST.length;
      const skin = GBA_SKIN_LIST[currentSkinIdx];
      document.body.className = skin.id;
      const btn = document.getElementById('btnSkin');
      if (btn) btn.innerText = '🎨 ' + skin.label;
      try {
        localStorage.setItem('gba_skin_idx', currentSkinIdx);
      } catch(e) {}
    }
    applyGbaSkin(currentSkinIdx);
    initTouchHaptics();

    // =========================================================================

    // =========================================================================
    function initTouchHaptics() {
      const dpadEl = document.getElementById('dpadPad');
      if (!dpadEl) return;

      let activeDir = null;

      function handleDpadPoint(clientX, clientY) {
        const rect = dpadEl.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = clientX - centerX;
        const dy = clientY - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 10) {
          clearDpadActive();
          return;
        }

        let newDir = null;
        if (Math.abs(dx) > Math.abs(dy)) {
          newDir = dx < 0 ? 'btnLeft' : 'btnRight';
        } else {
          newDir = dy < 0 ? 'btnUp' : 'btnDown';
        }

        if (newDir !== activeDir) {
          clearDpadActive();
          activeDir = newDir;
          const btn = document.getElementById(activeDir);
          if (btn) {
            btn.classList.add('active');
            triggerHaptic(14);
            btn.click();
          }
        }
      }

      function clearDpadActive() {
        if (activeDir) {
          const btn = document.getElementById(activeDir);
          if (btn) btn.classList.remove('active');
          activeDir = null;
        }
      }

      dpadEl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        dpadEl.setPointerCapture(e.pointerId);
        handleDpadPoint(e.clientX, e.clientY);
      });

      dpadEl.addEventListener('pointermove', (e) => {
        if (e.buttons > 0) {
          handleDpadPoint(e.clientX, e.clientY);
        }
      });

      dpadEl.addEventListener('pointerup', (e) => {
        clearDpadActive();
        try { dpadEl.releasePointerCapture(e.pointerId); } catch(err) {}
      });

      dpadEl.addEventListener('pointercancel', clearDpadActive);
    }

      getSubX() {
        if (!this.pair) return 2;
        if (this.pair.rot === 1) return this.pair.x + 1;
        if (this.pair.rot === 3) return this.pair.x - 1;
        return this.pair.x;
      }

      getSubY() {
        if (!this.pair) return 0;
        if (this.pair.rot === 0) return this.pair.y - 1;
        if (this.pair.rot === 2) return this.pair.y + 1;
        return this.pair.y;
      }

      isValid(x, y, rot) {
        let subX = x;
        let subY = y;
        if (rot === 0) subY = y - 1;
        if (rot === 1) subX = x + 1;
        if (rot === 2) subY = y + 1;
        if (rot === 3) subX = x - 1;

        if (x < 0 || x >= COLS || y >= ROWS) return false;
        if (subX < 0 || subX >= COLS || subY >= ROWS) return false;

        if (y >= 0 && this.grid[y][x] !== 0) return false;
        if (subY >= 0 && this.grid[subY][subX] !== 0) return false;

        return true;
      }

      move(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x + dir, this.pair.y, this.pair.rot)) {
          this.pair.x += dir;
          play808Sfx('step');
          triggerHaptic(10);
        }
      }

      rotate(dir) {
        if (!this.pair || this.state !== 'FALLING') return;
        let newRot = (this.pair.rot + dir + 4) % 4;
        let newX = this.pair.x;
        let newY = this.pair.y;

        if (!this.isValid(newX, newY, newRot)) {
          if (this.isValid(newX - 1, newY, newRot)) newX -= 1;
          else if (this.isValid(newX + 1, newY, newRot)) newX += 1;
          else if (this.isValid(newX, newY - 1, newRot)) newY -= 1;
        }

        if (this.isValid(newX, newY, newRot)) {
          this.pair.x = newX;
          this.pair.y = newY;
          this.pair.rot = newRot;
          play808Sfx('rotate');
          triggerHaptic(15);
        }
      }

      dropSoft() {
        if (!this.pair || this.state !== 'FALLING') return;
        if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.pair.vy += 1;
          this.score += 1;
          triggerHaptic(8);
        } else {
          this.lockPair();
        }
      }

      dropHard() {
        if (!this.pair || this.state !== 'FALLING') return;
        while (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
          this.pair.y += 1;
          this.score += 2;
        }
        triggerHaptic(25);
        this.lockPair();
      }

      lockPair() {
        if (!this.pair) return;
        const subX = this.getSubX();
        const subY = this.getSubY();

        if (this.pair.y >= 0) {
          this.grid[this.pair.y][this.pair.x] = this.pair.g1;
          this.squish[this.pair.y][this.pair.x] = 1.0;
          this.spawnImpactParticles(this.pair.x, this.pair.y);
        }
        if (subY >= 0) {
          this.grid[subY][subX] = this.pair.g2;
          this.squish[subY][subX] = 1.0;
          this.spawnImpactParticles(subX, subY);
        }

        play808Sfx('land');
        cameraShake = Math.max(cameraShake, 2);
        this.pair = null;

        this.updateCounterGems();
        this.applyGravity();
        this.processRainbowDiamond();
        this.applyGravity();
        this.detectPowerGems();
        
        const matchFound = this.evaluateMatches();
        if (matchFound) {
          this.state = 'CLEARING';
          this.clearTimer = 34;
        } else {
          this.comboCount = 0;
          // After settling without clears, check if incoming garbage should drop
          if (this.pendingGarbage > 0) {
            this.dropPendingGarbage();
            this.applyGravity();
            this.state = 'GRAVITY';
          } else {
            this.state = 'SPAWN';
          }
        }
      }

      updateCounterGems() {
        // Puzzle Fighter: counter gems tick down by 1 each time a piece locks.
        // When timer hits 0, they convert to their predetermined signature pattern color.
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 10) {
              this.counterTimers[r][c]--;
              if (this.counterTimers[r][c] <= 0) {
                this.grid[r][c] = this.counterColors[r][c] || (Math.floor(Math.random() * 4) + 1);
              }
            }
          }
        }
      }

      spawnImpactParticles(col, row) {
        const px = this.offsetX + col * CELL_W + CELL_W / 2;
        const py = this.offsetY + row * CELL_H + CELL_H;
        for (let i = 0; i < 4; i++) {
          const vx = (Math.random() - 0.5) * 1.5;
          const vy = -Math.random() * 0.8;
          globalParticles.push(new Particle(px, py, vx, vy, 6, 12, 1));
        }
      }

      applyGravity() {
        let anyMoved = false;
        let pass = true;
        while (pass) {
          pass = false;
          for (let col = 0; col < COLS; col++) {
            for (let row = ROWS - 2; row >= 0; row--) {
              if (this.grid[row][col] !== 0 && this.grid[row + 1][col] === 0) {
                let r = row;
                while (r < ROWS - 1 && this.grid[r + 1][col] === 0) {
                  this.grid[r + 1][col] = this.grid[r][col];
                  this.powerGems[r + 1][col] = this.powerGems[r][col];
                  this.counterTimers[r + 1][col] = this.counterTimers[r][col];
                  this.counterColors[r + 1][col] = this.counterColors[r][col];
                  this.grid[r][col] = 0;
                  this.powerGems[r][col] = false;
                  this.counterTimers[r][col] = 3;
                  this.counterColors[r][col] = 0;
                  r++;
                }
                this.squish[r][col] = 0.5;
                pass = true;
                anyMoved = true;
              }
            }
          }
        }
        return anyMoved;
      }

      processRainbowDiamond() {
        let totalCleared = 0;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.grid[r][c] === 9) {
              const adj = [[r+1,c], [r-1,c], [r,c+1], [r,c-1]];
              let targetColor = 0;
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  const g = this.grid[ar][ac];
                  if (g >= 1 && g <= 4) targetColor = g;
                  else if (g >= 5 && g <= 8) targetColor = g - 4;
                }
              });

              if (targetColor > 0 || r === ROWS - 1) {
                this.grid[r][c] = 0;
                totalCleared++;

                if (targetColor > 0) {
                  for (let tr = 0; tr < ROWS; tr++) {
                    for (let tc = 0; tc < COLS; tc++) {
                      if (this.grid[tr][tc] === targetColor || this.grid[tr][tc] === targetColor + 4) {
                        const px = this.offsetX + tc * CELL_W + CELL_W / 2;
                        const py = this.offsetY + tr * CELL_H + CELL_H / 2;
                        for (let k = 0; k < 5; k++) {
                          const vx = (Math.random() - 0.5) * 3.5;
                          const vy = (Math.random() - 0.5) * 3.5 - 1;
                          globalParticles.push(new Particle(px, py, vx, vy, GEM_COLORS[(targetColor - 1) % 4], 22, 2));
                        }
                        this.grid[tr][tc] = 0;
                        this.powerGems[tr][tc] = false;
                        totalCleared++;
                      }
                    }
                  }
                }
                play808Sfx('detonate');
                globalFloatingTexts.push(new FloatingText('DIAMOND BLAST!', this.offsetX + 2, this.offsetY + 30, 10));
              }
            }
          }
        }

        if (totalCleared > 0) {
          const opponent = (this.id === 1) ? p2 : p1;
          const dmg = Math.floor(totalCleared * 3 * 1.6);
          opponent.hp = Math.max(0, opponent.hp - dmg);
        if (opponent.hp <= 0 && appState === 'PLAYING') {
          startKnockdown(opponent.id);
        }
          this.superMeter = Math.min(100, this.superMeter + totalCleared * 6);
          this.score += Math.floor(dmg * 10);
          if (this.score > highScore) { highScore = this.score; dset(0, highScore); }
          
          const garbageToSend = Math.max(1, Math.ceil(totalCleared / 1.8));
          this.sendGarbageWithOffset(garbageToSend, opponent);

          cameraShake = Math.max(cameraShake, 14);
          flashFrames = Math.max(flashFrames, 4);
          this.anim = 'UPPERCUT';
          this.animTimer = 72;
          opponent.anim = 'FLINCH';
          opponent.animTimer = 72;
          globalFloatingTexts.push(new FloatingText(`-${dmg} DIAMOND!`, 58, 42, 10));
        }
      }

      detectPowerGems() {
        // === PUZZLE FIGHTER POWER GEM DETECTION ===
        // Finds ALL maximal rectangles of same-color normal gems (≥2×2).
        const prev = Array(ROWS).fill(null).map((_, r) =>
          Array(COLS).fill(null).map((_, c) => this.powerGems[r][c])
        );

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) this.powerGems[r][c] = false;
        }

        for (let r = 0; r < ROWS - 1; r++) {
          for (let c = 0; c < COLS - 1; c++) {
            const g = this.grid[r][c];
            if (g < 1 || g > 4) continue;

            let maxW = 0;
            for (let cc = c; cc < COLS; cc++) {
              if (this.grid[r][cc] === g) maxW++;
              else break;
            }

            for (let w = maxW; w >= 2; w--) {
              let h = 1;
              for (let rr = r + 1; rr < ROWS; rr++) {
                let rowOk = true;
                for (let cc = c; cc < c + w; cc++) {
                  if (this.grid[rr][cc] !== g) { rowOk = false; break; }
                }
                if (rowOk) h++;
                else break;
              }
              if (h >= 2) {
                for (let rr = r; rr < r + h; rr++) {
                  for (let cc = c; cc < c + w; cc++) {
                    this.powerGems[rr][cc] = true;
                  }
                }
              }
            }
          }
        }

        let newFusion = false;
        for (let r = 0; r < ROWS && !newFusion; r++) {
          for (let c = 0; c < COLS && !newFusion; c++) {
            if (this.powerGems[r][c] && !prev[r][c]) newFusion = true;
          }
        }
        if (newFusion) {
          play808Sfx('fuse');
          globalFloatingTexts.push(new FloatingText('POWER GEM!', this.offsetX + 2, this.offsetY + 40, 10));
        }
      }

      evaluateMatches() {
        // === PURE PUZZLE FIGHTER DETONATION SYSTEM ===
        // Normal gems NEVER auto-pop on their own. They only detonate when a Crash Gem (5-8)
        // or Rainbow Diamond touches a matching color group.
        let toClear = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
        let primaryCount = 0;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const orb = this.grid[r][c];
            if (orb >= 5 && orb <= 8) {
              const targetColor = orb - 4;
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              let triggered = false;

              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === targetColor || this.grid[ar][ac] === orb) triggered = true;
                }
              });

              if (triggered) {
                toClear[r][c] = true;
                this.floodFillClear(r, c, targetColor, toClear);
              }
            }
          }
        }

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) primaryCount++;
          }
        }

        if (primaryCount > 0) {
          this.pendingClear = { toClear, primaryCount };
          return true;
        }
        return false;
      }

      clearPendingMatches() {
        if (!this.pendingClear) return;
        const { toClear, primaryCount } = this.pendingClear;
        let clearCount = 0;
        let powerGemCount = 0;

        // First pass: also mark adjacent counter gems for clearing
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) {
              const adj = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
              adj.forEach(([ar, ac]) => {
                if (ar >= 0 && ar < ROWS && ac >= 0 && ac < COLS) {
                  if (this.grid[ar][ac] === 10) toClear[ar][ac] = true;
                }
              });
            }
          }
        }

        // Second pass: clear gems and spawn particles
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (toClear[r][c]) {
              clearCount++;
              if (this.powerGems[r][c]) powerGemCount++;

              const px = this.offsetX + c * CELL_W + CELL_W / 2;
              const py = this.offsetY + r * CELL_H + CELL_H / 2;
              const gColor = GEM_COLORS[(this.grid[r][c] - 1) % 4] || 8;

              for (let k = 0; k < 6; k++) {
                const vx = (Math.random() - 0.5) * 3;
                const vy = (Math.random() - 0.5) * 3 - 1;
                globalParticles.push(new Particle(px, py, vx, vy, gColor, 20, 2));
              }

              this.grid[r][c] = 0;
              this.powerGems[r][c] = false;
            }
          }
        }

        // === PUZZLE FIGHTER DAMAGE & COUNTER OFFSETTING ===
        this.comboCount++;
        if (this.comboCount > maxComboTrack) {
          maxComboTrack = this.comboCount;
          dset(1, maxComboTrack);
        }

        const powerBonus = powerGemCount > 0 ? 1.75 : 1.0;
        const chainMult = this.comboCount;
        const dmg = Math.floor(clearCount * 3.5 * powerBonus * chainMult);
        const opponent = (this.id === 1) ? p2 : p1;

        opponent.hp = Math.max(0, opponent.hp - dmg);
        if (opponent.hp <= 0 && appState === 'PLAYING') {
          startKnockdown(opponent.id);
        }
        this.superMeter = Math.min(100, this.superMeter + clearCount * 7);
        this.score += Math.floor(dmg * 10);

        if (this.score > highScore) {
          highScore = this.score;
          dset(0, highScore);
        }

        // Calculate garbage to send: scales with clear count, power gems, and chains
        const garbageToSend = Math.max(1, Math.ceil(clearCount / 1.8) + (this.comboCount - 1) * 3 + (powerGemCount > 0 ? 4 : 0));
        this.sendGarbageWithOffset(garbageToSend, opponent);

        flashFrames = 3;
        globalFloatingTexts.push(new FloatingText(`-${dmg} HP!`, 58, 32, 8));

        // Punch animation intensity scales with combo and power
        if (powerGemCount > 0 || this.comboCount >= 3) {
          this.anim = 'UPPERCUT';
          cameraShake = 14;
          play808Sfx('uppercut');
        } else if (this.comboCount === 2 || clearCount >= 5) {
          this.anim = 'HOOK';
          cameraShake = 10;
          play808Sfx('hook');
        } else if (clearCount >= 4) {
          this.anim = 'STRAIGHT';
          cameraShake = 8;
          play808Sfx('straight');
        } else {
          this.anim = 'JAB';
          cameraShake = 6;
          play808Sfx('jab');
        }
        this.animTimer = 72;

        // Opponent reaction
        const defenseRoll = Math.random();
        if (defenseRoll < 0.15) {
          opponent.anim = 'BLOCK';
        } else if (defenseRoll < 0.25) {
          opponent.anim = 'DODGE';
        } else if (defenseRoll < 0.32) {
          opponent.anim = 'LEAN';
        } else if (defenseRoll < 0.38) {
          opponent.anim = 'SHOULDER_ROLL';
        } else {
          opponent.anim = 'FLINCH';
        }
        opponent.animTimer = 72;

        this.pendingClear = null;
        // Check knockdown stamina recovery
        if (appState === 'KNOCKDOWN' && knockdownData && knockdownData.fallenId === this.id) {
          knockdownData.stamina += clearCount * 18 + (powerGemCount > 0 ? 40 : 0);
          globalFloatingTexts.push(new FloatingText('+STAMINA!', this.offsetX + 4, this.offsetY + 30, 11));
          if (knockdownData.stamina >= 100) {
            heGetsUp();
          }
        }
      }

      sendGarbageWithOffset(count, opponent) {
        // === INCOMING GARBAGE WARNING & OFFSETTING ===
        // If the player has incoming pending garbage in their Warning Tray,
        // their attack first counters and cancels their own pending garbage!
        if (this.pendingGarbage > 0) {
          const offset = Math.min(this.pendingGarbage, count);
          this.pendingGarbage -= offset;
          const leftover = count - offset;
          globalFloatingTexts.push(new FloatingText(`COUNTER -${offset}!`, this.offsetX + 2, this.offsetY + 12, 10));
          if (leftover > 0) {
            opponent.receiveGarbage(leftover);
          }
        } else {
          opponent.receiveGarbage(count);
        }
      }

      receiveGarbage(count) {
        // Queues into Warning Tray waiting above the board
        this.pendingGarbage += count;
        play808Sfx('garbage');
        globalFloatingTexts.push(new FloatingText(`+${count} WARN!`, this.offsetX + 2, this.offsetY + 22, 8));
      }

      dropPendingGarbage() {
        if (this.pendingGarbage <= 0) return;
        const dropAmount = Math.min(this.pendingGarbage, 12);
        this.pendingGarbage -= dropAmount;

        const attacker = (this.id === 1) ? p2 : p1;
        const attackerPattern = FIGHTER_GARBAGE_PATTERNS[attacker.fighterId] || FIGHTER_GARBAGE_PATTERNS.broner;

        let placed = 0;
        for (let r = 0; r < ROWS && placed < dropAmount; r++) {
          for (let c = 0; c < COLS && placed < dropAmount; c++) {
            if (this.grid[r][c] === 0) {
              this.grid[r][c] = 10; // Counter gem
              this.counterTimers[r][c] = 5; // Standard 5-turn counter
              const patRow = attackerPattern[r % attackerPattern.length];
              this.counterColors[r][c] = patRow[c % 6];
              placed++;
            }
          }
        }
        play808Sfx('land');
        globalFloatingTexts.push(new FloatingText(`DROP +${placed}!`, this.offsetX + 2, this.offsetY + 20, 8));
      }

      floodFillClear(r, c, targetColor, toClear) {
        const stack = [[r-1,c], [r+1,c], [r,c-1], [r,c+1]];
        while (stack.length > 0) {
          const [cr, cc] = stack.pop();
          if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS) {
            if (!toClear[cr][cc] && (this.grid[cr][cc] === targetColor || this.grid[cr][cc] === targetColor + 4)) {
              toClear[cr][cc] = true;
              stack.push([cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]);
            }
          }
        }
      }

      // Visual timers must tick every frame so punch/flinch retract animations
      // resolve even while the round outcome (KO) is being shown.
      tickVisuals() {
        this.pulseAngle += 0.12;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.squish[r][c] > 0) {
              this.squish[r][c] -= 0.15;
              if (this.squish[r][c] < 0.01) this.squish[r][c] = 0;
            }
          }
        }

        if (this.animTimer > 0) {
          this.animTimer--;
          if (this.animTimer <= 0) {
            this.animTimer = 0;
            this.anim = 'IDLE';
          }
        }
      }

      getDropInterval() {
        const elapsedSeconds = Math.max(0, 99 - roundTimer);
        const speedLevel = Math.min(10, Math.floor(elapsedSeconds / 10) + 1);
        return Math.max(14, 52 - (speedLevel - 1) * 4);
      }

      update() {
        this.tickVisuals();

        if (appState !== 'PLAYING' && appState !== 'KNOCKDOWN') return;

        if (this.state === 'SPAWN') {
          this.spawnPair();
        } else if (this.state === 'CLEARING') {
          this.clearTimer--;
          if (this.clearTimer <= 0) {
            this.clearPendingMatches();
            this.applyGravity();
            this.state = 'GRAVITY';
          }
        } else if (this.state === 'GRAVITY') {
          const moved = this.applyGravity();
          if (!moved) {
            this.detectPowerGems();
            const matchFound = this.evaluateMatches();
            if (matchFound) {
              this.state = 'CLEARING';
              this.clearTimer = 28;
            } else {
              this.comboCount = 0;
              if (this.pendingGarbage > 0) {
                this.dropPendingGarbage();
                this.applyGravity();
                this.state = 'GRAVITY';
              } else {
                this.state = 'SPAWN';
              }
            }
          }
        } else if (this.state === 'FALLING') {
          if (this.isAi && this.pair) {
            this.aiTimer++;
            if (this.aiTimer >= 16) {
              this.aiTimer = 0;

              let moved = false;
              if (this.pair.x < this.aiTargetCol) {
                if (this.isValid(this.pair.x + 1, this.pair.y, this.pair.rot)) {
                  this.move(1);
                  moved = true;
                }
              } else if (this.pair.x > this.aiTargetCol) {
                if (this.isValid(this.pair.x - 1, this.pair.y, this.pair.rot)) {
                  this.move(-1);
                  moved = true;
                }
              }

              if (!moved) {
                if (Math.random() < 0.25) this.rotate(1);
                if (Math.random() < 0.30) this.dropSoft();
              }

              if (this.superMeter >= 100 && Math.random() < 0.15) this.triggerSuper();
            }
          }

          if (this.pair) {
            this.dropTimer++;
            const targetInterval = this.getDropInterval();
            if (this.dropTimer >= targetInterval) {
              this.dropTimer = 0;
              if (this.isValid(this.pair.x, this.pair.y + 1, this.pair.rot)) {
                this.pair.y++;
              } else {
                this.lockDelay++;
                if (this.lockDelay >= 8) {
                  this.lockDelay = 0;
                  this.lockPair();
                }
              }
            }
          }
        }
      }

      draw() {
        // Playfield outer border
        ctx.strokeStyle = getPalColor(5);
        ctx.lineWidth = 1;
        ctx.strokeRect(this.offsetX - 1, this.offsetY - 1, COLS * CELL_W + 2, ROWS * CELL_H + 2);

        // Dark playfield background
        ctx.fillStyle = getPalColor(0);
        ctx.fillRect(this.offsetX, this.offsetY, COLS * CELL_W, ROWS * CELL_H);

        // Subtle playfield grid
        ctx.strokeStyle = 'rgba(29, 43, 83, 0.45)';
        for (let r = 1; r < ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(this.offsetX, this.offsetY + r * CELL_H);
          ctx.lineTo(this.offsetX + COLS * CELL_W, this.offsetY + r * CELL_H);
          ctx.stroke();
        }
        for (let c = 1; c < COLS; c++) {
          ctx.beginPath();
          ctx.moveTo(this.offsetX + c * CELL_W, this.offsetY);
          ctx.lineTo(this.offsetX + c * CELL_W, this.offsetY + ROWS * CELL_H);
          ctx.stroke();
        }

        // Top danger alert warning line (Rows 0-2)
        let topRowFilled = false;
        for (let c = 0; c < COLS; c++) {
          if (this.grid[2][c] !== 0) topRowFilled = true;
        }
        if (topRowFilled && Math.floor(globalFrameCount / 10) % 2 === 0) {
          ctx.strokeStyle = getPalColor(8);
          ctx.strokeRect(this.offsetX, this.offsetY, COLS * CELL_W, 3 * CELL_H);
        }

        // === INCOMING GARBAGE WARNING TRAY ===
        if (this.pendingGarbage > 0) {
          const warnBlocks = Math.min(COLS, Math.ceil(this.pendingGarbage / 2));
          const flash = Math.floor(globalFrameCount / 8) % 2 === 0;
          for (let i = 0; i < warnBlocks; i++) {
            const wx = this.offsetX + i * CELL_W;
            const wy = this.offsetY - 6;
            ctx.fillStyle = flash ? getPalColor(8) : getPalColor(10);
            ctx.fillRect(wx + 1, wy, CELL_W - 2, 4);
            ctx.fillStyle = getPalColor(7);
            ctx.fillRect(wx + 2, wy + 1, CELL_W - 4, 2);
          }
          printPico('!' + this.pendingGarbage, this.offsetX + COLS * CELL_W - 10, this.offsetY - 6, flash ? 8 : 10, 1);
        }

        // Ghost drop placement indicator
        if (this.pair && this.state === 'FALLING') {
          let ghostY = this.pair.y;
          while (this.isValid(this.pair.x, ghostY + 1, this.pair.rot)) {
            ghostY++;
          }
          if (ghostY > this.pair.y) {
            const gMainX = this.offsetX + this.pair.x * CELL_W;
            const gMainY = this.offsetY + ghostY * CELL_H;
            const gSubX = this.offsetX + this.getSubX() * CELL_W;
            const gSubY = this.offsetY + (this.pair.rot === 0 ? ghostY - 1 : (this.pair.rot === 2 ? ghostY + 1 : ghostY)) * CELL_H;

            ctx.strokeStyle = 'rgba(255, 241, 232, 0.35)';
            if (ghostY >= 0) ctx.strokeRect(gMainX + 0.5, gMainY + 0.5, CELL_W - 1, CELL_H - 1);
            if (gSubY >= this.offsetY) ctx.strokeRect(gSubX + 0.5, gSubY + 0.5, CELL_W - 1, CELL_H - 1);
          }
        }

        // Placed Gems
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const g = this.grid[r][c];
            if (g !== 0) {
              this.drawGem(this.offsetX + c * CELL_W, this.offsetY + r * CELL_H, g, this.powerGems[r][c], r, c, this.counterTimers[r][c]);
            }
          }
        }

        // Falling Gem Pair
        if (this.pair && this.state === 'FALLING') {
          const mainX = this.offsetX + this.pair.x * CELL_W;
          const mainY = this.offsetY + this.pair.y * CELL_H;
          const subX = this.offsetX + this.getSubX() * CELL_W;
          const subY = this.offsetY + this.getSubY() * CELL_H;

          if (this.pair.y >= 0) this.drawGem(mainX, mainY, this.pair.g1, false, -1, -1, 3);
          if (this.getSubY() >= 0) this.drawGem(subX, subY, this.pair.g2, false, -1, -1, 3);
        }
      }

      drawGem(x, y, type, isPower, gridR, gridC, timerVal) {
        const dx = Math.floor(x);
        const dy = Math.floor(y);
        const w = CELL_W;   // 6
        const h = CELL_H;   // 8

        const isCrash   = (type >= 5 && type <= 8);
        const isDiamond = (type === 9);
        const isCounter = (type === 10);
        const cIdx = isCrash ? (type - 4) : type;

        const PAL = {
          1: [8,  14, 2],  // Red:    red / pink / dark maroon
          2: [12, 13, 1],  // Blue:   blue / lavender / dark navy
          3: [11, 10, 3],  // Green:  green / yellow / dark-green
          4: [10, 7,  9],  // Yellow: yellow / white / orange
        };
        const c = PAL[cIdx] || PAL[1];
        const base  = getPalColor(c[0]);
        const lite  = getPalColor(c[1]);
        const dark  = getPalColor(c[2]);
        const white = getPalColor(7);

        if (isCrash) {
          // ── CRASH ORB (Pulsing Circular Gem) ──
          const pulse = (Math.floor(globalFrameCount / 6) % 2 === 0);

          // Outer dark corner cuts for circular silhouette
          ctx.fillStyle = getPalColor(0);
          ctx.fillRect(dx, dy, w, h);

          // Orb body
          ctx.fillStyle = base;
          ctx.fillRect(dx + 1, dy, w - 2, h);
          ctx.fillRect(dx, dy + 1, w, h - 2);

          // Inner glowing core
          ctx.fillStyle = lite;
          ctx.fillRect(dx + 1, dy + 1, w - 2, 2);
          ctx.fillRect(dx + 2, dy + 2, 2, 2);

          // Bright center glint
          if (pulse) {
            ctx.fillStyle = white;
            ctx.fillRect(dx + 2, dy + 2, 2, 2);
          } else {
            ctx.fillStyle = white;
            ctx.fillRect(dx + 2, dy + 1, 1, 1);
          }

          // Bottom bevel shadow
          ctx.fillStyle = dark;
          ctx.fillRect(dx + 1, dy + h - 2, w - 2, 1);
          ctx.fillRect(dx + w - 2, dy + 2, 1, h - 3);

        } else if (isDiamond) {
          // ── RAINBOW DIAMOND ──
          const phase = Math.floor(this.pulseAngle * 6) % 4;
          const dCols = [8, 12, 11, 10];

          ctx.fillStyle = getPalColor(dCols[phase]);
          ctx.fillRect(dx, dy, w, h);

          // White facet bevel
          ctx.fillStyle = white;
          ctx.fillRect(dx, dy, w, 1);
          ctx.fillRect(dx, dy, 1, h);
          ctx.fillRect(dx + 2, dy + 2, 2, 4);

          ctx.fillStyle = getPalColor(dCols[(phase + 1) % 4]);
          ctx.fillRect(dx, dy + h - 1, w, 1);
          ctx.fillRect(dx + w - 1, dy, 1, h);

        } else if (isCounter) {
          // ── COUNTER BLOCK (Stone Timer Slab) ──
          ctx.fillStyle = getPalColor(5);
          ctx.fillRect(dx, dy, w, h);

          // Stone highlight & shadow
          ctx.fillStyle = getPalColor(6);
          ctx.fillRect(dx, dy, w, 1);
          ctx.fillRect(dx, dy, 1, h);

          ctx.fillStyle = getPalColor(1);
          ctx.fillRect(dx, dy + h - 1, w, 1);
          ctx.fillRect(dx + w - 1, dy, 1, h);

          // Inner dark inset for timer number
          ctx.fillStyle = getPalColor(0);
          ctx.fillRect(dx + 1, dy + 1, w - 2, h - 2);

          // Direct Pixel Countdown Number
          printPico(String(timerVal || 3), dx + 2, dy + 2, 7, 1);

        } else {
          // ── NORMAL GEM / FUSED POWER GEM ──
          ctx.fillStyle = base;
          ctx.fillRect(dx, dy, w, h);

          // Determine neighbor connections for fused Power Gem borders
          const topSame    = (gridR > 0 && isPower && this.powerGems[gridR - 1][gridC] && this.grid[gridR - 1][gridC] === type);
          const bottomSame = (gridR < ROWS - 1 && isPower && this.powerGems[gridR + 1][gridC] && this.grid[gridR + 1][gridC] === type);
          const leftSame   = (gridC > 0 && isPower && this.powerGems[gridR][gridC - 1] && this.grid[gridR][gridC - 1] === type);
          const rightSame  = (gridC < COLS - 1 && isPower && this.powerGems[gridR][gridC + 1] && this.grid[gridR][gridC + 1] === type);

          if (isPower) {

    // DYNAMIC COLOR-KEYING TRANSPARENCY HELPER

    function createTransparentCanvas(img) {
      const offCanvas = document.createElement('canvas');
      const w = img.naturalWidth || img.width || 22;
      const h = img.naturalHeight || img.height || 40;
      offCanvas.width = w;
      offCanvas.height = h;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(img, 0, 0);
      const imgData = offCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Sample top-left corner color
      const bgR = data[0], bgG = data[1], bgB = data[2];

      let minX = w, maxX = 0, minY = h, maxY = 0;
      let hasFg = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const r = data[idx], g = data[idx+1], b = data[idx+2];
          
          // Background color distance
          const dist = Math.sqrt(Math.pow(r - bgR, 2) + Math.pow(g - bgG, 2) + Math.pow(b - bgB, 2));
          // Pure black background or white corner flash
          const isBlack = (r < 18 && g < 18 && b < 18);
          const isWhite = (r > 240 && g > 240 && b > 240);

          if (dist < 28 || isBlack || isWhite) {
            data[idx+3] = 0; // Alpha = 0 (100% transparent)
          } else {
            hasFg = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      offCtx.putImageData(imgData, 0, 0);

      offCanvas.bounds = hasFg ? {
        xmin: minX,
        xmax: maxX,
        ymin: minY,
        ymax: maxY,
        w: maxX - minX + 1,
        h: maxY - minY + 1
      } : { xmin: 0, xmax: w - 1, ymin: 0, ymax: h - 1, w, h };

      return offCanvas;
    }

    function createNormalizedPunchCanvas(img, id) {
      const rawCanvas = createTransparentCanvas(img);
      const w = rawCanvas.width;
      const h = rawCanvas.height;
      const normCanvas = document.createElement('canvas');
      normCanvas.width = w;
      normCanvas.height = h;
      const nCtx = normCanvas.getContext('2d');
      nCtx.imageSmoothingEnabled = false;

      const qw = w / 2;
      const qh = h / 2;
      const flips = PUNCH_FLIPS[id] || [];
      const quadBounds = [];

      for (let q = 0; q < 4; q++) {
        const col = q % 2;
        const row = Math.floor(q / 2);
        const sx = col * qw;
        const sy = row * qh;

        nCtx.save();
        if (flips.includes(q)) {
          // Flip this quadrant horizontally within its cell so it faces RIGHT (toward opponent)
          nCtx.translate(sx + qw, sy);
          nCtx.scale(-1, 1);
          nCtx.drawImage(rawCanvas, sx, sy, qw, qh, 0, 0, qw, qh);
        } else {
          nCtx.drawImage(rawCanvas, sx, sy, qw, qh, sx, sy, qw, qh);
        }
        nCtx.restore();

        // Scan this quadrant's tight bounding box in normCanvas
        const qImgData = nCtx.getImageData(sx, sy, qw, qh).data;
        let qMinX = qw, qMaxX = 0, qMinY = qh, qMaxY = 0;
        let qHasFg = false;
        for (let y = 0; y < qh; y++) {
          for (let x = 0; x < qw; x++) {
            const idx = (y * qw + x) * 4;
            if (qImgData[idx+3] > 0) {
              qHasFg = true;
              if (x < qMinX) qMinX = x;
              if (x > qMaxX) qMaxX = x;
              if (y < qMinY) qMinY = y;
              if (y > qMaxY) qMaxY = y;
            }
          }
        }
        quadBounds.push(qHasFg ? {
          sx: sx + qMinX,
          sy: sy + qMinY,
          w: qMaxX - qMinX + 1,
          h: qMaxY - qMinY + 1
        } : { sx, sy, w: qw, h: qh });
      }

      normCanvas.quadBounds = quadBounds;
      return normCanvas;
    }

    // 16-bit Capcom Arcade Sprites & Punch Grids Map for ALL 14 Roster Fighters

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function triggerHaptic(duration = 15) {

    const canvas = document.getElementById('picoCanvas');

    // =========================================================================
    // BOXER RENDERER — 2-IMAGE + CANVAS TRANSFORMS (ZERO INCONSISTENCY)
    // =========================================================================
    // Only 2 source images per boxer guarantees perfect visual consistency.
    // Idle sprite: used for idle, duck, lean, shoulder roll, block, flinch
    // Punch grid: used for jab, straight, hook, uppercut
    // All defensive poses are the SAME idle sprite with Canvas transforms.

    const PUNCH_QUAD = { 'JAB': 0, 'STRAIGHT': 1, 'HOOK': 2, 'UPPERCUT': 3 };

    // All 14 Capcom-style sprites natively face RIGHT.
    // Player 1 (left side of ring) -> NO flip (faces RIGHT towards center/opponent).
    // Player 2 (right side of ring) -> ALWAYS flip horizontal (faces LEFT towards center/opponent).

    function drawBoxer(x, y, isP1, anim, animTimer) {
      let fx = x;
      const groundY = 90; // Ground plane on the ring canvas floor (Y=88..113)

      const idleController = isP1 ? idleP1 : idleP2;
      const { dx } = idleController.getOffsets();
      fx += Math.floor(dx);

      let isHitFlash = false;
      let extProgress = 0;
      let horzShift = 0;
      let vertShift = 0;
      let bodyTilt = 0;
      let vertSquash = 1.0;

      const timerVal = animTimer || 0;
      const progress = 1.0 - (timerVal / 72.0);
      let usePunch = false;
      let punchQuad = 0;

      if (anim === 'JAB' || anim === 'STRAIGHT' || anim === 'HOOK' || anim === 'UPPERCUT') {
        punchQuad = PUNCH_QUAD[anim] || 0;

        // Authentic Capcom Street Fighter 3-phase Strike Kinematics:
        // Phase 1: Windup / Anticipation (progress < 0.12) -> Idle stance with subtle backstep
        // Phase 2: Active Strike & Impact Hold (0.12 <= progress < 0.72) -> Punch Frame with forward lunge
        // Phase 3: Recovery (progress >= 0.72) -> Smooth return to Idle stance
        if (progress < 0.12) {
          extProgress = -0.15 * Math.sin((progress / 0.12) * Math.PI);
          usePunch = false;
        } else if (progress < 0.72) {
          extProgress = 1.0;
          usePunch = true;
        } else {
          usePunch = (progress < 0.82);
          const ret = (progress - 0.72) / 0.28;
          extProgress = 1.0 - smoothstep(0.0, 1.0, ret);
        }

        // Move-specific forward lunge distance into center ring
        let baseLunge = 6.0;
        if (anim === 'STRAIGHT') baseLunge = 8.5;
        if (anim === 'HOOK') baseLunge = 7.0;
        if (anim === 'UPPERCUT') {
          baseLunge = 5.5;
          if (usePunch) {
            vertShift = -3.5; // Upward leap on uppercut
          }
        }

        horzShift = (isP1 ? 1 : -1) * (extProgress * baseLunge);

        const impactFlag = isP1 ? impactTriggeredP1 : impactTriggeredP2;
        if (progress >= 0.28 && progress < 0.60 && !impactFlag) {
          if (isP1) impactTriggeredP1 = true; else impactTriggeredP2 = true;
          triggerImpactBurst(isP1 ? 62 : 66, anim === 'UPPERCUT' ? 54 : anim === 'HOOK' ? 58 : 60);
          triggerHaptic(30);
        } else if (progress >= 0.88) {
          if (isP1) impactTriggeredP1 = false; else impactTriggeredP2 = false;
        }

      } else if (anim === 'FLINCH') {
        let fp = 0;
        if (progress < 0.40) fp = 0;
        else if (progress < 0.65) fp = smoothstep(0.40, 0.65, progress);
        else fp = 1.0 - smoothstep(0.65, 1.00, progress);
        horzShift = (isP1 ? -1 : 1) * fp * 5.0;
        bodyTilt = (isP1 ? -1 : 1) * fp * 0.12;
        if (progress >= 0.42 && progress < 0.58) isHitFlash = true;

      } else if (anim === 'DODGE' || anim === 'DUCK') {
        // Natural bob & weave ducking: athletic knee bend and forward-dip slip under punches
        let dp = 0;
        if (progress < 0.25) dp = smoothstep(0.0, 0.25, progress);
        else if (progress < 0.65) dp = 1.0;
        else dp = 1.0 - smoothstep(0.65, 1.0, progress);
        
        // Zero scaling/squashing distortion: 100% natural pixel art scale
        vertSquash = 1.0;
        vertShift = dp * 6.0; // Clean downward dip (head dips below high punch level)
        bodyTilt = (isP1 ? 1 : -1) * dp * 0.10; // Subtle forward slip angle
        horzShift = (isP1 ? 1 : -1) * dp * 2.0; // Subtle forward weave step

      } else if (anim === 'LEAN') {
        // Pull counter / lean back away from incoming strike
        let lp = 0;
        if (progress < 0.25) lp = smoothstep(0.0, 0.25, progress);
        else if (progress < 0.65) lp = 1.0;
        else lp = 1.0 - smoothstep(0.65, 1.0, progress);
        
        vertSquash = 1.0;
        bodyTilt = (isP1 ? -1 : 1) * lp * 0.14; // Arch back at waist
        horzShift = (isP1 ? -1 : 1) * lp * -4.0; // Step back away from center
      } else if (anim === 'BLOCK' || anim === 'SHOULDER_ROLL') {
        // Solid guard brace and shoulder deflection
        let bp = 0;
        if (progress < 0.20) bp = smoothstep(0.0, 0.20, progress);
        else if (progress < 0.70) bp = 1.0;
        else bp = 1.0 - smoothstep(0.70, 1.0, progress);
        
        vertSquash = 1.0;
        bodyTilt = (isP1 ? 1 : -1) * bp * 0.10; // Turn shoulder inward to deflect
        vertShift = bp * 1.5; // Athletic grounded stance drop
        horzShift = (isP1 ? -1 : 1) * bp * -1.5; // Absorbing blow impact
      } else if (anim === 'KNOCKDOWN') {
        // Fighter flat on the canvas mat
        bodyTilt = (isP1 ? -1 : 1) * 1.45;
        vertShift = 6;
        horzShift = (isP1 ? -1 : 1) * -8;
      } else if (anim === 'TAUNT') {
        // Standing boxer raises fists in neutral corner
        vertShift = -2;
        bodyTilt = (isP1 ? 1 : -1) * 0.08;
      }
      // Ground shadow placed directly on the floor below the boots
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.ellipse(fx, groundY + 1, 9, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();

      const fObj = isP1 ? ROSTER[p1SelectIdx] : ROSTER[p2SelectIdx];
      const fId = fObj ? fObj.id : (isP1 ? 'broner' : 'deen');
      const details = FIGHTER_DETAILS[fId] || { skin: 4, hair: 0, trunks: 8, gloves: 8 };

      // P1 on left side always faces RIGHT (scale 1); P2 on right side always faces LEFT (scale -1)
      const needsFlip = !isP1;
      ctx.translate(fx, groundY);
      if (needsFlip) {
        ctx.scale(-1, 1);
      }

      // Apply body tilt
      if (bodyTilt !== 0) {
        ctx.rotate(needsFlip ? -bodyTilt : bodyTilt);
      }

      if (isHitFlash) {
        ctx.filter = 'brightness(2.5) contrast(1.5)';
      }

      // === DRAW SPRITE ANCHORED ON FEET AT GROUND PLANE (Y=90) ===
      const idleCanvas = ROSTER_IDLE_CANVASES[fId] || (isP1 ? bronerIdleCanvas : deenIdleCanvas);
      const punchCanvas = ROSTER_PUNCH_CANVASES[fId] || (fId === 'deen' ? deenPunchCanvas : bronerPunchCanvas);

      // Target height at native 128x128 PICO-8 scale (38px)
      const targetH = 38 * vertSquash;

      if (usePunch && punchCanvas && punchCanvas.quadBounds && punchCanvas.quadBounds[punchQuad]) {
        const qb = punchCanvas.quadBounds[punchQuad];
        const aspect = qb.w / qb.h;
        const dh = targetH;
        const dw = dh * aspect;
        const ddx = -dw * 0.35; // Centered on body axis, reach extending forward
        const ddy = -dh + vertShift; // Boots (ddy + dh) anchored directly at Y=0 (groundY=90)!

    function printPico(text, x, y, col = 7, scale = 1, shadow = false) {
      const str = String(text).toUpperCase();
      const color = getPalColor(col);
      const shadowColor = getPalColor(0);
      const startX = Math.floor(x);
      const startY = Math.floor(y);
      const charAdvance = 5 * scale;

      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch === '\n') continue;
        const glyph = BITMAP_4X5[ch] || BITMAP_4X5[' '];
        const gx = startX + i * charAdvance;

        if (shadow) {
          ctx.fillStyle = shadowColor;
          for (let r = 0; r < 5; r++) {
            const row = glyph[r];
            for (let c = 0; c < 4; c++) {
              if (row[c] === '1') {
                ctx.fillRect(gx + c * scale + scale, startY + r * scale + scale, scale, scale);
              }
            }
          }
        }

        ctx.fillStyle = color;
        for (let r = 0; r < 5; r++) {
          const row = glyph[r];
          for (let c = 0; c < 4; c++) {
            if (row[c] === '1') {
              ctx.fillRect(gx + c * scale, startY + r * scale, scale, scale);
            }
          }
        }
      }
    }

    function printPicoCenter(text, cy, col = 7, scale = 1, shadow = false) {
      const str = String(text).toUpperCase();
      const totalW = str.length * 5 * scale - scale;
      const startX = Math.floor((128 - totalW) / 2);
      printPico(str, startX, cy, col, scale, shadow);
    }

    function printPicoWrap(text, x, y, maxW, col = 7, scale = 1, shadow = false) {
      const words = String(text).toUpperCase().split(' ');
      let line = '';
      let curY = Math.floor(y);
      const lineH = 6 * scale;
      const charAdvance = 5 * scale;

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const testLine = line ? line + ' ' + word : word;
        const testW = testLine.length * charAdvance - scale;
        if (testW > maxW && line) {
          printPico(line, x, curY, col, scale, shadow);
          line = word;
          curY += lineH;
        } else {
          line = testLine;
        }
      }
      if (line) {
        printPico(line, x, curY, col, scale, shadow);
      }
      return curY + lineH;
    }

    function drawBoxerAvatar(ctx, f, x, y, isBig = false, flip = false, isDown = false) {
      if (!f) return;
      const fId = f.id || 'broner';
      const idleCanvas = ROSTER_IDLE_CANVASES[fId] || (fId === 'deen' ? deenPunchCanvas : bronerIdleCanvas);
      if (!idleCanvas) return;

      const b = idleCanvas.bounds || { xmin: 0, ymin: 0, w: idleCanvas.width, h: idleCanvas.height };
      const aspect = b.w / b.h;
      const dh = isBig ? 42 : 24;
      const dw = dh * aspect;

      ctx.save();
      ctx.translate(x, y);

      // Ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.60)';
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(8, dw * 0.45), 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      if (flip) {
        ctx.scale(-1, 1);
      }

      if (isDown) {
        ctx.rotate(flip ? 1.45 : -1.45);
        ctx.drawImage(idleCanvas, b.xmin, b.ymin, b.w, b.h, -dw / 2, -dh * 0.4, dw, dh);
      } else {
        ctx.drawImage(idleCanvas, b.xmin, b.ymin, b.w, b.h, -dw / 2, -dh, dw, dh);
      }

      ctx.restore();
    }

    function wrapText(c, text, x, y, maxW, lineH) {
      let line = '';
      let yy = y;
      for (const word of text.split(' ')) {
        const test = line ? line + ' ' + word : word;
        if (c.measureText(test).width > maxW && line) {
          c.fillText(line, x, yy);
          line = word;
          yy += lineH;
        } else {
          line = test;
        }
      }
      if (line) c.fillText(line, x, yy);
      return yy;
    }

    window.addEventListener('gamepadconnected', (e) => {

    function pollGamepadInput() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      if (!gamepads) return;
      const gp = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];
      if (!gp) return;

      if (!gamepadConnected) {
        gamepadConnected = true;
        document.body.classList.add('gamepad-active');
      }

      initAudio();

      const isDown = (idx) => gp.buttons[idx] && (gp.buttons[idx].pressed || gp.buttons[idx].value > 0.5);
      const isJustPressed = (idx) => {
        const pressed = isDown(idx);
        const wasPressed = !!lastGpButtons[idx];
        return pressed && !wasPressed;
      };

      const axisX = gp.axes[0] !== undefined ? gp.axes[0] : (gp.axes[6] || 0);
      const axisY = gp.axes[1] !== undefined ? gp.axes[1] : (gp.axes[7] || 0);

      const dpadLeft = isDown(14) || axisX < -0.5;
      const dpadRight = isDown(15) || axisX > 0.5;
      const dpadUp = isDown(12) || axisY < -0.5;
      const dpadDown = isDown(13) || axisY > 0.5;

      const btnA = isJustPressed(0); // A / Cross
      const btnB = isJustPressed(1); // B / Circle
      const btnX = isJustPressed(2); // X / Square
      const btnY = isJustPressed(3); // Y / Triangle
      const btnL = isJustPressed(4) || isJustPressed(6); // L1 / L2

    function update() {
      pollGamepadInput();
      globalFrameCount++;
      window.globalFrameCount = globalFrameCount;

      if (appState === 'CHAR_SELECT' && p1Locked && p2Locked) {
        if (lockCountdown < 0) lockCountdown = 30;
        lockCountdown--;
        if (lockCountdown <= 0) {
          lockCountdown = -1;
          appState = (selectedModeIdx === 0 ? 'LADDER_BRACKET' : 'ARENA_SELECT');
        }
      }

      if (appState === 'ROUND_TRANSITION') {
        roundTransitionTimer--;
        if (roundTransitionTimer <= 0) {
          resetForNextRound();
        }
        return;
      }

      if (appState === 'CONTINUE_SCREEN') {
        continueFrameTimer++;
        if (continueFrameTimer >= 60) {
          continueFrameTimer = 0;
          continueCountdown--;
          if (continueCountdown <= 0) {
            campaignState.active = false;
            appState = 'TITLE';
          }
        }
        return;
      }

      if (appState === 'KNOCKDOWN') {
        if (knockdownData) {
          if (knockdownData.count > 10) {
            endRound(knockdownData.fallenId === 1 ? 2 : 1, '10-COUNT K.O.!');
            return;
          }

          knockdownData.timer++;

          // CPU Opponent recovery grit scaling
          if (knockdownData.fallenId === 2 && selectedModeIdx === 0) {
            const stage = campaignState.active ? campaignState.stageIdx : 0;
            const gritGain = (stage <= 1 ? 0.35 : (stage <= 3 ? 0.65 : 1.15));
            knockdownData.stamina += gritGain;
            if (knockdownData.stamina >= 100) {
              heGetsUp();
              return;
            }
          }

          if (knockdownData.timer >= knockdownData.refSpeed) {
            knockdownData.timer = 0;
            knockdownData.count++;
            play808Sfx('land');
            if (knockdownData.count > 10) {
              // 10-count knockout!
              endRound(knockdownData.fallenId === 1 ? 2 : 1, '10-COUNT K.O.!');
              return;
            }
          }
        }
      }

      if (appState !== 'PLAYING' && appState !== 'KNOCKDOWN' && appState !== 'KO') return;
      if (!p1 || !p2) return;

      if (appState === 'PLAYING') {
        timerFrameCounter++;
        if (timerFrameCounter >= 60) {
          timerFrameCounter = 0;
          if (roundTimer > 0) {
            roundTimer--;
            if (roundTimer === 0) {
              if (p1.hp > p2.hp) endRound(1);
              else if (p2.hp > p1.hp) endRound(2);
              else endRound(0);
            }
          }
        }
      }

      idleP1.update();
      idleP2.update();

      p1.update();
      p2.update();

      for (let i = globalParticles.length - 1; i >= 0; i--) {
        globalParticles[i].update();
        if (globalParticles[i].life <= 0) globalParticles.splice(i, 1);
      }

      for (let i = globalFloatingTexts.length - 1; i >= 0; i--) {
        globalFloatingTexts[i].update();
        if (globalFloatingTexts[i].life <= 0) globalFloatingTexts.splice(i, 1);
      }
    }
    function isStartKey(k) {

      } else if (appState === 'KO') {
        rematchToCharSelect();
      } else if (appState === 'PLAYING' || appState === 'KNOCKDOWN') {
        if (p1.superMeter >= 100) p1.triggerSuper();
        else p1.rotate(1);
      }
    });

    bindBtn('btnMode', () => {
      appState = 'CHAR_SELECT';
      gameState = 'PLAYING';
      p1Locked = false; p2Locked = false;
      lockCountdown = -1;
    });

    bindBtn('btnReset', () => {
      appState = 'TITLE';
      gameState = 'PLAYING';
      lockCountdown = -1;
    });

    
    bindBtn('btnSkin', () => {
      applyGbaSkin(currentSkinIdx + 1);
      play808Sfx('rotate');
    });

    bindBtn('btnStart', () => {
      if (appState === 'TITLE') { appState = 'MODE_SELECT'; play808Sfx('confirm'); }
      else if (appState === 'MODE_SELECT') { appState = 'CHAR_SELECT'; p1Locked = false; p2Locked = false; play808Sfx('confirm'); }
      else if (appState === 'CHAR_SELECT') { p1Locked = true; if (selectedModeIdx !== 1) p2Locked = true; play808Sfx('confirm'); }
      else if (appState === 'LADDER_BRACKET') { appState = 'STAGE_INTRO'; play808Sfx('confirm'); }
      else if (appState === 'STAGE_INTRO') { startMatch(); }
      else if (appState === 'STAGE_VICTORY_CUTSCENE') { appState = 'LADDER_SHOP'; play808Sfx('confirm'); }
      else if (appState === 'LADDER_SHOP') { campaignState.stageIdx++; saveCampaign(); appState = 'LADDER_BRACKET'; play808Sfx('confirm'); }
      else if (appState === 'VICTORY_END') { campaignState.active = false; appState = 'TITLE'; play808Sfx('confirm'); }
      else if (appState === 'CONTINUE_SCREEN') { campaignState.continues--; saveCampaign(); startMatch(); }
      else if (appState === 'KO') { rematchToCharSelect(); }
    });

    bindBtn('btnShoulderL', () => {
      goBack();
    });

    bindBtn('btnShoulderR', () => {
      if (appState === 'PLAYING') {
        if (p1.superMeter >= 100) p1.triggerSuper();
        else p1.dropHard();
      }
    });

    bindBtn('btnAudio', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? 'AUDIO: TRAP ON' : 'AUDIO: OFF';
    });

    // Direct Canvas Click Navigation for Desktop / Mobile
    const canvasEl = document.getElementById('picoCanvas');
    if (canvasEl) {
      canvasEl.addEventListener('click', (e) => {
        initAudio();
        const rect = canvasEl.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 128;
        const clickY = ((e.clientY - rect.top) / rect.height) * 128;

        // Top-Left Back Button (< BACK)
        if (clickX <= 28 && clickY <= 16 && appState !== 'TITLE' && appState !== 'PLAYING') {
          goBack();
          return;
        }

        if (appState === 'TITLE') {
          appState = 'MODE_SELECT';
          play808Sfx('confirm');
          return;
        }

        if (appState === 'MODE_SELECT') {
          // Check which mode was clicked (4 rows: Y=20..116, H=20 each, gap 4)
          for (let m = 0; m < 4; m++) {
            const my = 20 + m * 24;
            if (clickY >= my && clickY <= my + 20 && clickX >= 8 && clickX <= 120) {
              selectedModeIdx = m;
              break;
            }
          }
          if (selectedModeIdx === 0) {
            const saved = loadCampaign();
            if (saved && saved.stageIdx > 0) {
              campaignState = saved;
            } else {
              campaignState = { active: true, stageIdx: 0, purse: 0, upgrades: { pwr: 0, def: 0, spd: 0, diamondSeed: false, superRush: false }, continues: 3, totalScore: 0, startTime: Date.now() };
            }
          }
          appState = 'CHAR_SELECT';
          p1Locked = false;
          p2Locked = false;
          p1SelectIdx = 0;
          p2SelectIdx = 1;
          play808Sfx('confirm');
          return;
        }

        if (appState === 'LADDER_BRACKET') {
          appState = 'STAGE_INTRO';
          play808Sfx('confirm');
          return;
        }
        if (appState === 'STAGE_VICTORY_CUTSCENE') {
          appState = 'LADDER_SHOP';
          play808Sfx('confirm');
          return;
        }

        if (appState === 'STAGE_INTRO') {
          startMatch();
          return;
        }
        if (appState === 'LADDER_SHOP') {
          // Check if an upgrade item was clicked (6 rows at Y=22 + idx*15)
          for (let s = 0; s < 6; s++) {
            const sy = 22 + s * 15;
            if (clickY >= sy && clickY <= sy + 13 && clickX >= 6 && clickX <= 122) {
              shopSelectedIdx = s;
              if (s === 5) {
                // Next Bout!
                campaignState.stageIdx++;
                saveCampaign();
                appState = 'LADDER_BRACKET';
                play808Sfx('confirm');
              } else if (s === 0 && campaignState.upgrades.pwr < 3) {
                const cost = CAMPAIGN_UPGRADE_TIERS.pwr[campaignState.upgrades.pwr].cost;
                if (campaignState.purse >= cost) { campaignState.purse -= cost; campaignState.upgrades.pwr++; saveCampaign(); play808Sfx('fuse'); }
              } else if (s === 1 && campaignState.upgrades.def < 3) {
                const cost = CAMPAIGN_UPGRADE_TIERS.def[campaignState.upgrades.def].cost;
                if (campaignState.purse >= cost) { campaignState.purse -= cost; campaignState.upgrades.def++; saveCampaign(); play808Sfx('fuse'); }
              } else if (s === 2 && campaignState.upgrades.spd < 3) {
                const cost = CAMPAIGN_UPGRADE_TIERS.spd[campaignState.upgrades.spd].cost;
                if (campaignState.purse >= cost) { campaignState.purse -= cost; campaignState.upgrades.spd++; saveCampaign(); play808Sfx('fuse'); }
              } else if (s === 3 && !campaignState.upgrades.diamondSeed) {
                if (campaignState.purse >= 1500) { campaignState.purse -= 1500; campaignState.upgrades.diamondSeed = true; saveCampaign(); play808Sfx('fuse'); }
              } else if (s === 4 && !campaignState.upgrades.superRush) {
                if (campaignState.purse >= 1200) { campaignState.purse -= 1200; campaignState.upgrades.superRush = true; saveCampaign(); play808Sfx('fuse'); }
              }
              return;
            }
          }
          return;
        }

        if (appState === 'VICTORY_END') {
          campaignState.active = false;
          appState = 'TITLE';
          play808Sfx('confirm');
          return;
        }

        if (appState === 'CONTINUE_SCREEN') {
          campaignState.continues--;
          saveCampaign();
          startMatch();
          return;
        }

        if (appState === 'FIGHTER_BIO') {
          appState = 'CHAR_SELECT';
          p1SelectIdx = bioFighterIdx;
          play808Sfx('nav');
          return;
        }

        if (appState === 'ARENA_SELECT') {
          for (let idx = 0; idx < 6; idx++) {
            const r = Math.floor(idx / 3);
            const c = idx % 3;
            const cx = 6 + c * 40;
            const cy = 18 + r * 50;
            if (clickX >= cx && clickX <= cx + 36 && clickY >= cy && clickY <= cy + 46) {
              if (selectedArenaIdx === idx) {
                play808Sfx('confirm');
                startMatch();
              } else {
                selectedArenaIdx = idx;
                play808Sfx('nav');
              }
              return;
            }
          }
          return;
        }

        if (appState === 'KO') {
          rematchToCharSelect();
          return;
        }

        if (appState === 'CHAR_SELECT') {
          // Portrait panel opens the bio screen
          if (clickX >= 8 && clickX <= 38 && clickY >= 58 && clickY <= 106 && !p1Locked) {
            bioFighterIdx = p1SelectIdx;
            appState = 'FIGHTER_BIO';
            play808Sfx('nav');
            return;
          }

          // Check grid click (X: 8..124, Y: 15..51) — selects, then locks
          if (clickY >= 15 && clickY <= 51 && clickX >= 8 && clickX <= 124) {
            const col = Math.floor((clickX - 8) / 17);
            const row = Math.floor((clickY - 15) / 18);
            const idx = row * 7 + col;
            if (idx >= 0 && idx < 14) {
              p1SelectIdx = idx;
            }
          }
          p1Locked = true;
          if (selectedModeIdx !== 1) p2Locked = true;
          play808Sfx('confirm');
        }
      });
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
